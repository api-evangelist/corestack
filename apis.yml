apis:
- name: CoreStack External API
  description: >-
    REST API covering the whole CoreStack governance surface — authorization, identity and RBAC,
    guardrail policies, account governance, operations and automation, security, cost and budgets,
    access, resources, compliance assessments and self-service. Published as a live Swagger 2.0
    document with 838 uniquely-identified operations. Authentication is a short-lived X-Auth-Token
    minted from an Access Key / Secret Key pair, paired with an X-Auth-User header.
  humanURL: https://docs.corestack.io/reference
  baseURL: https://api.corestack.io/
  tags:
  - cloud-governance
  - finops
  - compliance
  - multi-cloud
  - policy-as-code
