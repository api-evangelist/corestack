apis:
- name: CoreStack MCP Server
  description: >-
    Hosted, unified Model Context Protocol server exposing 100 documented tools across five domains —
    Common/Auth (10), FinOps (24), Graphion (45), Assessment (15) and Workload (6) — at a single /mcp
    endpoint on each regional environment. Streamable HTTP transport, authenticated either by OAuth 2.1
    (authorization code + PKCE, dynamic client registration) or by X-API-Access-Key / X-API-Secret-Key
    headers. Disabled by default and enabled per account by an Account Administrator; every tool call
    inherits the calling user's existing CoreStack role permissions.
  humanURL: https://docs.corestack.io/docs/mcp-tool-guide
  baseURL: https://cloud.corestack.io/mcp
  tags:
  - MCP
  - agent-native
  - FinOps
  - CNAPP
  - Cloud Governance
  tags_raw:
  - mcp
  - agent-native
  - finops
  - cnapp
  - cloud-governance
