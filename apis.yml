description: >-
  CoreStack is a multi-cloud governance and security platform that unifies FinOps (cost visibility,
  budgets, anomaly detection, rightsizing and commitment optimization), CloudOps (workload lifecycle,
  tagging, automation and self-service), SecOps/compliance (policy guardrails, posture management and
  continuous assessment against ISO, NIST, HIPAA, PCI DSS, CIS and the AWS Well-Architected Framework),
  and Graphion, its AI-native CNAPP layer covering SBOM, container findings and vulnerability
  intelligence, across AWS, Microsoft Azure, Google Cloud and Oracle Cloud Infrastructure. Every one of
  those capabilities is exposed through the CoreStack External API — a Swagger 2.0 contract of 838
  operations across 767 paths, published live at the API host — and, since 2026, through a hosted
  unified MCP server that surfaces 100 documented tools to AI clients over OAuth or API key headers.
