  section: What's Coming in the Next Release?
  note: >-
    Each External APIs release note ends with the NEXT build's planned additions and changes, named
    to the operation and to the individual field. 6.2 (2603) names three new service-account
    operations and twenty changing operations planned for 2604. This is a published API roadmap in
    all but name, and it gives an integrator advance notice at field granularity.

