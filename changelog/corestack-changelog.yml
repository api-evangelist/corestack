scheme:
  style: numbered platform releases with a build number
  format: '<major>.<minor> (<build>)'
  example: 6.2 (2603)
  cadence: roughly every one to three months
  note: >-
    CoreStack runs TWO parallel changelogs and the distinction matters. "Release Notes <version>"
    covers the product and the console. "External APIs <version>" is a separate, per-release document
    written for API consumers, and it is unusually specific: every added, changed, decommissioned and
    deprecated operation is listed by METHOD + PATH + summary, and every changed operation itemises
    the individual request parameters and response fields added or removed. That is a materially
    better API changelog than most enterprise platforms publish, and it is the strongest single
    artifact in CoreStack's developer surface.

