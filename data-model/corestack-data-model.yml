versioned_entities:
  note: >-
    A distinct and unusually consistent pattern: several definition-type entities carry an explicit
    version sub-resource with its own id, history endpoint and set-state endpoint. `version_id`
    appears in 19 paths.
  entities:
  - WorkloadDefinition
  - AssessmentDefinition
  - DashboardDefinition
  - DimensionDefinition
  - BillingPlanDefinition
  - StackDefinition
  - SbomDefinition

naming_inconsistencies:
- issue: service_account_id vs cloud_account_id
  detail: >-
    Both refer to an onboarded cloud account. Newer subsystems (v2 service_account, Graphion) use
    service_account_id; older governance and cost paths use cloud_account_id. The MCP server exposes
    both `get_cloud_accounts` and `service_account_list_and_retrieval` for the same thing.
- issue: sys_id
  detail: >-
    Appears on 17 definitions — a ServiceNow-native identifier leaking into CoreStack's own schemas
    through the ITSM integration surface rather than being namespaced.
- issue: placeholder operationIds
  detail: >-
    The WorkloadDefinitions, WafAssessmentDefinitions and related families carry auto-generated
    operationIds such as `batch@@@11`, `get@@@12`, `create@@@9`, `remove@@@5`, `set-state@@@6`, and
    one operation is literally named `Delete Budget` with a space. These are still unique, so the
    spec validates, but they are not usable as stable client-facing symbols and they are the reason
    several MCP tools in mcp/corestack-tool-crosswalk.yml could not be bound with confidence.
