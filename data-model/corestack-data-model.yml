note: >-
  Derived from the id-reference fields and path parameters of the published Swagger 2.0 contract. The
  spec carries 2,891 definitions, most of them per-operation request/response envelopes rather than
  domain entities, so the graph below is the entity spine the identifiers reveal rather than a
  transcription of every schema. The single dominant fact about CoreStack's data model is that almost
  everything hangs off `tenant_id`: it appears in 163 of 767 paths and on 119 definitions, more than
  twice as often as any other identifier. Nothing in this API is reachable without first resolving
  tenancy.

id_prefixes:
  published: false
  note: >-
    CoreStack does not publish typed, prefixed identifiers (the stripe `cus_` / `ch_` pattern). Ids
    are opaque and untyped, so an agent holding a bare id cannot tell which entity it belongs to and
    must track provenance itself.

root_entities:
- name: MasterAccount
  identifier: master_account_id
  path_occurrences: 17
  description: >-
    Top of the hierarchy. A CoreStack subscription. A user may have access to several and switches
    between them with SwitchMasterAccount (REST) or set_master_account (MCP).
- name: Tenant
  identifier: tenant_id
  path_occurrences: 163
  definition_occurrences: 119
  description: >-
    The isolation boundary — a department, business unit or team. Mandatory on most operations. A
    master account holds many tenants; a user may be granted access to several with different roles
    in each.
- name: User
  identifier: user_id
  path_occurrences: 19
  description: Platform identity, optionally federated via SSO/LDAP, holding roles and API keys.
- name: ServiceAccount
  identifier: service_account_id
  path_occurrences: 43
  definition_occurrences: 64
  description: >-
    An onboarded cloud account (AWS/Azure/GCP/OCI). The API uses `service_account_id` and
    `cloud_account_id` for what is largely the same concept in different subsystems — a real naming
    inconsistency in the contract, not an artefact of this derivation.

