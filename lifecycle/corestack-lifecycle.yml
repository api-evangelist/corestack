roadmap:
  published: true
  url: https://docs.corestack.io/docs/external-apis-62-2603
  form: >-
    A "What's Coming in the Next Release?" section at the end of every External APIs release note,
    naming the next build's new operations and changing operations down to the individual request
    parameter and response field.
  note: >-
    Not a marketing roadmap page — an operation-level change forecast for the next build. For an API
    consumer this is more useful than a themed roadmap, and it is the reason a Roadmap pointer is
    warranted here despite there being no page titled "roadmap".

