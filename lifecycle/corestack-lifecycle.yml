versioning:
  scheme: uri-path
  versions_in_use:
  - v1
  - v2
  current: mixed — v1 and v2 coexist and 205 of 767 paths carry no version segment at all
  policy_published: false
  docs: https://docs.corestack.io/docs/corestack-api-modules
  note: >-
    There is no written versioning policy. What v1 means, what promotes a path to v2, and what
    stability guarantee an unversioned path carries are all undocumented. In practice v2 appears to
    be where newer subsystems land (billing aggregation, savings plans, cost anomaly dimensions,
    billing metrics, service accounts) while v1 and the unversioned root carry the older estate.

release_line:
  scheme: '<major>.<minor> (<build>)'
  current: 6.2 (2603)
  released: '2026-07'
  cadence: one to three months
  detail: changelog/corestack-changelog.yml

deprecation:
  policy_url: null
  policy_published: false
  practice_documented: true
  practice_url: https://docs.corestack.io/docs/whats-deprecated
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    CoreStack has a real deprecation PRACTICE without a deprecation POLICY. Every External APIs
    release note carries a "What's Decommissioned" section, and release 4.3 (2401) published a
    dedicated "What's Deprecated" page listing roughly thirty operations struck through by method
    and path. What is missing is the contract around it: no stated notice period, no minimum support
    window, no migration guarantee, and no runtime signal. The published specification marks ZERO of
    its 838 operations `deprecated: true`, and the API emits neither an RFC 8594 `Sunset` header nor
    a `Deprecation` header, so a running integration learns nothing at call time — the only warning
    channel is reading the release notes.

deprecated_operations_in_spec: []
