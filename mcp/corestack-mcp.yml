generated: '2026-08-11'
method: searched
status: published
source: https://docs.corestack.io/docs/mcp-tool-guide
docs:
  tool_guide: https://docs.corestack.io/docs/mcp-tool-guide
  client_configuration: https://docs.corestack.io/docs/mcp-client-configuration
server:
  name: corestack
  transport: http
  url: https://cloud.corestack.io/mcp
  url_template: https://{environment}.corestack.io/mcp
  environments:
  - cloud
  - portal
  - mea
  - in
  - us3
  note: CoreStack consolidated what were previously separate FinOps / Assessment / Graphion MCP servers
    into a single unified /mcp endpoint. The server is DISABLED BY DEFAULT and must be switched on per
    account by an Account Administrator (Settings > Account Management > Account Info > Advanced Settings
    > MCP Server), so a tools/list probe from outside a tenant cannot enumerate it.
authentication:
  methods:
  - type: oauth2
    grant: authorization_code
    pkce: S256
    dynamic_client_registration: true
    authorization_server: https://cloud.corestack.io/mcp
    metadata: well-known/corestack-oauth-authorization-server.json
    scopes:
    - openid
    - email
    - profile
  - type: headers
    headers:
    - X-API-Access-Key
    - X-API-Secret-Key
    note: Access/secret key pairs are generated per user by an Account Administrator from Identity and
      Access Management > Users > Generate Key, and are delivered by email.
  session_model: The MCP client must call the `authenticate` tool first. CoreStack then establishes a
    session scoped to the caller's last-used master account and tenant, and every subsequent tool call
    reuses that session's implicit auth context. `set_active_tenant` / `set_master_account` switch it.
    Every tool call runs inside the caller's existing CoreStack RBAC role — the server grants no access
    beyond what the user already has.
response_envelope:
  shape: '{Summary, Output}'
  note: Exact keys vary by tool; some use lowercase {summary, output}.
probe:
  url: https://cloud.corestack.io/mcp
  method: POST
  body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  http_status: 401
  www_authenticate: Bearer realm="CoreStack MCP", resource_metadata="https://cloud.corestack.io/mcp/.well-known/oauth-protected-resource"
  note: Live tools/list is auth-gated, so the tool inventory below is transcribed from the provider's
    own published MCP Tool Guide (names, domains, destructive markers and descriptions are verbatim-derived
    from that page). Per-tool inputSchema requires authenticated introspection and is NOT recorded here
    — the parameter tables in the provider's guide are the human-readable substitute.
coverage:
  tools_documented: 100
  domains:
    Common: 10
    FinOps: 24
    Graphion: 45
    Assessment: 15
    Workload: 6
  destructive: 4
tools:
- name: get_cost_aggregation
  domain: FinOps
  destructive: false
  description: Retrieve snapshot cost aggregation totals grouped by dimensions for a time period (POST
    /v2/billing/aggregation) — a single aggregated snapshot, not a time series.
- name: get_billing_metrics
  domain: FinOps
  destructive: false
  description: Return the billing metrics (cost types) available for the given cloud accounts, with frontend-friendly
    display names (including virtual Margin metrics).
- name: get_cost_aggregation_trend
  domain: FinOps
  destructive: false
  description: Low-level passthrough tool for parameterized billing queries against the cost aggregation
    layer — an escape hatch for any cost/usage question not covered by higher-level tools. Returns a time
    series (not a single snapshot).
- name: get_billing_usage_trend
  domain: FinOps
  destructive: false
  description: Retrieves billing usage trends over time — resource consumption (GB, hours, API calls),
    not cost.
- name: get_billing_rate_trend
  domain: FinOps
  destructive: false
  description: Retrieves billing rate trends over time — per-unit cost ($/GB, $/hour), computed as cost
    ÷ usage. Zero usage yields None rates.
- name: build_filter_query
  domain: FinOps
  destructive: false
  description: Build a QueryOperator filter tree from up to 34 structured filter dimensions, composed
    via AND/OR/NOT. Must always be called first in FinOps billing workflows; rejects an empty {}.
- name: get_cloud_accounts
  domain: FinOps
  destructive: false
  description: Discover cloud accounts (service accounts) for one or more tenants — the primary account-discovery
    tool. Call before any cost/billing tool that needs service_account_ids.
- name: get_budgets
  domain: FinOps
  destructive: false
  description: Lists all budgets with aggregated summary and health indicators. Filters by status, provider,
    scope, frequency; calculates health percentages and over-budget items.
- name: get_budget_detail
  domain: FinOps
  destructive: false
  description: Retrieves detailed configuration and metrics for a single budget by ID (merges view, alerts,
    and history into one response). Auxiliary calls (alerts/history) fail open.
- name: get_ri_recommendations
  domain: FinOps
  destructive: false
  description: Get Reserved Instance (RI) purchase recommendations to reduce costs.
- name: get_ri_reservation_coverage
  domain: FinOps
  destructive: false
  description: Get reservation coverage for a specific RI — the percentage of eligible usage covered.
- name: get_ri_reservation_utilization
  domain: FinOps
  destructive: false
  description: Get utilization metrics for a specific RI — how much of the purchased capacity is actually
    used.
- name: get_ri_reservations
  domain: FinOps
  destructive: false
  description: List Reserved Instance reservations to discover reservation IDs and basic details.
- name: get_cost_optimization_by_types
  domain: FinOps
  destructive: false
  description: Fetch cost optimization data from the executive-dashboard cost-optimization-by-types endpoint.
- name: get_right_sizing_recommendations
  domain: FinOps
  destructive: false
  description: Fetch detailed right-sizing recommendations for a specific cloud account — current vs.
    recommended SKU per resource.
- name: get_recommendation_resources
  domain: FinOps
  destructive: false
  description: Retrieve resource-level details for usage optimization recommendations — drill-down of
    a recommendation's underlying resources with current vs. recommended config.
- name: get_savings_summary
  domain: FinOps
  destructive: false
  description: 'Get a combined savings overview: RI recommendation savings + cost saved to date.'
- name: get_savings_plans_details
  domain: FinOps
  destructive: false
  description: List purchased savings plans with details, excluding utilization time-series.
- name: get_savings_plans_utilization
  domain: FinOps
  destructive: false
  description: Fetch paginated utilization time-series for a single purchased savings plan.
- name: get_savings_plans_coverage
  domain: FinOps
  destructive: false
  description: 'Compute portfolio-wide savings plans coverage summary: active vs. inactive counts, commitment
    totals, average utilization, breakdowns, and plans expiring soon.'
- name: get_anomalies
  domain: FinOps
  destructive: false
  description: Detect and summarize billing cost anomalies (mirrors the UI Anomaly Summary/Details page).
