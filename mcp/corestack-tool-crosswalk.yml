source: mcp/corestack-mcp.yml + openapi/corestack-external-api-openapi-original.json
note: >-
  CoreStack ships two overlapping-but-non-identical projections of one governance core: a 838-operation
  Swagger 2.0 REST contract published live at api.corestack.io/swagger.json, and a 100-tool unified MCP
  server at /mcp. Neither is a superset. The MCP server is a curated read-mostly agent surface over
  roughly a tenth of the REST estate, and it adds four composite/AI-agent tools plus a session model
  (authenticate / set_active_tenant / set_master_account) that has no direct REST equivalent. Because
  live tools/list is auth-gated (401), bindings below are mapped by name and semantics against the
  published REST contract, and confidence is stated honestly per row. `high` means the provider's own
  tool guide names the backing endpoint or the operation is an exact one-to-one match on path and verb;
  `medium` means the capability is unambiguous but the exact backing operation may be one of a small
  family; `low` means the REST family is identifiable but the specific operation is not determinable
  from public material.

surfaces:
  openapi:
    file: openapi/corestack-external-api-openapi-original.json
    version: swagger 2.0
    host: https://api.corestack.io
    alias_host: https://api-discover.corestack.io
    operations: 838
    paths: 767
    gated: false
    note: The specification document itself is anonymous; calling it requires X-Auth-User + X-Auth-Token.
  mcp:
    url: https://cloud.corestack.io/mcp
    tools_documented: 100
    gated: true
    note: tools/list returns 401 with an OAuth challenge; enabled per account by an administrator.
  graphql:
    present: false

