mcp_only:
- tool: authenticate
  reason: >-
    Establishes the MCP session and auto-selects the caller's last-used master account and tenant.
    The REST equivalent is authToken (POST /v1/auth/tokens), but the MCP tool returns session state
    (master_account_id, tenant_id, available_master_account_ids) rather than a bearer token, so it
    is a transport-layer concept, not a proxied operation.
- tool: set_active_tenant
  reason: MCP session state mutation; REST carries tenant_id as a path/body parameter per call.
- tool: set_master_account
  reason: MCP session state mutation; the REST analogue SwitchMasterAccount mints a NEW token instead.
- tool: check_connection
  reason: Session introspection with no REST counterpart.
- tool: build_filter_query
  reason: >-
    Client-side query builder that composes a QueryOperator filter tree from up to 34 dimensions.
    It calls nothing — it exists because the REST billing endpoints take an opaque nested filter
    object that an agent cannot construct reliably from the spec alone. This is the clearest single
    piece of evidence that the MCP surface is a designed agent affordance rather than a REST proxy.
- tool: list_agent_types
  reason: AI Agent surface; no matching published REST operation.
- tool: list_system_prompts
  reason: AI Agent surface; no matching published REST operation.
- tool: file_bug
  reason: Support/ticketing action with no public REST operation.
  destructive: true
- tool: dashboard_infrastructure_summary
  reason: Server-side composite joining org hierarchy with infrastructure inventory.
- tool: resource_dependency_get
  reason: >-
    Graph traversal over the resource inventory (given a VPC, return dependents). Backed by
    CoreStack's knowledge-graph layer, not by a single published REST operation.
- tool: resource_change_list
  reason: Change-history query requiring the GraphDB tenant feature; no public REST equivalent.
- tool: resource_list_by_schema
  reason: Schema-path (category/component) resource listing with no matching REST operation.
- tool: sbom_version_compare_builds
  reason: Composite build-diff over two SBOM versions.
- tool: sbom_version_diff_get_batch
  reason: Batch diff retrieval; the REST surface exposes version_diff only as a dashboard summary.
- tool: infra_threat_list_and_details
  reason: Chained list-then-detail composite, explicitly described as a two-step chain in the guide.
- tool: submit_assessment_answer
  reason: >-
    Writes an answer against a Well-Architected best practice. The REST assessment-definition family
    carries only auto-generated placeholder operationIds, so no verifiable binding exists.
  destructive: true
- tool: create_workload
  reason: >-
    Creates a workload definition. The REST family (/v1/workload-definition/create) exists but
    carries the placeholder operationId create@@@12, so the binding is not verifiable by id.
  destructive: true

rest_only:
- capability: Identity, users, roles and RBAC
  note: >-
    User creation, user groups, delegation, role management, SSO configuration and password flows are
    entirely REST. No MCP tool touches identity — a deliberate and correct exclusion for an agent
    surface, and worth stating rather than reading as a gap.
- capability: Policy authoring and execution
  note: >-
    CreatePolicySchedules, ExecutePolicy, ExecuteRecommendation, DeletePolicySchedules and the whole
    guardrail write path are REST-only. The MCP server reads policy metadata and job results but
    cannot execute a policy or apply a remediation.
- capability: Cloud account onboarding
  note: >-
    Onboarding AWS/Azure/GCP/OCI accounts and billing accounts is REST-only; the tool guide states
    plainly that MCP tools "don't onboard new accounts".
- capability: Budget writes
  note: BudgetCreate, BudgetUpdate and Delete Budget are REST-only; MCP exposes budgets read-only.
- capability: Automation, templates, scripts and jobs
  note: >-
    ExecuteTemplate, ScanScript, DescribeScript, ListScriptJobs, AwsSsm command and automation
    families, Azure DevOps pipeline dashboards — none are surfaced as MCP tools.
- capability: ITSM and notification integrations
  note: ServiceNow, Jira Service Management, Freshservice and Zoho ServiceDesk operations are REST-only.
- capability: Dashboards, widgets and reports
  note: >-
    Dashboard definitions, saved views, dashboard versions, NextGen Reports and report subscriptions
    are REST-only. The MCP server returns data, not dashboard configuration.
- capability: Kubernetes agent lifecycle
  note: >-
    Manifest generation, presigned upload URLs and agent sync status are REST-only; MCP only queries
    pod resources from the inventory.
- capability: Billing plan definitions, pricing, markups and currency
  note: >-
    BillingPlanDefinitions, BillingPlanDefinitionVersions, Pricing, markups/discounts and
    CurrencyExchangeConfiguration are REST-only — the partner/MSP monetization surface.

