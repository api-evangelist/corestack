    AIAgentSummary:
      properties:
        agent_id:
          type: string
          description: Agent identity resolved from spans (AgentCore runtime id or service name)
        agent_name:
          type: string
          description: Agent display name derived from the span service name
        service_account_id:
          type: string
          description: Service account ID linked to the Agent
          x-cs-type: ObjectId
        traces:
          type: integer
          description: Distinct trace count in the time range
        spans:
          type: integer
          description: Distinct span count in the time range
        total_tokens:
          type: integer
          description: Sum of total tokens in the time range
        total_input_cost:
          type: number
          description: Sum of span input cost in the time range, priced from published unit rates
        total_output_cost:
          type: number
          description: Sum of span output cost in the time range, priced from published unit rates
      type: object
    AIAgentTracesSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: start_time
          enum:
          - start_time
          x-cs-enum-type: AIAgentTracesSortColumn
        ascending:
          type: boolean
      type: object
    AIAgentsObservabilityTracesBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/AIAgentTraceSpan'
      type: object
    AIAgentTraceSpan:
      properties:
        trace_id:
          type: string
          description: Trace ID
        span_id:
          type: string
          description: Span ID
        parent_span_id:
          type: string
          description: Parent span ID
        name:
          type: string
          description: Span name
        kind:
          type: string
          description: OTEL span kind
        start_time:
          type: string
          format: date-time
          description: Span start time (ISO-8601)
        end_time:
          type: string
          format: date-time
          description: Span end time (ISO-8601)
        duration_ms:
          type: number
          description: Span duration / latency in milliseconds
        status_code:
          type: string
          description: Span status code
        status_message:
          type: string
          description: Span status message
        input_tokens:
          type: integer
          description: Input token count
        output_tokens:
          type: integer
          description: Output token count
        total_tokens:
          type: integer
          description: Total token count
        input_cost:
          type: number
          description: Input cost, priced from the region's published unit rates
        output_cost:
          type: number
          description: Output cost, priced from the region's published unit rates
        attributes:
          type: array
          description: Span attribute key/value pairs (e.g. 'gen_ai.request.model', 'session.id', 'aws.genai.span_kind')
          items:
            $ref: '#/components/schemas/KeyValuePair'
      type: object
    KeyValuePair:
      properties:
        key:
          type: string
          description: Key of the pair
        value:
          type: string
          description: Value of the pair
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    KeyValues:
      properties:
        key:
          type: string
          description: Key of the pair
        values:
          type: array
          description: Values of the key
          items:
            type: string
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    AIAgentsObservabilityListAttributesResponse:
      properties:
        attributes:
          type: array
          description: Distinct span attribute keys and their distinct values across matched spans
          items:
            $ref: '#/components/schemas/KeyValues'
      type: object
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    AIAgentsObservabilitySummaryResponse:
      properties:
        agents:
          type: array
          description: Agents with their summary metrics
          items:
            $ref: '#/components/schemas/AIAgentSummary'
      type: object
    AIAgentTracesFilter:
      required:
      - agent_id
      - end_date
      - start_date
      properties:
        agent_id:
          type: string
          description: AgentCore runtime ID whose spans are listed
        agent_name:
          type: string
          description: Agent name (aws.local.service) for external agents that have no runtime ID. Provide either agent_id or agent_name.
        start_date:
          type: string
          format: date-time
          description: Start of the time range
        end_date:
          type: string
          format: date-time
          description: End of the time range
        attribute:
          description: Optional span-attribute filter
          $ref: '#/components/schemas/KeyValues'
        exclude_transport_spans:
          type: boolean
          description: When true, omits pure transport spans (HTTP/RPC hops with no GenAI work). Matches the timeline's transport toggle.
        trace_id:
          type: string
          description: Restrict the listing to a single trace. Used by the trace detail view to load spans the timeline filtered out.
      type: object
    BatchRequest:
      properties:
        ids:
          type: array
          description: Identifiers to fetch
          items:
            type: string
      type: object
    AIAgentsObservabilityRequestBase:
      required:
      - end_date
      - filters
      - start_date
      properties:
        filters:
          description: Query operator filter; pass a ServiceAccountQueryOperator to scope agents by service account
          $ref: '#/components/schemas/QueryOperator'
        start_date:
          type: string
          format: date-time
          description: Start of the time range
        end_date:
          type: string
          format: date-time
          description: End of the time range
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
