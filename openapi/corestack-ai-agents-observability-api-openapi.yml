openapi: 3.2.0
info:
  title: CoreStack External AI Agents Observability API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: AI Agents observability APIs (AgentCore agent discovery and span/trace collection)
servers:
- url: /
tags:
- name: AI Agents Observability
  description: AI Agents observability APIs (AgentCore agent discovery and span/trace collection)
paths:
  /v1/operations/ai_agents_observability/list_attributes:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAgentsObservabilityListAttributesResponse'
      description: List distinct span attribute keys and their distinct values for the requested service accounts and time range
      operationId: AIAgentsObservabilityListAttributes
      security:
      - auth_token: []
      tags:
      - AI Agents Observability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAgentsObservabilityRequestBase'
        required: true
      summary: AI agents observability list attributes
      x-summary-source: derived
  /v1/operations/ai_agents_observability/summary:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAgentsObservabilitySummaryResponse'
      description: List AI agents with summary metrics (sessions, traces, spans, tokens, cost) for the requested service accounts and time range
      operationId: AIAgentsObservabilitySummary
      security:
      - auth_token: []
      tags:
      - AI Agents Observability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAgentsObservabilityRequestBase'
        required: true
      summary: AI agents observability summary
      x-summary-source: derived
  /v1/operations/ai_agents_observability/traces/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAgentsObservabilityTracesBatchResponse'
      description: Fetch span details for a batch of span ids, returned as a map keyed by span id
      operationId: AIAgentsObservabilityBatchTraces
      security:
      - auth_token: []
      tags:
      - AI Agents Observability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      summary: AI agents observability batch traces
      x-summary-source: derived
  /v1/operations/ai_agents_observability/traces/list:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      description: List span ids for an agent over a time range, optionally filtered by a span attribute key/values. Use the returned ids with the batch API to fetch span details.
      operationId: AIAgentsObservabilityListTraces
      security:
      - auth_token: []
      tags:
      - AI Agents Observability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAgentsObservabilityListTracesRequest'
        required: true
      summary: AI agents observability list traces
      x-summary-source: derived
