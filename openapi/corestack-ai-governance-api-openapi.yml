    AIGovernanceLabelFiltersResponse:
      properties:
        labels:
          type: array
          description: Distinct label keys and the values observed for each, for building filter UIs
          items:
            $ref: '#/components/schemas/KeyValues'
      type: object
    AIGovernanceRequestBase:
      required:
      - end_date
      - filters
      - start_date
      properties:
        filters:
          description: Query operator for filtering
          $ref: '#/components/schemas/QueryOperator'
        start_date:
          type: string
          format: date-time
          description: Start date for metrics
        end_date:
          type: string
          format: date-time
          description: End date for metrics
      type: object
    AIPlaygroundListModelsRequest:
      required:
      - region
      - service_name
      properties:
        service_name:
          type: string
          description: Hyperscaler service name
          example: AWS
          enum:
          - AWS
          - Azure
          - AzureStack
          - Azure_CSP
          - Azure_CSP-Direct
          - Azure_EA
          - Azure_MCA
          - Cloudstack
          - GCP
          - MS_VMM
          - OCI
          - Openstack
          - PrivateCloud
          - Rackspace
          - VMware
          - VMware_VCD
          - vCenter
          x-cs-enum-type: CloudServiceName
        region:
          type: string
          description: Hyperscaler region
      type: object
    AIGovernanceRequest:
      allOf:
      - $ref: '#/components/schemas/AIGovernanceRequestBase'
      - properties:
          search:
            type: string
            description: Search term to be matched against the prompt, model, provider, region, and ID.
        type: object
    AiGovernancePromptSummary:
      allOf:
      - $ref: '#/components/schemas/AiGovernanceModelSummary'
      - properties:
          prompt:
            type: string
            description: Prompt text submitted to the model
          prompt_id:
            type: string
            description: Unique identifier for the prompt invocation
        type: object
    PromptAnalyticsListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/PromptAnalyticsSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/AIGovernanceRequest'
      type: object
    PromptRecommendationAggregateResponse:
      properties:
        prompt_recommendations:
          type: array
          description: Aggregated recommendation items
          items:
            $ref: '#/components/schemas/PromptRecommendationItem'
      type: object
    KeyValues:
      properties:
        key:
          type: string
          description: Key of the pair
        values:
          type: array
          description: Values of the key
          items:
            type: string
      type: object
    AIPlaygroundModelInput:
      required:
      - model_id
      - region
      properties:
        model_id:
          type: string
          description: Bedrock model ID or inference profile ID
        parameters:
          description: Converse inference parameters
          $ref: '#/components/schemas/AIPlaygroundParameters'
        region:
          type: string
          description: AWS region
      type: object
    PromptRecommendationBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/PromptRecommendationDetailItem'
      type: object
    AIPlaygroundModelComparisonRequest:
      required:
      - service_account_id
      properties:
        models:
          type: array
          description: Models to invoke
          items:
            $ref: '#/components/schemas/AIPlaygroundModelInput'
        prompts:
          type: array
          description: Prompts to run against each model
          items:
            $ref: '#/components/schemas/AIPlaygroundPromptInput'
        service_account_id:
          type: string
          description: AWS service account ID
          x-cs-type: ObjectId
      type: object
    AIPlaygroundModelSummary:
      properties:
        model_id:
          type: string
          description: Model ID
        input_modalities:
          type: array
          description: Supported input modalities
          items:
            type: string
        model_name:
          type: string
          description: Display name
        output_modalities:
          type: array
          description: Supported output modalities
          items:
            type: string
        model_provider:
          type: string
          description: Model provider, extracted from model ID prefix
        model_type:
          type: string
          description: Model source type
          example: FOUNDATION_MODEL
          enum:
          - FOUNDATION_MODEL
          - INFERENCE_PROFILE
          - ALL
          x-cs-enum-type: AIPlaygroundModelType
      type: object
    PromptAnalyticsKpiSummaryResponse:
      properties:
        models:
          type: array
          description: 'Model Summary For the Prompts '
          items:
            $ref: '#/components/schemas/AiGovernanceModelSummary'
        high_latency_prompts:
          type: array
          description: 'Model Summary For the Prompts '
          items:
            $ref: '#/components/schemas/AiGovernancePromptSummary'
        low_latency_prompts:
          type: array
          description: 'Model Summary For the Prompts '
          items:
            $ref: '#/components/schemas/AiGovernancePromptSummary'
        high_cost_prompts:
          type: array
          description: 'Model Summary For the Prompts '
          items:
            $ref: '#/components/schemas/AiGovernancePromptSummary'
        low_cost_prompts:
          type: array
          description: 'Model Summary For the Prompts '
          items:
            $ref: '#/components/schemas/AiGovernancePromptSummary'
      type: object
    PromptAnalyticsSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: invoked_at
          enum:
          - invoked_at
          x-cs-enum-type: PromptAnalyticsSortColumn
        ascending:
          type: boolean
      type: object
    AIPlaygroundParameters:
      properties:
        max_tokens:
          type: integer
          description: Maximum response tokens
        stop_sequences:
          type: array
          description: Stop sequences
          items:
            type: string
        temperature:
          type: number
          description: Sampling temperature
        top_p:
          type: number
          description: Top P sampling value
      type: object
    PromptRecommendationFetchRequest:
      required:
      - service_account_id
      properties:
        service_account_id:
          type: string
          description: Service account the prompt belongs to
          x-cs-type: ObjectId
        prompt_id:
          type: string
          description: Prompt ID to fetch the recommendation for; either this or sys_id is required
        sys_id:
          type: string
          description: Prompt analytics record ID to fetch the recommendation for; either this or prompt_id is required
          x-cs-type: ObjectId
      type: object
    AiGovernanceModelSummary:
      properties:
        model_name:
          type: string
          description: Name of the model that handled the invocation
        input_tokens:
          type: integer
          description: Number of input tokens consumed
        latency_ms:
          type: number
          description: End-to-end latency in milliseconds
        output_tokens:
          type: integer
          description: Number of output tokens produced
        prompt_count:
          type: integer
          description: Number of prompts invoked in the model
        prompt_input_cost:
          type: number
          description: Input-side cost for the invocation
        prompt_output_cost:
          type: number
          description: Output-side cost for the invocation
      type: object
    BatchRequest:
      properties:
        ids:
          type: array
          description: Identifiers to fetch
          items:
            type: string
      type: object
    PromptAnalyticsBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/AIGovernancePromptAnalyticsDataResponse'
      type: object
