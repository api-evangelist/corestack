openapi: 3.2.0
info:
  title: CoreStack External AI Governance API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Manage AI Governance Metrics
servers:
- url: /
tags:
- name: AI Governance
  description: Manage AI Governance Metrics
paths:
  /v1/ai_governance/fetch_recommendation:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '202':
          description: Recommendation still being generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRecommendationFetchResponse'
        '200':
          description: Recommendation ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRecommendationFetchResponse'
      description: Fetch the on-demand model-switching recommendation for a single prompt. 200 with a non-empty 'recommendations' means it's ready; 200 with an empty 'recommendations' and a 'message' means generation finished but found nothing to recommend; 202 means it is still being generated (see 'message').
      operationId: FetchPromptRecommendation
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRecommendationFetchRequest'
        required: true
      summary: Fetch prompt recommendation
      x-summary-source: derived
  /v1/ai_governance/invoke:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPlaygroundInvokeResult'
      description: Invoke a Bedrock model with a single prompt
      operationId: AIPlaygroundInvoke
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIPlaygroundInvokeRequest'
        required: true
      summary: AI playground invoke
      x-summary-source: derived
  /v1/ai_governance/metrics/aggregate:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseForAggregatedMetricsList'
      summary: Aggregate AI Metrics
      description: Retrieve aggregated AI metrics for the specified filters and date range
      operationId: AggregateAIMetrics
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricListRequest'
        required: true
  /v1/ai_governance/model-comparison:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPlaygroundModelComparisonResponse'
      description: Compare multiple Bedrock models by invoking each against the same set of prompts
      operationId: AIPlaygroundModelComparison
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIPlaygroundModelComparisonRequest'
        required: true
      summary: AI playground model comparison
      x-summary-source: derived
  /v1/ai_governance/models:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPlaygroundListModelsResponse'
      description: List Bedrock foundation models for a provider in a region
      operationId: AIPlaygroundListModels
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIPlaygroundListModelsRequest'
        required: true
      summary: AI playground list models
      x-summary-source: derived
  /v1/ai_governance/prompt_analytics/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptAnalyticsBatchResponse'
      description: Batch prompts based on passed service account id
      operationId: BatchPromptAnalytics
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      summary: Batch prompt analytics
      x-summary-source: derived
  /v1/ai_governance/prompt_analytics/kpi_summary:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: KPI summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptAnalyticsKpiSummaryResponse'
      summary: Prompt Analytics Summary (KPI ranking)
      description: Summary of prompts which is grouped by model and prompts
      operationId: PromptAnalyticsKpiSummary
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGovernanceRequestBase'
        required: true
  /v1/ai_governance/prompt_analytics/list:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      description: List prompts based on passed service account id
      operationId: ListPromptAnalytics
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptAnalyticsListRequest'
        required: true
      summary: List prompt analytics
      x-summary-source: derived
  /v1/ai_governance/prompt_analytics/list_labels:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Label filters retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIGovernanceLabelFiltersResponse'
      summary: Prompt Analytics Label Filters
      description: Distinct label keys and the values observed for each, for building a label filter picker
      operationId: PromptAnalyticsLabelFilters
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGovernanceRequestBase'
        required: true
  /v1/ai_governance/recommendation/detail/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRecommendationBatchResponse'
      description: Batch Recommendations based on passed service account id
      operationId: BatchDetailsForRecommendation
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRecommendationDetailBatchRequest'
        required: true
      summary: Batch details for recommendation
      x-summary-source: derived
  /v1/ai_governance/recommendation/detail/list:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      description: List Recommendations based on passed service account id
      operationId: ListDetailsForRecommendation
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRecommendationDetailListRequest'
        required: true
      summary: List details for recommendation
      x-summary-source: derived
  /v1/prompt_analytics/recommendation/aggregate:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Recommendations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRecommendationAggregateResponse'
      summary: Aggregate Recommendation Savings
      description: Aggregate model-switching recommendations by model and service account
      operationId: RecommendationAggregate
      security:
      - auth_token: []
      tags:
      - AI Governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGovernanceRequestBase'
        required: true
components:
  schemas:
    PromptRecommendationDetailItem:
      required:
      - prompt_id
      properties:
        prompt_id:
          type: string
          description: Unique prompt identifier
        prompt:
          type: string
          description: Prompt which has been invoked
        prompt_sha:
          type: string
          description: SHA hash of the prompt text
        invoked_at:
          type: string
          format: date-time
          description: When the prompt was invoked
        category:
          type: string
          description: Recommendation category
        recommended_sku:
          type: string
          description: Recommended model identifier
        saving_source:
          type: string
          description: 'Saving type: UnitRate'
        cost_saved:
          type: number
          description: Per-prompt cost saving in USD
        confidence_tag:
          type: string
          description: Classification confidence
          example: LOW
          enum:
          - LOW
          - MEDIUM
          - HIGH
          x-cs-enum-type: ScheduleRecommendationUtilization
        boundary:
          type: boolean
          description: True if prompt is near a tier boundary
        cached_prompt:
          type: string
          description: Prefix of the prompt text that would be cached (caching category only); empty string for model_switching
        current_sku_details:
          description: Current model quality metrics
          $ref: '#/components/schemas/PromptSkuDetails'
        recommended_sku_details:
          description: Recommended model quality metrics
          $ref: '#/components/schemas/PromptSkuDetails'
      type: object
    PromptRecommendationFetchResponse:
      properties:
        recommendations:
          type: array
          description: Same shape as the batch/list recommendation endpoints, scoped to this one prompt; present when the response status is 200
          items:
            $ref: '#/components/schemas/PromptRecommendationDetailItem'
        message:
          type: string
          description: 'Explains an empty ''recommendations'' list: present at 202 (still generating) and at 200 when generation finished but found nothing to recommend'
      type: object
    PromptRecommendationDetailListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/PromptRecommendationListRequestSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/PromptRecommendationDetailRequest'
      type: object
    AIPlaygroundInvokeResult:
      properties:
        completion:
          type: string
          description: Model completion text
        input_tokens:
          type: integer
          description: Number of input tokens consumed
        latency_ms:
          type: number
          description: End-to-end latency in milliseconds
        model_id:
          type: string
          description: Bedrock model ID or inference profile ID
        output_tokens:
          type: integer
          description: Number of output tokens produced
        prompt_id:
          type: string
          description: Unique identifier for the prompt invocation
        prompt_input_cost:
          type: number
          description: Input-side cost for the invocation
        prompt_output_cost:
          type: number
          description: Output-side cost for the invocation
        stop_reason:
          type: string
          description: Bedrock stop reason
      type: object
    AIPlaygroundInvokeRequest:
      allOf:
      - $ref: '#/components/schemas/AIPlaygroundModelInput'
      - required:
        - prompt
        - service_account_id
        properties:
          prompt:
            type: string
            description: User prompt
          system_prompt:
            type: string
            description: Optional system prompt
          service_account_id:
            type: string
            description: AWS service account ID
            x-cs-type: ObjectId
        type: object
    PromptRecommendationItem:
      properties:
        category:
          type: string
          description: 'Recommendation type: model_switching | caching'
        model_id:
          type: string
          description: Currently deployed model identifier
        recommended_model_id:
          type: string
          description: Suggested replacement model identifier
        total_cost_saved:
          type: number
          description: Projected monthly cost saving in USD
        prompt_count:
          type: integer
          description: Number of prompts with this recommendation
        high_confidence_prompts:
          type: integer
          description: Number of prompts with this recommendation which has been tagged at high confidence
        service_account_id:
          type: string
          description: Service account these recommendations belong to
          x-cs-type: ObjectId
      type: object
    MetricListRequest:
      allOf:
      - $ref: '#/components/schemas/AIGovernanceRequestBase'
      - required:
        - is_cost_metric
        properties:
          is_cost_metric:
            type: boolean
            description: Indicates if this is a cost metric request (true) or usage metric request (false)
          service_account_ids:
            type: array
            description: Service Account Ids to Filter
            items:
              type: string
              x-cs-type: ObjectId
        type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    PromptRecommendationDetailRequest:
      allOf:
      - $ref: '#/components/schemas/PromptRecommendationDetailRequestBase'
      - required:
        - end_date
        - model_id
        - service_account_id
        - start_date
        properties:
          start_date:
            type: string
            format: date-time
            description: Start date for metrics
          end_date:
            type: string
            format: date-time
            description: End date for metrics
          model_id:
            type: string
            description: Currently deployed model to drill into
          service_account_id:
            type: string
            description: Service account scope
            x-cs-type: ObjectId
        type: object
    AggregateMetricsBase:
      properties:
        metric_name:
          type: string
          description: Name of the metric
        model_name:
          type: string
          description: Name of the model
        model_type:
          type: string
          description: Type of the model
        resource_category:
          type: string
          description: Category of the resource
        unit:
          type: string
          description: unit of measures
      type: object
    AIPlaygroundPromptInput:
      required:
      - prompt
      properties:
        prompt:
          type: string
          description: User prompt
        system_prompt:
          type: string
          description: Optional system prompt
      type: object
    PromptRecommendationDetailBatchRequest:
      allOf:
      - $ref: '#/components/schemas/PromptRecommendationDetailRequestBase'
      - properties:
          recommendation_ids:
            description: ids for the recommendation
            $ref: '#/components/schemas/BatchRequest'
        type: object
    AIPlaygroundModelComparisonResponse:
      properties:
        comparison_id:
          type: string
          description: Comparison ID shared by all invocations
        results:
          type: array
          description: Invocation results
          items:
            $ref: '#/components/schemas/AIPlaygroundInvokeResult'
      type: object
    KeyValuePair:
      properties:
        key:
          type: string
          description: Key of the pair
        value:
          type: string
          description: Value of the pair
      type: object
    AIGovernancePromptAnalyticsDataResponse:
      allOf:
      - $ref: '#/components/schemas/AiGovernancePromptSummary'
      - properties:
          service_account_id:
            type: string
            description: Identifier of the service account that generated the prompt event
            x-cs-type: ObjectId
          region:
            type: string
            description: Cloud region where the invocation was processed
          max_tokens:
            type: integer
            description: Maximum token limit configured for the request
          temperature:
            type: number
            description: Temperature sampling value used for the request
          top_p:
            type: number
            description: Top-p sampling value used for the request
          top_k:
            type: integer
            description: Top-k sampling value used for the request
          cache_read_input_token_count:
            type: integer
            description: Number of input tokens served from cache
          cache_write_input_token_count:
            type: integer
            description: Number of input tokens written to cache
          invoked_at:
            type: string
            format: date-time
            description: Timestamp when the prompt was invoked
          requester_id:
            type: string
            description: Identity of the caller that made the invocation
          labels:
            type: array
            description: List of tag key/value pairs
            items:
              $ref: '#/components/schemas/KeyValuePair'
        type: object
    ResponseForAggregatedMetricsList:
      properties:
        metrics:
          type: array
          description: List of cost metrics
          items:
            $ref: '#/components/schemas/AggregatedMetricsResponse'
      type: object
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    AIPlaygroundListModelsResponse:
      properties:
        models:
          type: array
          description: Available Bedrock models and inference profiles
          items:
            $ref: '#/components/schemas/AIPlaygroundModelSummary'
      type: object
    PromptRecommendationDetailRequestBase:
      required:
      - category
      properties:
        category:
          type: string
          description: Category For the prompt recommendation.
          example: model_right_sizing
          enum:
          - model_right_sizing
          - caching
          x-cs-enum-type: PromptRecommendationCategories
        recommended_model_id:
          type: string
          description: Currently deployed model to drill into
      type: object
    AggregatedMetricsResponse:
      allOf:
      - $ref: '#/components/schemas/AggregateMetricsBase'
      - properties:
          service_account_id:
            type: string
            description: Service account identifier
            x-cs-type: ObjectId
          quantity:
            type: integer
            description: Quantity
          timestamps:
            type: array
            description: timestamps
            items:
              type: string
              format: date-time
          values:
            type: array
            description: List of metric values
            items:
              type: number
        type: object
    PromptRecommendationListRequestSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: invoked_at
          enum:
          - invoked_at
          x-cs-enum-type: PromptRecommendationListRequestSortColumn
        ascending:
          type: boolean
      type: object
    PromptSkuDetails:
      properties:
        model_id:
          type: string
          description: Model identifier
        latency_ms:
          type: number
          description: Mean endpoint latency in milliseconds
        accuracy:
          type: number
          description: Task accuracy score 0.0-1.0
        cost:
          type: number
          description: Per-invocation cost in USD
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
