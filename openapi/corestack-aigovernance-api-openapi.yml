openapi: 3.2.0
info:
  title: CoreStack External AI Governance API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Manage AI Governance Metrics
servers:
- url: /
tags:
- name: AIGovernance
  description: Manage AI Governance Metrics
paths:
  /v1/ai_governance/metrics/aggregate:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseForAggregatedMetricsList'
      summary: Aggregate AI Metrics
      description: Retrieve aggregated AI metrics for the specified filters and date range
      operationId: AggregateAIMetrics
      security:
      - auth_token: []
      tags:
      - AIGovernance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricListRequest'
        required: true
components:
  schemas:
    AggregatedMetricsResponse:
      allOf:
      - $ref: '#/components/schemas/AggregateMetricsBase'
      - properties:
          service_account_id:
            type: string
            description: Service account identifier
            x-cs-type: ObjectId
          quantity:
            type: integer
            description: Quantity
          timestamps:
            type: array
            description: timestamps
            items:
              type: string
              format: date-time
          values:
            type: array
            description: List of metric values
            items:
              type: number
        type: object
    MetricListRequest:
      required:
      - end_date
      - is_cost_metric
      - start_date
      properties:
        is_cost_metric:
          type: boolean
          description: Indicates if this is a cost metric request (true) or usage metric request (false)
        service_account_ids:
          type: array
          description: Service Account Ids to Filter
          items:
            type: string
            x-cs-type: ObjectId
        filters:
          description: Query operator for filtering
          $ref: '#/components/schemas/QueryOperator'
        start_date:
          type: string
          format: date-time
          description: Start date for metrics
        end_date:
          type: string
          format: date-time
          description: End date for metrics
      type: object
    AggregateMetricsBase:
      properties:
        metric_name:
          type: string
          description: Name of the metric
        model_name:
          type: string
          description: Name of the model
        model_type:
          type: string
          description: Type of the model
        resource_category:
          type: string
          description: Category of the resource
        unit:
          type: string
          description: unit of measures
      type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
      type: object
