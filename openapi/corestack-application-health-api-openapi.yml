    ApplicationHealthRequestFilter:
      required:
      - end_date
      - start_date
      properties:
        filter:
          description: Query expression to filter application health data.
          $ref: '#/components/schemas/QueryOperator'
        start_date:
          type: string
          format: date-time
          description: Start date for filtering alerts
        end_date:
          type: string
          format: date-time
          description: End date for filtering alerts
      type: object
    ApplicationHealthBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/ApplicationHealthSummary'
      type: object
    TimeSeriesPoint:
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp in ISO format
        average:
          type: number
          description: Average value
        total:
          type: number
          description: Total value
        minimum:
          type: number
          description: Minimum value
        maximum:
          type: number
          description: Maximum value
        count:
          type: integer
          description: Count
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    DiskStatus:
      properties:
        enabled:
          type: boolean
          description: Indicates if disk monitoring is supported
        metric_name:
          type: string
          description: Disk metric name
        path:
          type: string
          description: Disk mount path
        disk_used:
          type: number
          description: Used disk space
        disk_free:
          type: number
          description: Free disk space
        total_disk_space:
          type: number
          description: Total disk space
        is_critical:
          type: boolean
          description: Indicates if disk usage is critical
        status_at:
          type: string
          format: date-time
          description: Timestamp of disk status
      type: object
    ApplicationHealthListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/ApplicationHealthSummarySortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/ApplicationHealthRequestFilter'
      type: object
    UtilizationResourceAggregationResponse:
      properties:
        hourly_aggregations:
          type: array
          description: List of supported hourly aggregation types (e.g., avg, min, max) for utilization metrics
          items:
            type: string
        daily_aggregations:
          type: array
          description: List of supported daily aggregation types (e.g., avg, min, max) for utilization metrics
          items:
            type: string
        time_aggregation:
          type: array
          description: Time-based aggregation levels available for utilization data (hourly, daily)
          items:
            type: string
        metrics:
          type: array
          description: List of utilization metrics and their supported aggregation configurations
          items:
            $ref: '#/components/schemas/ResourceUtilizationMetric'
      type: object
    PatchCompliance:
      properties:
        enabled:
          type: boolean
          description: Indicates if patch compliance is supported
        status:
          type: boolean
          description: True if compliant with patches, False if not
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
