openapi: 3.2.0
info:
  title: CoreStack External Application Health API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Application Health
servers:
- url: /
tags:
- name: Application Health
  description: Application Health
paths:
  /v1/application_health/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationHealthBatchResponse'
      description: Batch Application Health Details.
      operationId: BatchApplicationHealthDetails
      security:
      - auth_token: []
      tags:
      - Application Health
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationHealthBatchRequest'
        required: true
  /v1/application_health/list:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      description: Retrieve the list of Application Health.
      operationId: ListApplicationHealth
      security:
      - auth_token: []
      tags:
      - Application Health
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationHealthListRequest'
        required: true
  /v1/monitoring/resource_utilization:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizationResourceAggregationResponse'
      description: Metric Resource Utilization Details.
      operationId: MetricResourceUtilization
      security:
      - auth_token: []
      tags:
      - Application Health
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizationResourceAggregationRequest'
        required: true
components:
  schemas:
    ApplicationHealthAlert:
      properties:
        metric_name:
          type: string
          description: Name of the metric
        status:
          type: string
          description: Alert status
        metric_value:
          type: number
          description: Metric value
        threshold:
          type: string
          description: Configured threshold
        operator:
          type: string
          description: Operator used for comparison
          example: Equals
          enum:
          - Equals
          - NotEquals
          - GreaterThan
          - GreaterThanOrEqual
          - LessThan
          - LessThanOrEqual
          x-cs-enum-type: AlertOperator
        window_size:
          type: string
          description: Window size for evaluation
        time_aggregation:
          type: string
          description: Time aggregation type
        is_critical:
          type: boolean
          description: Whether the alert requires immediate action
        event_creation_time:
          type: string
          format: date-time
          description: Timestamp of the event
      type: object
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    ResourceUtilizationMetric:
      properties:
        unit:
          type: string
          description: Unit of the metric
        metric_name:
          type: string
          description: Name of the metric
        timeseries:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
      type: object
    ProtectionStatus:
      properties:
        enabled:
          type: boolean
          description: Indicates if protection status is supported
        status:
          type: boolean
          description: Indicates if the resource is protected
      type: object
    UtilizationResourceAggregationRequest:
      properties:
        service_account_id:
          type: string
          description: Service account id
          x-cs-type: ObjectId
        check_resource_element:
          type: string
          description: Unique id of the resource
        aggregation:
          type: string
          description: Aggregation of the resource
        metric_name:
          type: array
          description: metric name
          items:
            type: string
        from_date:
          type: string
          format: date-time
          description: specify the start date.
        to_date:
          type: string
          format: date-time
          description: specify the end date.
      type: object
    ApplicationHealthSummarySortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: resource_category
          enum:
          - resource_category
          x-cs-enum-type: ApplicationHealthSummarySortColumn
        ascending:
          type: boolean
      type: object
    ApplicationHealthBatchRequest:
      required:
      - end_date
      - start_date
      properties:
        ids:
          type: array
          description: Identifiers to fetch
          items:
            type: string
        start_date:
          type: string
          format: date-time
          description: Start date for filtering alerts
        end_date:
          type: string
          format: date-time
          description: End date for filtering alerts
      type: object
    ApplicationHealthSummary:
      properties:
        service_account_id:
          type: string
          description: Service account id
          x-cs-type: ObjectId
        service_resource_inventory_id:
          type: string
          description: Service Resource Inventory ID
        resource_id:
          type: string
          description: Application resource ID
        resource_name:
          type: string
          description: Application resource Name
        resource_filter:
          type: string
          description: Resource group or logical grouping
        resource_region:
          type: string
          description: Application region
        resource:
          type: string
          description: Resource name
        resource_type:
          type: string
          description: Type of application resource
        resource_category:
          type: string
          description: Resource category
        resource_state:
          type: string
          description: Current State of the resource
        alert_metrics:
          type: array
          description: Configured alert metrics
          items:
            type: string
        patch_details:
          description: Patch compliance details for the application
          $ref: '#/components/schemas/PatchCompliance'
        backup_details:
          description: Backup and protection status
          $ref: '#/components/schemas/ProtectionStatus'
        disk_details:
          description: Disk usage and status information
          $ref: '#/components/schemas/DiskStatus'
        alert_details:
          type: array
          description: List of configured alerts and their metrics
          items:
            $ref: '#/components/schemas/ApplicationHealthAlert'
      type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
