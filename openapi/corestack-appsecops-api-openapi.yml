      required:
      - category
      - created_at
      - execution_phase
      - layer
      - severity
      - source_tool
      - status
      - title
      - updated_at
      properties:
        finding_id:
          type: string
          description: Unique identifier for the security finding record in the system
          x-cs-type: ObjectId
        category:
          type: string
          description: High-level classification of the security finding type (Misconfiguration, Vulnerability, or Threat)
          example: Misconfiguration
          enum:
          - Misconfiguration
          - Vulnerability
          - Threat
          x-cs-enum-type: SecurityFindingsCategory
        source_tool:
          type: string
          description: Name of the security scanning tool that originally detected and reported this finding
          example: Hadolint
          enum:
          - Hadolint
          - Dockle
          - AzureDefender
          - InspectorV2
          - InspectorClassic
          - SecurityCommandCenter
          - CloudGuard
          - Guardduty
          x-cs-enum-type: SecurityFindingsSourceTool
        execution_phase:
          type: string
          description: Phase in the software development lifecycle when this security issue was detected (Build or Runtime)
          example: Build
          enum:
          - Build
          - Runtime
          x-cs-enum-type: SecurityFindingsExecutionPhase
        layer:
          type: string
          description: Architectural layer where the security issue exists (Container, Infrastructure, Supplychain, or API)
          example: Container
          enum:
          - Container
          - Infrastructure
          - Supplychain
          - API
          x-cs-enum-type: SecurityFindingsLayer
        severity:
          type: string
          description: Normalized severity level indicating the criticality and potential impact of the security finding
          example: critical
          enum:
          - critical
          - high
          - medium
          - low
          - informational
          - none
          x-cs-enum-type: SecurityFindingsSeverity
        status:
          type: string
          description: Current resolution status of the security finding (open for unresolved, resolved for fixed)
          example: open
          enum:
          - open
          - resolved
          x-cs-enum-type: SecurityFindingsStatus
        title:
          type: string
          description: Concise, human-readable summary title describing the specific security issue found
        description:
          type: string
          description: Detailed explanation of the security finding, including what was detected and why it is a concern
        recommendation:
          type: string
          description: Actionable guidance and best practices for addressing and resolving the security finding
        remediation:
          type: string
          description: Specific step-by-step instructions for fixing the security issue and preventing recurrence
        created_at:
          type: string
          format: date-time
          description: Timestamp indicating when this security finding was first discovered and recorded in the system
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the most recent modification or status change to this security finding record
      type: object
