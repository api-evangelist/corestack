components:
  schemas:
    AppSecopsSbomVulnerabilityResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            $ref: '#/components/schemas/AppSecopsSbomVulnerability'
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    AppSecopsBCSQuestionsAnswers:
      properties:
        tenant_id:
          type: string
          description: Tenant ID
          x-cs-type: ObjectId
        version:
          type: integer
          description: Version number
        answers:
          type: array
          description: Slim weight entries [{id, weight}]
          items:
            $ref: '#/components/schemas/AppSecopsBCSQuestionsAnswerItem'
        created_at:
          type: string
          format: date-time
          description: When this version was created
        created_by:
          type: string
          description: Who created this version
      type: object
    AppSecopsSbomComponentDetails:
      properties:
        name:
          type: string
          description: Name of the component
        component_id:
          type: string
          description: Unique identifier for the component
          x-cs-type: ObjectId
        dependent_component_ids:
          type: array
          description: List of BOM references that this component depends on
          items:
            type: string
            x-cs-type: ObjectId
      type: object
    AppSecopsTimeRangeFilter:
      allOf:
      - $ref: '#/components/schemas/AppSecopsFilter'
      - required:
        - end_date
        - start_date
        properties:
          start_date:
            type: string
            format: date-time
            description: Start date of the time period
          end_date:
            type: string
            format: date-time
            description: End date of the time period
        type: object
    AppSecopsPortfolioSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: name
          enum:
          - name
          - created_at
          - updated_at
          x-cs-enum-type: AppSecopsPortfolioSortColumn
        ascending:
          type: boolean
      type: object
    AppSecopsProject:
      allOf:
      - $ref: '#/components/schemas/AppSecopsProjectBase'
      - properties:
          project_id:
            type: string
            description: Unique ID of the project
            x-cs-type: ObjectId
          created_at:
            type: string
            format: date-time
            description: Project created time
          created_by:
            type: string
            description: Name of the user who created a project
          updated_at:
            type: string
            format: date-time
            description: Project updated time
          updated_by:
            type: string
            description: Name of the user who recently updated
        type: object
    AppSecopsVulnerabilityCvssMetric:
      properties:
        version:
          type: string
          description: CVSS version used for scoring (e.g., 3.1)
        vector_string:
          type: string
          description: Encoded CVSS vector string representing all metric values
        access_complexity:
          type: string
          description: Level of complexity required for an attacker to exploit the vulnerability
        access_vector:
          type: string
          description: Encoded access vector string representing all metric values
        attack_vector:
          type: string
          description: Context required to exploit the vulnerability (e.g., network, local)
        attack_requirements:
          type: string
          description: Specific conditions or requirements needed for a successful attack (e.g., configuration, user privileges)
        authentication:
          type: string
          description: Authentication type (e.g., Basic authentication)
        attack_complexity:
          type: string
          description: Level of difficulty to exploit the vulnerability
        exploit_maturity:
          type: string
          description: Indicates a vulnerability is to be exploited based on exploit availability and threat intelligence.
        privileges_required:
          type: string
          description: Level of privileges an attacker needs to exploit the vulnerability
        user_interaction:
          type: string
          description: Indicates if user interaction is required for exploitation
        scope:
          type: string
          description: Whether exploitation affects resources beyond the vulnerable component
        confidentiality_impact:
          type: string
          description: Impact on confidentiality if the vulnerability is exploited
        integrity_impact:
          type: string
          description: Impact on data integrity if the vulnerability is exploited
        availability_impact:
          type: string
          description: Impact on system availability if the vulnerability is exploited
        base_score:
          type: number
          description: CVSS base score (0–10) indicating overall severity
        severity:
          type: string
          description: Severity level of the vulnerability
          example: Critical
          enum:
          - Critical
          - High
          - Info
          - Low
          - Medium
          - None
          - Unknown
          x-cs-enum-type: Severity
        subsequent_availability:
          type: string
          description: Availability impact on dependent or downstream systems after the vulnerability is exploited
        subsequent_confidentiality:
          type: string
          description: Impact on confidentiality of the system after the vulnerability is exploited
        subsequent_integrity:
          type: string
          description: Integrity impact on systems that depend on or are affected by the vulnerable system.
        vulnerable_availability:
          type: string
          description: Availability impact on the directly affected system after the vulnerability is exploited.
        vulnerable_confidentiality:
          type: string
          description: Confidentiality impact on the directly affected system after the vulnerability is exploited.
        vulnerable_integrity:
          type: string
          description: Integrity impact on the system where the vulnerability exists
      type: object
    AppSecopsApplicationRequest:
      allOf:
      - $ref: '#/components/schemas/AppSecopsApplicationBase'
      - properties: {}
        type: object
    AppSecopsSbomComponentRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        filters:
