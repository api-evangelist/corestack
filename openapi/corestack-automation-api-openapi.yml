    ScriptScanRequest:
      required:
      - config_type
      - script_info
      properties:
        config_type:
          type: string
          description: Config type of the script
          example: chef
          enum:
          - chef
          - ansible
          - puppet
          - shell
          x-cs-enum-type: ConfigType
        script_info:
          type: array
          description: script info
          items:
            $ref: '#/components/schemas/ScriptInfo'
        dependencies:
          type: array
          description: Details of the dependent scripts if any
          items:
            $ref: '#/components/schemas/ScriptInfo'
        playbook_yaml:
          type: string
          description: Playbook yaml path - mandatory for ansible scripts
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    CloudAccount:
      required:
      - cloud
      - cloud_account_id
      properties:
        cloud:
          type: string
          description: Displays the cloud associated with the template, for example, AWS, GCP, Azure etc
        cloud_account_id:
          type: string
          description: Unique Identifier of the cloud account onboarded in the on boarding section
        region:
          type: string
          description: The region of the cloud account where it needs to be executed. Mandatory for AWS
        zones:
          type: string
          description: The zones of the cloud account where it needs to be executed. Mandatory for GCP
