        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptDataView'
      summary: Describe Script
      description: This API will provide detailed information about the script.
      operationId: DescribeScript
      parameters:
      - name: tenant_id
        in: path
        required: true
        description: Specify the tenant ID. This is a unique ID and can be retrieved using the List Tenants API.
        schema:
          type: string
      - name: script_id
        in: path
        required: true
        description: ID of the script. This can be fetched from listScripts API
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Automation
    put:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScriptResponse'
      summary: Update Script
      description: Updates script details such as name, script path, dependencies etc.,
      operationId: UpdateScript
      parameters:
      - name: tenant_id
        in: path
        required: true
        description: Specify the tenant ID. This is a unique ID and can be retrieved using the List Tenants API.
        schema:
          type: string
      - name: script_id
        in: path
        required: true
        description: ID of the script. This can be fetched from listScripts API
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Automation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScriptRequest'
