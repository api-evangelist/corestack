components:
  schemas:
    CreateScriptResponse:
      properties:
        script_id:
          type: string
          description: Unique ID of the script
      type: object
    TemplateJobListResponse:
      required:
      - jobs
      properties:
        jobs:
          $ref: '#/components/schemas/TemplateJobsList'
      type: object
    BlueprintDetails:
      required:
      - created_at
      - created_by
      - description
      - id
      - name
      - resources
      - scope
      - status
      - updated_at
      - updated_by
      properties:
        id:
          type: string
          description: Blueprint ID
        name:
          type: string
          description: Blueprint Name
        description:
          type: string
          description: Blueprints Description
        resources:
          type: array
          description: Resource Details
          items:
            $ref: '#/components/schemas/ResourcesDetails'
        scope:
          type: string
          description: Scope of the blueprint
        status:
          type: string
          description: Status of the blueprint
        created_by:
          type: string
          description: Who has created the blueprint
        created_at:
          type: string
          description: When was the blueprint created
        updated_by:
          type: string
          description: Who has updated the blueprint
        updated_at:
          type: string
          description: When was the blueprint updated
      type: object
    ScriptMinimumRequirements:
      properties:
        ram(MB):
          type: number
          description: Minimum RAM required(in MB) to install the script.
          default: 0.0
        cpu:
          type: integer
          description: Minimum CPU core required(in MB) to install the script.
          default: 0
        disk(MB):
          type: number
          description: Minimum disk space required(in MB) to install the script.
          default: 0.0
      type: object
    CloudAccountDetailsResponse:
      required:
      - cloud
      - cloud_account_id
      properties:
        cloud:
          type: string
          description: Displays the cloud associated with the template, for example, AWS, Azure etc
        cloud_account_id:
          type: string
          description: Unique Identifier of the cloud account onboarded in the on boarding section
        region:
          type: string
          description: The region of the cloud account where it needs to be executed. Mandatory for AWS
        resourcegroup:
          type: string
          description: Resource group for which you need to execute the template for. Mandatory for Azure
        location:
          type: string
          description: Location under which you need to execute the template for. Mandatory for Azure
      type: object
    ArgsDetails:
      required:
      - job_details
      properties:
        job_details:
          type: array
          description: The Job Details of the script
          items:
            $ref: '#/components/schemas/JobDetails'
      type: object
    AttributeDetails:
      required:
      - service_accounts
      properties:
        service_accounts:
          type: array
          description: Service account id is unique can be obtained from the list cloud
          items:
            $ref: '#/components/schemas/CloudAccountDetails'
      type: object
    TemplateGetParameterSchemaResponse:
      properties:
        input_parameters:
          type: array
          description: List of input parameters.
          items:
            $ref: '#/components/schemas/NamedParameter'
        output_parameters:
          type: array
          description: List of output parameters.
          items:
            $ref: '#/components/schemas/NamedParameter'
      type: object
    ScriptJobListModel:
      required:
      - completed_at
      - execution_type
      - initiated_by
      - started_at
      - status
      - status_reason
      properties:
        script_job_id:
          type: string
          description: Unique ID of the Script Job
        script_job_name:
          type: string
          description: Name of the Script Job
        status:
          type: string
          description: Overall status of the script execution
        status_reason:
          type: string
          description: Error message if failed
        started_at:
          type: string
          description: Script Job start time in UTC
        completed_at:
          type: string
          description: Script Job completion time in UTC
        execution_type:
          type: string
          description: Script Job execution type (on_demand/scheduled)
        initiated_by:
          type: string
          description: User who initiated the script execution
      type: object
    TemplateJobsList:
      properties:
        id:
          type: string
          description: Unique ID of the template job.
        name:
          type: string
          description: Name of the template job.
        status:
          type: string
          description: Overall status of the template execution
          example: CANCELED
          enum:
          - CANCELED
          - COMPLETED
          - CREATE_FAILED
          - CREATE_IN_PROGRESS
          - DELETED
          - DELETE_FAILED
          - DELETE_IN_PROGRESS
          - FAILED
          - IN_PROGRESS
