components:
  schemas:
    AwsSecurityHubFindingProductNameRequest:
      properties:
        tenant_id:
          type: string
          description: Which tenant Id to fetch product names for
      type: object
    AwsSecurityHubFindingListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/AwsSecurityHubFindingSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/AwsSecurityHubFindingFilters'
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    AwsSecurityHubFinding:
      properties:
        severity:
          type: string
          description: Severity label
          example: Informational
          enum:
          - Informational
          - Medium
          - Low
          - High
          - Critical
          x-cs-enum-type: AwsSecurityHubSeverity
        record_state:
          type: string
          description: Record status
          example: Active
          enum:
          - Active
          - Archived
          x-cs-enum-type: AwsSecurityHubRecordState
        workflow_status:
          type: string
          description: Workflow status
          example: New
          enum:
          - New
          - Notified
          - Suppressed
          - Resolved
          x-cs-enum-type: AwsSecurityHubWorkflowStatus
        region:
          type: string
          description: Findings region
        aws_account_id:
          type: string
          description: AWS account id
        cloud_account_id:
          type: string
          description: Corestack cloud account id
        company_name:
          type: string
          description: Company name
        product_name:
          type: string
          description: Product name
        title:
          type: string
          description: Findings title
        resources:
          type: array
          description: Impacted resources
          items:
            $ref: '#/components/schemas/AwsSecurityHubFindingResource'
        compliance_status:
          type: string
          description: Compliance status
          example: Passed
          enum:
          - Passed
          - Failed
          - NotAvailable
          x-cs-enum-type: AwsSecurityHubComplianceStatus
        compliance_related_requirements:
          type: array
          description: Related Contorl ARN
          items:
            type: string
        compliance_security_control_id:
          type: string
        compliance_rule:
          type: string
        compliance_associated_standards:
          type: array
          description: Associated Compliance Standards
          items:
            type: string
        finding_created_at:
          type: string
          format: date-time
          description: Findings created time
        finding_updated_at:
          type: string
          format: date-time
          description: Findings updated time
        description:
          type: string
          description: Findings description
        finding_id:
          type: string
          description: Finding Id
        recommendation_text:
          type: string
          description: Recommendation description
        recommendation_url:
          type: string
          description: Recommendation Link
        finding_provider_severity:
          type: string
          description: Severity label
          example: Informational
          enum:
          - Informational
          - Medium
          - Low
          - High
          - Critical
          x-cs-enum-type: AwsSecurityHubSeverity
        finding_provider_types:
          type: array
          description: Resource Id
          items:
            type: string
        finding_provider_related_findings:
          type: array
          description: Related findings
          items:
            type: string
      type: object
    AwsSecurityHubFindingSeverityRequest:
      properties:
        tenant_id:
          type: string
          description: Which tenant Id to fetch severities for
      type: object
    AwsSecurityHubFindingRegionResponse:
      properties:
        regions:
          type: array
          description: List of Regions
          items:
            type: string
      type: object
    AwsSecurityHubFindingBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/AwsSecurityHubFinding'
      type: object
    AwsSecurityHubFindingRecordStatesResponse:
      properties:
        record_states:
          type: array
          description: List of Record States
          items:
            type: string
      type: object
    AwsSecurityHubFindingRecordStatesRequest:
      properties:
        tenant_id:
          type: string
          description: Which tenant Id to fetch record states for
      type: object
    AwsSecurityHubFindingResource:
      properties:
        type:
          type: string
          description: Resource Type
        id:
          type: string
          description: Resource Id
        region:
          type: string
          description: Resource Region
      type: object
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
