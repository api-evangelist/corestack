        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      summary: Returns a list AWS Security Hub Findings ids
      description: List AWS Security Hub Finding Ids
      operationId: listFindings
      security:
      - auth_token: []
      tags:
      - AWS Security Hub
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsSecurityHubFindingListRequest'
        required: true
  /v1/aws-security-hub/findings/filters/product_name:
