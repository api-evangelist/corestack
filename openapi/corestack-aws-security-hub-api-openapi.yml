        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsSecurityHubFindingBatchResponse'
      summary: Returns a batch of Findings
      description: Get AWS Security hub findings for all ids passed in the request.
      operationId: getFindingsBatch
      security:
      - auth_token: []
      tags:
      - AWS Security Hub
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
  /v1/aws-security-hub/dashboard/findings/list:
