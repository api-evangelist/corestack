    ServiceAccountPlatformKeyValues:
      properties:
        service_account_id:
          type: string
          description: Service Account ID
          x-cs-type: ObjectId
        values_by_key:
          type: array
          description: List of platform tag key/value pairs for an account
          items:
            $ref: '#/components/schemas/PlatformKeyValues'
      type: object
    BillingSummaryBase:
      properties:
        service_account_ids:
          type: array
          description: Service Account IDs
          items:
            type: string
            x-cs-type: ObjectId
        descendant_service_account_query:
          description: Descendant service account query filter
          $ref: '#/components/schemas/DescendantServiceAccountQuery'
        for_platform:
          type: boolean
          description: If set, redirect the query to billing platform line items summary collection
        skip_service_account_grouping:
          type: boolean
          description: If set, do not group by service account
      type: object
    BillingAggregationTrendRequest:
      allOf:
      - $ref: '#/components/schemas/BillingAggregationRequest'
      - required:
        - granularity
        properties:
          granularity:
            type: integer
            description: Number of seconds between steps
          compute_forecast:
            type: boolean
            description: If set, results for future dates will be computed based on a forecast.
        type: object
    DescendantServiceAccountQuery:
      required:
      - service_account_ids
      properties:
        service_account_ids:
          type: array
          description: Service account IDs that belong to the ancestors of matching accounts.
          items:
            type: string
            x-cs-type: ObjectId
        include_self:
          type: boolean
          description: Include the given service accounts in the result set
        include_billing_as_parent:
          type: boolean
          description: Also include accounts whose billing_account_id matches any of the given accounts.
        include_resource_as_parent:
          type: boolean
          description: Also include accounts whose resource_service_account_id matches any of the given accounts.
        include_commercial_as_parent:
          type: boolean
          description: Also include AWS GovCloud accounts whose commercial_account_id matches any of the given accounts.
        exclude_service_account_ids:
          type: array
          description: Service account IDs to excluded with descendants.
          items:
            type: string
            x-cs-type: ObjectId
      type: object
    DimensionMembershipKeyValuePair:
      required:
      - dimension_id
      - grouping_rule_id
      properties:
        dimension_id:
          type: string
          description: Dimension ID
        grouping_rule_id:
          type: string
          description: Grouping Rule ID
      type: object
    BillingLineItemIdentity:
      properties:
        service_account_id:
          type: string
          description: Service Account the line item belongs to
          x-cs-type: ObjectId
