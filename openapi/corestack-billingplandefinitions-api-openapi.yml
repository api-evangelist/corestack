  /v1/billing_plans/{plan_definition_id}:
    delete:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Plan definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '204':
          description: Successful operation
      summary: Delete Billing Plan by plan_id
      description: Delete Billing Plan by plan_id
      operationId: remove
      parameters:
      - name: plan_definition_id
        in: path
        required: true
        description: The Billing Plan definition ID
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitions
    get:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Plan definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlanDefinition'
      summary: Get Billing Plan definition by id
      description: Get Billing Plan definition by id
      operationId: get@@@2
      parameters:
      - name: plan_definition_id
        in: path
        required: true
        description: The Billing Plan definition ID
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitions
  /v1/billing_plans/{plan_definition_id}/history:
    get:
      responses:
        '500':
          description: Internal server error
          content:
