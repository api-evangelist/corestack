components:
  schemas:
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    BillingPlanDefinition:
      allOf:
      - $ref: '#/components/schemas/BaseDefinition'
      - properties:
          owner:
            type: string
            description: Owner of the billing plan
            x-cs-type: ObjectId
          name:
            type: string
            description: Name of the billing plan
          description:
            type: string
            description: Description of the billing plan
          is_active:
            type: boolean
            description: States if the billing plan is active or not
          is_template:
            type: boolean
            description: States if the plan is a template or not
          notes:
            type: string
            description: Notes for the billing plan
          attachment_ids:
            type: array
            description: List of attachment IDs
            items:
              type: string
          raw_list_cost_adjusted_billing_plan:
            type: boolean
            description: States if the billing plan is for raw list cost adjusted billing plan or not
          created_by:
            type: string
            description: Created by
            x-cs-type: ObjectId
          updated_by:
            type: string
            description: Updated by
            x-cs-type: ObjectId
        type: object
    BaseDefinition:
      properties:
        sysId:
          type: string
          description: Identifier of the definition
        createdOn:
          type: string
          format: date-time
          description: Definition created on
        updatedOn:
          type: string
          format: date-time
          description: Definition updated on
        headVersion:
          description: Reference to the editable version of the definition
          $ref: '#/components/schemas/RecordIdentity'
        releaseVersion:
          description: Reference to the release version of the definition
          $ref: '#/components/schemas/RecordIdentity'
      type: object
    BillingPlanDefinitionFilters:
      properties:
        search:
          type: string
          description: Search by name or description
        plan_status:
          type: string
          description: Plan Status. This field is used to indicate the status of the billing plan.
          example: active
          enum:
          - active
          - inactive
          x-cs-enum-type: PlanStatus
        scope:
          description: Scope is/is not/contains/not contains the given value
          $ref: '#/components/schemas/QueryOperator'
        from_date:
          type: string
          format: date-time
          description: Billing Plan ends after this date
        to_date:
          type: string
          format: date-time
          description: Billing Plan starts before this date
        raw_list_cost_adjusted_billing_plan:
          type: boolean
          description: raw_list_cost_adjusted_billing_plan
          default: false
      type: object
    BillingPlanDefinitionListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/BillingPlanDefinitionListSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/BillingPlanDefinitionFilters'
      type: object
    BillingPlanDefinitionListSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: Name
          enum:
          - Name
          - CreatedOn
          - UpdatedOn
          x-cs-enum-type: BillingPlanDefinitionListSortColumn
        ascending:
          type: boolean
      type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
      type: object
      x-cs-subtypes:
      - subtype_model: QueryOperatorTrue
