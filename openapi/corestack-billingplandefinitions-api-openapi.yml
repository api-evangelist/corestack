openapi: 3.2.0
info:
  title: CoreStack External Billing Plan Definitions API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Manage BillOps Plans
servers:
- url: /
tags:
- name: BillingPlanDefinitions
  description: Manage BillOps Plans
paths:
  /v1/billing_plans/batch:
    post:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                description: List of billing plan definitions
                items:
                  $ref: '#/components/schemas/BillingPlanDefinition'
      summary: Fetch all Billing Plan definitions
      description: Fetch all Billing Plan definitions
      operationId: batch@@@2
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordIdentityBatchRequest'
        required: true
  /v1/billing_plans/create:
    post:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlanDefinition'
      summary: Create a new Billing Plan definition
      description: Create a new Billing Plan definition
      operationId: create@@@2
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitions
  /v1/billing_plans/list:
    post:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
