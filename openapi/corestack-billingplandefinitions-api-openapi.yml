        in: path
        required: true
        description: The Billing Plan definition ID
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitions
  /v1/billing_plans/{plan_definition_id}/set_state:
    post:
      responses:
        '500':
          description: Internal server error
          content:
