      description: Set the state of a Billing Plan definition
      operationId: set-state
      parameters:
      - name: plan_definition_id
        in: path
        required: true
        description: The Billing Plan definition ID
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitions
      requestBody:
        content:
          application/json:
            schema:
