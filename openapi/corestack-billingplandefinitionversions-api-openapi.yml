      description: Parse and validate a raw json string to be used for importing a Billing Plan version
      operationId: parse-import
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitionVersions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawImport'
        required: true
  /v1/billing_plans/version/{version_id}:
    get:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlanDefinitionVersion'
      summary: Get Billing Plan version details by version_id
      description: Get Billing Plan version details by version_id
      operationId: get@@@3
      parameters:
      - name: version_id
        in: path
        required: true
        description: The Billing Plan version ID
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitionVersions
  /v1/billing_plans/version/{version_id}/make_head:
    patch:
      responses:
        '500':
