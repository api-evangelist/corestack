    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Manage BillOps Plan Versions
servers:
- url: /
tags:
- name: BillingPlanDefinitionVersions
  description: Manage BillOps Plan Versions
paths:
  /v1/billing_plans/version/batch:
    post:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                description: List of billing plan versions
                items:
                  $ref: '#/components/schemas/BillingPlanDefinitionVersion'
      summary: Fetch Billing Plan versions by ids
      description: Fetch Billing Plan versions by ids
      operationId: batch@@@3
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitionVersions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordIdentityBatchRequest'
        required: true
  /v1/billing_plans/version/create:
    post:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlanDefinitionVersion'
      summary: Create a new version of a Billing Plan
      description: Create a new version of a Billing Plan
      operationId: create@@@3
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitionVersions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingPlanDefinitionVersion'
        required: true
  /v1/billing_plans/version/parse_import:
    post:
      responses:
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
