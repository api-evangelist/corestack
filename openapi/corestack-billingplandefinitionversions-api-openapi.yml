      description: Make a Billing Plan version the head version
      operationId: make-head
      parameters:
      - name: version_id
        in: path
        required: true
        description: The Billing Plan version ID
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - BillingPlanDefinitionVersions
  /v1/billing_plans/version/{version_id}/make_release:
    patch:
