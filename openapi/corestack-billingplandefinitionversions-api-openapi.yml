components:
  schemas:
    BaseDefinitionVersion:
      properties:
        sysId:
          type: string
          description: Identifier of the version
        createdOn:
          type: string
          format: date-time
          description: Version created on
        updatedOn:
          type: string
          format: date-time
          description: Version  updated on
        version:
          type: integer
          default: Sequence number of the version
        definition:
          description: Reference to the definition
          $ref: '#/components/schemas/RecordIdentity'
        predecessor:
          description: Reference to the previous version
          $ref: '#/components/schemas/RecordIdentity'
      type: object
    BillingPlanDefinitionVersion:
      allOf:
      - $ref: '#/components/schemas/BaseDefinitionVersion'
      - properties:
          details:
            description: Details of the version
            $ref: '#/components/schemas/BillingPlanConfiguration'
          status:
            type: string
            description: Billing Plan Execution Status. This field is used to indicate the completion status of the billing plan execution.
            example: completed
            enum:
            - completed
            - failed
            - in_progress
            - pending
            - na
            x-cs-enum-type: BillingPlanExecutionStatus
          statuses:
            type: array
            description: Status by service account
            items:
              $ref: '#/components/schemas/BillingPlanSyncStatus'
          created_by:
            type: string
            description: Created by
            x-cs-type: ObjectId
          updated_by:
            type: string
            description: Updated by
            x-cs-type: ObjectId
        type: object
    BillingRuleGroup:
      allOf:
      - $ref: '#/components/schemas/BillingRule'
      - properties:
          rules:
            type: array
            description: List of rules
            items:
              $ref: '#/components/schemas/BillingRule'
        type: object
      x-cs-type-name: BillingRuleGroup
    QueryOperator:
