    UpdateComplianceStandardRequest:
      allOf:
      - $ref: '#/components/schemas/ComplianceStandardBase'
      - properties: {}
        type: object
    ComplianceStandardRequest:
      required:
      - cloud_accounts
      - compliance_uri
      properties:
        cloud_accounts:
          type: array
          description: ID of the cloud account. The ID is unique, it can be obtained from the list cloud account api.
          items:
            type: string
        compliance_uri:
          type: string
          description: uri of compliance standard This can be fetched from the compliance standards list API call.
      type: object
    SecurityDashboardCompliance:
      properties:
        cloud_account_id:
          type: string
          description: Cloud Account Id
        high:
          $ref: '#/components/schemas/SecurityDashboardComplianceSeverity'
        medium:
