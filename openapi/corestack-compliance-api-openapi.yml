    ComplianceAssessmentControlAnswerResponse:
      required:
      - assessment_control_id
      - assessment_control_status
      - tenant_id
      properties:
        assessment_control_id:
          type: string
          description: Unique ID for the assessment control ID
          x-cs-type: ObjectId
        tenant_id:
          type: string
          description: Tenant ID
          x-cs-type: ObjectId
        assessment_control_status:
          type: string
          description: Status of assessment control
          example: SUCCESS
          enum:
          - SUCCESS
          - VIOLATIONS
          - ERROR
          - OPEN
          x-cs-enum-type: ComplianceControlStatus
        assessment_control_evidence:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceAssessmentControlEvidence'
        compliance_control_uri:
          type: string
          description: Unique URI for the compliance control
      type: object
    ComplianceDetailsForPoliciesResponse:
      required:
      - definition_id
      - impact
      - page_count
      - policy_name
      - resolution_status
      - resource_counts
      - skip_allowed
      - total_count
      properties:
        skip_allowed:
          type: string
          description: Skip allowed true/false
        resolution_status:
          type: string
          description: resolution_status
        total_count:
          type: string
          description: total_count
        page_count:
          type: string
          description: page_count
        actions:
          type: array
          description: actions
          items:
            type: object
        policy_name:
          type: string
          description: policy_name
        resource_counts:
          type: string
          description: resource_counts
        impact:
          type: string
          description: impact
        definition_id:
          type: string
          description: definition_id
      type: object
    ComplianceExecuteStandardRequest:
      required:
      - service_account_ids
      properties:
        service_account_ids:
          type: array
          description: List of Service Account IDs
          items:
            type: string
            x-cs-type: ObjectId
        mark_complete:
          type: boolean
          description: Mark existing in-progress assessment as complete prior to start of new assessment
      type: object
    ComplianceAssessmentHistoryListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/ComplianceAssessmentHistorySortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/ComplianceAssessmentHistoryFilter'
      type: object
    CreateComplianceStandardRequest:
      allOf:
      - $ref: '#/components/schemas/ComplianceStandardBase'
      - required:
        - controls_definition_content
        - supported_cloud_providers
        - tenant_id
        properties:
          tenant_id:
            type: string
            description: Tenant ID associated with the standard
            x-cs-type: ObjectId
          supported_cloud_providers:
            type: array
            description: Cloud providers this standard applies to (e.g., AWS, Azure, GCP)
            items:
              type: string
              description: Cloud Provider to select
              example: AWS
              enum:
              - AWS
              - Azure
              - AzureStack
              - Azure_CSP
              - Azure_CSP-Direct
              - Azure_EA
              - Azure_MCA
              - Cloudstack
              - GCP
              - MS_VMM
              - OCI
              - Openstack
              - PrivateCloud
              - Rackspace
              - VMware
              - VMware_VCD
              - vCenter
              x-cs-enum-type: CloudServiceName
          controls_definition_content:
            description: CSV/XLSX file with control definitions
            $ref: '#/components/schemas/ControlsDefinitionContent'
        type: object
    ComplianceAssessmentSummaryDetailRequest:
      properties:
        tenant_ids:
          type: array
          items:
            type: string
            description: Tenant ID
            x-cs-type: ObjectId
        service_account_ids:
          type: array
          description: Optional list of service account IDs to narrow the filter response. Omit to retrieve all accounts under the tenant.
          items:
            type: string
            x-cs-type: ObjectId
        include_all_standards:
          type: boolean
          description: Return every standard that has a latest assessment, including standards without violated policies. Defaults to false, which returns only standards with violated policies.
      type: object
    ComplianceAssessmentControlListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/ComplianceAssessmentControlSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/ComplianceAssessmentControlDetailFilter'
      type: object
    ComplianceTenantSummaryRequest:
      properties:
        filters:
          description: Query based on Tenant IDs, Cloud Providers, Cloud Account Ids, Compliance URIs and Duration
          $ref: '#/components/schemas/QueryOperator'
      type: object
    ControlsDefinitionContent:
      required:
      - content
      - filename
      properties:
        filename:
          type: string
          description: Name of the CSV/XLSX file (e.g., controls.csv)
        content:
          type: string
          description: Base64-encoded file content
      type: object
    ComplianceAssessmentSummaryDetail:
      required:
      - assessment_summary_details
      - tenant_id
      properties:
        tenant_id:
          type: string
          description: Tenant ID
          x-cs-type: ObjectId
        assessment_summary_details:
          type: array
          description: List of assessment summary details per service account
          items:
            $ref: '#/components/schemas/ComplianceAssessmentSummaryAccountDetail'
      type: object
    SecurityDashboardComplianceStatus:
      properties:
        compliance_name:
          type: string
          description: Name of Compliance
        cloud_accounts_status:
          type: array
          description: Security Dashboard Compliance
          items:
            $ref: '#/components/schemas/SecurityDashboardCompliance'
      type: object
    ComplianceControlBase:
      required:
      - control_action_attributes
      - control_attributes
      properties:
        control_attributes:
          type: object
          description: Dynamic map of control attribute names to values
          additionalProperties:
            type: string
        control_action_attributes:
          type: object
          description: Dynamic map of action attribute names to values
          additionalProperties:
            type: string
        policy_mapping:
          type: array
          description: List of policy URIs to map to this control
          items:
            type: string
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
