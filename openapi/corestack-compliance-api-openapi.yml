      - description: Number of records to display
        name: limit
        in: query
        schema:
          type: integer
          enum:
          - '10'
          - '25'
          - '50'
          - '100'
      - description: Page number
        name: page
        in: query
        schema:
          type: integer
      - description: search assessment
        required: false
        name: search
        in: query
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Compliance
