          items:
            type: string
      type: object
    ComplianceSummaryRequest:
      required:
      - tenant_id
      properties:
        tenant_id:
          type: array
          description: Specify the tenant ID. This is a unique ID and can be retrieved using the List Tenants API
          items:
            type: string
        services:
          type: array
          description: Allowed services
          items:
            type: string
