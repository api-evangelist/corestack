    CostAnomalySummary:
      required:
      - anomaly_type
      properties:
        anomaly_type:
          type: string
          description: Anomaly Type of the cost. Example 'anomaly_type':'above_threshold'
          example: below_threshold
          enum:
          - below_threshold
          - above_threshold
          x-cs-enum-type: CostAnomalyType
        anomaly_count:
          type: integer
          description: Product category wise anomaly count
        cost_impact:
          type: number
          description: Product category level cost impact
        resources:
          type: array
          description: Anomalous resource details
          items:
            $ref: '#/components/schemas/CostAnomalyResourceDetails'
        upper_cost_bound:
          type: number
          description: Upper cost bound of daily cost anomaly summary
        lower_cost_bound:
          type: number
          description: Lower cost bound of daily cost anomaly summary
        expected_cost:
          type: number
          description: Expected cost of daily cost anomaly summary
        actual_cost:
          type: number
          description: Actual cost of daily cost anomaly
        reject_until:
          type: string
          format: date-time
          description: Rejected Until time for the anomaly
        reject_reason:
          type: string
          description: Rejected Reason
      type: object
    CostAnomalyResourcesRequest:
      required:
      - end_date
      - start_date
      properties:
        service_account_ids:
          type: array
          description: Service Account IDs
          items:
            type: string
            x-cs-type: ObjectId
        filters:
          description: Query expression to filter line items
          $ref: '#/components/schemas/QueryOperator'
        start_date:
          type: string
          format: date-time
          description: specify the start date
        end_date:
          type: string
          format: date-time
          description: specify the end date
        time_zone:
          type: string
          description: Optional timezone of the caller
        billing_source:
          type: string
          description: Records based on the actual metric that is used during anomaly detection
      type: object
    CostAnomalySummaryRequest:
      required:
      - end_date
      - start_date
      properties:
        service_account_ids:
          type: array
          description: Service Account IDs
          items:
            type: string
            x-cs-type: ObjectId
        filters:
          description: Query expression to filter line items
          $ref: '#/components/schemas/QueryOperator'
        start_date:
          type: string
          format: date-time
          description: specify the start date
        end_date:
          type: string
          format: date-time
          description: specify the end date
        anomaly_status:
          type: string
          description: Required Anomaly status
          example: active
          enum:
          - active
          - rejected
          x-cs-enum-type: AnomalyStatus
        time_zone:
          type: string
          description: Optional timezone of the caller
        billing_source:
          type: string
          description: Records based on the actual metric that is used during anomaly detection
      type: object
    CostAnomalyGroupingRuleResponse:
      required:
      - bill_date
      - billing_source
      - currency
      - dimension_id
      - grouping_rule_id
      properties:
        dimension_id:
          type: string
          description: Dimension id
        grouping_rule_id:
          type: string
          description: Grouping rule id
        currency:
          type: string
          description: currency of the cost. Example 'currency':'USD'
          example: AED
          enum:
          - AED
          - ALL
          - ARS
          - AUD
          - BAM
          - BDT
          - BGN
          - BHD
          - BRL
          - CAD
          - CHF
          - CLP
          - CNY
          - COP
          - CRC
          - CZK
          - DKK
          - EGP
          - EUR
          - GBP
          - HKD
          - HRK
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KES
          - KRW
          - KWD
          - KZT
          - MOP
          - MVR
          - MXN
          - MYR
          - NOK
          - NZD
          - OMR
          - PEN
          - PHP
          - PKR
          - PLN
          - QAR
          - RON
          - RSD
          - RUB
          - SAR
          - SEK
          - SGD
          - THB
          - TRY
          - TWD
          - USD
          - VND
          - ZAR
          x-cs-enum-type: Currency
        bill_date:
          type: string
          format: date-time
          description: Bill date / day for this summary
        anomaly_summary:
          description: Aggregate anomaly summary for the grouping rule
          $ref: '#/components/schemas/CostAnomalyGroupingRuleAggregate'
        anomaly_details:
          type: array
          description: List of individual anomalies under the grouping rule
          items:
            $ref: '#/components/schemas/CostAnomalyGroupingRuleDetail'
        billing_source:
          type: string
          description: Records based on the actual metric that is used during anomaly detection
      type: object
    DimensionRuleMapping:
      required:
      - dimension_id
      - grouping_rule_ids
      properties:
        dimension_id:
          type: string
          description: Dimension ID
        grouping_rule_ids:
          type: array
          description: Grouping Rule IDs that belong to this dimension
          items:
            type: string
      type: object
    CostAnomalyGroupingRuleAggregate:
      required:
      - actual_cost
      - anomaly_type
      - cost_impact
      - expected_cost
      properties:
        cost_impact:
          type: number
          description: Aggregate cost impact for the grouping rule
        expected_cost:
          type: number
          description: Expected aggregated cost
        actual_cost:
          type: number
          description: Actual aggregated cost
        anomaly_count:
          type: integer
          description: Grouping Rule wise anomaly count
        anomaly_type:
          type: string
          description: Aggregate anomaly type for the grouping rule
          example: below_threshold
          enum:
          - below_threshold
          - above_threshold
          x-cs-enum-type: CostAnomalyType
        upper_bound:
          type: number
          description: Upper bound for the aggregate (if applicable)
        lower_bound:
          type: number
          description: Lower bound for the aggregate (if applicable)
      type: object
    CostAnomalySummaryResource:
      required:
      - bill_date
      - billing_source
      - product_category
      - resource_category
      - service_account_id
      properties:
        service_account_id:
          type: string
          description: service account id
          x-cs-type: ObjectId
        bill_date:
          type: string
          format: date-time
          description: Time of results
        product_category:
          type: string
          description: Name of the Product category
        resource_category:
          type: string
          description: Name of the Resource category
        anomalies:
          type: array
          description: categories wise daily cost anomaly summary
          items:
            $ref: '#/components/schemas/CostAnomalyResourceDetails'
        billing_source:
          type: string
          description: Records based on the actual metric that is used during anomaly detection
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
