openapi: 3.2.0
info:
  title: CoreStack External Cost Anomaly API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Cost Anomaly Detection
servers:
- url: /
tags:
- name: Cost Anomaly
  description: Cost Anomaly Detection
paths:
  /cost_anomaly/billing_cost_anomaly:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostAnomalySummaryResponse'
      summary: Get Account wise daily Billing Cost Anomaly
      description: View Billing Cost Anomaly Data.
      operationId: CostAnomalySummary
      security:
      - auth_token: []
      tags:
      - Cost Anomaly
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostAnomalySummaryRequest'
        required: true
  /cost_anomaly/billing_cost_anomaly_resources:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostAnomalyResourcesResponse'
      summary: Get Account wise daily Billing Cost Anomaly Resources
      description: View Billing Cost Anomaly Resources.
      operationId: CostAnomalyResources
      security:
      - auth_token: []
      tags:
      - Cost Anomaly
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostAnomalyResourcesRequest'
        required: true
  /cost_anomaly/reject_anomaly:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Reject Billing Cost Anomaly
      description: Reject Anomaly
      operationId: RejectAnomaly
      security:
      - auth_token: []
      tags:
      - Cost Anomaly
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostAnomalyRejectRequest'
        required: true
  /v2/cost_anomaly/dimension/trigger:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Trigger cost anomaly detection for a dimension, optionally filtered by grouping rules
      description: Trigger cost anomaly detection for a dimension, using grouping rules as filters.
      operationId: TriggerCostAnomalyDetectionForDimension
      security:
      - auth_token: []
      tags:
      - Cost Anomaly
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostAnomalyDimensionTriggerRequest'
        required: true
  /v2/cost_anomaly/dimension_grouping_rule/reject:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Reject Billing Cost Anomaly for Grouping Rule
      description: Reject Anomaly Grouping Rule
      operationId: RejectAnomalyDimensionGroupingRule
      security:
      - auth_token: []
      tags:
      - Cost Anomaly
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostAnomalyGroupingRuleRejectRequest'
        required: true
  /v2/cost_anomaly/dimension_grouping_rule_view:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CostAnomalyGroupingRuleResponse'
      summary: Get grouping rule–wise daily cost anomalies
      description: Retrieve grouping rule–wise cost anomalies.
      operationId: GetGroupingRuleCostAnomalies
      security:
      - auth_token: []
      tags:
      - Cost Anomaly
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostAnomalyGroupingRuleRequest'
        required: true
components:
  schemas:
    CostAnomalyDimensionTriggerRequest:
      required:
      - dimension_id
      properties:
        dimension_id:
          type: string
          description: Dimension ID
        grouping_rule_ids:
          type: array
          items:
            type: string
            description: Grouping Rule IDs
      type: object
    CostAnomalyGroupingRuleRejectRequest:
      required:
      - bill_date
      - currency
      - dimension_id
      - grouping_rule_id
      - product_category
      - reject_reason
      - reject_until
      - resource_category
      - service_account_id
      properties:
        service_account_id:
          type: string
          description: Service Account ID
          x-cs-type: ObjectId
        dimension_id:
          type: string
          description: Dimension ID
        grouping_rule_id:
          type: string
          description: Grouping Rule ID
        reject_until:
          type: string
          format: date-time
          description: Reject Until time for the anomaly
        reject_reason:
          type: string
          description: Rejected Reason
        product_category:
          type: string
          description: Product Category
        resource_category:
          type: string
          description: Resource Category
        bill_date:
          type: string
          format: date-time
          description: Bill date in yyyy-mm-dd format
        currency:
          type: string
          description: Billing Currency
          example: AED
          enum:
          - AED
          - ALL
          - ARS
          - AUD
          - BAM
          - BDT
          - BGN
          - BHD
          - BRL
          - CAD
          - CHF
          - CLP
          - CNY
          - COP
          - CRC
          - CZK
          - DKK
          - EGP
          - EUR
          - GBP
          - HKD
          - HRK
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KES
          - KRW
          - KWD
          - KZT
          - MOP
          - MVR
          - MXN
          - MYR
          - NOK
          - NZD
          - OMR
          - PEN
          - PHP
          - PKR
          - PLN
          - QAR
          - RON
          - RSD
          - RUB
          - SAR
          - SEK
          - SGD
          - THB
          - TRY
          - TWD
          - USD
          - VND
          - ZAR
          x-cs-enum-type: Currency
      type: object
    CostAnomalyProductCategorySummary:
      allOf:
      - $ref: '#/components/schemas/CostAnomalySummary'
      - required:
        - product_category
        - resource_category
        properties:
          product_category:
            type: string
            description: Name of the Product category
          resource_category:
            type: string
            description: Name of the Resource category
        type: object
    CostAnomalyResourceDetails:
      required:
      - anomaly_type
      - cost_impact
      - resource_id
      properties:
        resource_id:
          type: string
          description: Name of the resource
        cost_impact:
          type: number
          description: Cost incurred by the resource
        anomaly_type:
          type: string
          description: Anomaly Type of the cost. Example 'anomaly_type':'above_threshold'
          example: below_threshold
          enum:
          - below_threshold
          - above_threshold
          x-cs-enum-type: CostAnomalyType
        anomaly_count:
          type: integer
          description: Product category wise anomaly count
        upper_cost_bound:
          type: number
          description: Upper cost bound of daily cost anomaly summary
        lower_cost_bound:
          type: number
          description: Lower cost bound of daily cost anomaly summary
        expected_cost:
          type: number
          description: Expected cost of daily cost anomaly summary
        actual_cost:
          type: number
          description: Actual cost of daily cost anomaly
      type: object
    CostAnomalyResourcesResponse:
      properties:
        details:
          type: array
          description: Cost Anomaly resource wise daily summary
          items:
            $ref: '#/components/schemas/CostAnomalySummaryResource'
      type: object
    CostAnomalyGroupingRuleRequest:
      required:
      - currency
      - dimension_rule_mappings
      - end_date
      - start_date
      properties:
        start_date:
          type: string
          format: date-time
          description: specify the start date
        end_date:
          type: string
          format: date-time
          description: specify the end date
        anomaly_status:
          type: string
          description: Required Anomaly status
          example: active
          enum:
          - active
          - rejected
          x-cs-enum-type: AnomalyStatus
        time_zone:
          type: string
          description: Optional timezone of the caller
        filters:
          description: Query expression to filter line items
          $ref: '#/components/schemas/QueryOperator'
        currency:
          type: string
          description: Billing Currency
          example: AED
          enum:
          - AED
          - ALL
          - ARS
          - AUD
          - BAM
          - BDT
          - BGN
          - BHD
          - BRL
          - CAD
          - CHF
          - CLP
          - CNY
          - COP
          - CRC
          - CZK
          - DKK
          - EGP
          - EUR
          - GBP
          - HKD
          - HRK
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KES
          - KRW
          - KWD
          - KZT
          - MOP
          - MVR
          - MXN
          - MYR
          - NOK
          - NZD
          - OMR
          - PEN
          - PHP
          - PKR
          - PLN
          - QAR
          - RON
          - RSD
          - RUB
          - SAR
          - SEK
          - SGD
          - THB
          - TRY
          - TWD
          - USD
          - VND
          - ZAR
          x-cs-enum-type: Currency
        dimension_rule_mappings:
          type: array
          description: List of dimensions with their respective grouping rule IDs
          items:
            $ref: '#/components/schemas/DimensionRuleMapping'
        billing_source:
          type: string
          description: Records based on the actual metric that is used during anomaly detection
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    CostAnomalySummaryAccount:
      required:
      - bill_date
      - billing_source
      - cloud_account_id
      properties:
        cloud_account_id:
          type: string
          description: service account id
        bill_date:
          type: string
          format: date-time
          description: Time of results
        categories:
          type: array
          description: categories wise daily cost anomaly summary
          items:
            $ref: '#/components/schemas/CostAnomalyProductCategorySummary'
        service_account_level_anomalies:
          description: Service account level anomalies
          $ref: '#/components/schemas/CostAnomalySummary'
        billing_source:
          type: string
          description: Records based on the actual metric that is used during anomaly detection
      type: object
    CostAnomalySummaryResponse:
      properties:
        details:
          type: array
          description: Cost Anomaly account  wise daily summary
          items:
            $ref: '#/components/schemas/CostAnomalySummaryAccount'
      type: object
    CostAnomalyGroupingRuleDetail:
      required:
      - actual_cost
      - anomaly_type
      - cost_impact
      - expected_cost
      - product_category
      - resource_category
      - service_account_id
      properties:
        anomaly_type:
          type: string
          description: Anomaly type for this detail row
          example: below_threshold
          enum:
          - below_threshold
          - above_threshold
          x-cs-enum-type: CostAnomalyType
        anomaly_count:
          type: integer
          description: Product category wise anomaly count
        cost_impact:
          type: number
          description: Cost impact for this anomaly
        expected_cost:
          type: number
          description: Expected cost for this anomaly
        actual_cost:
          type: number
          description: Actual cost for this anomaly
        service_account_id:
          type: string
          description: Service Account ID for this anomaly
          x-cs-type: ObjectId
        product_category:
          type: string
          description: Product category, e.g. EC2
        resource_category:
          type: string
          description: Resource category, e.g. Compute
        resource_id:
          type: string
          description: Resource identifier, e.g. ec2:i-123
        region:
          type: string
          description: Region for the resource, e.g. us-east-1
        reject_until:
          type: string
          format: date-time
          description: Rejected Until time for the anomaly
        reject_reason:
          type: string
          description: Rejected Reason
      type: object
    CostAnomalyRejectRequest:
      required:
      - bill_date
      - product_category
      - reject_reason
      - reject_until
      - resource_category
      - service_account_ids
      properties:
        service_account_ids:
          type: array
          description: Service Account IDs
          items:
            type: string
            x-cs-type: ObjectId
        bill_date:
          type: string
          format: date-time
          description: Bill date in yyyy-mm-dd format
        product_category:
          type: string
          description: Product Category name
        resource_category:
          type: string
          description: Resource Category name
        reject_until:
          type: string
          format: date-time
        reject_reason:
          type: string
      type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
      type: object
      x-cs-subtypes:
