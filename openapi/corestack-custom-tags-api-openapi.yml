openapi: 3.2.0
info:
  title: CoreStack External Custom Tags API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Manage Custom Tags
servers:
- url: /
tags:
- name: Custom Tags
  description: Manage Custom Tags
paths:
  /v1/custom_tags/master_account/{master_account_id}:
    delete:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Delete CustomTags by Master Account
      description: This delete method is used to delete the CustomTags for a specific MasterAccount
      operationId: deleteMasterAccountCustomTags
      parameters:
      - name: master_account_id
        in: path
        required: true
        description: specify the master account id
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Custom Tags
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                description: List of tag key/value pairs
                items:
                  $ref: '#/components/schemas/KeyValuePair'
      summary: List CustomTags by Master Account
      description: This GET method is used to retrieve the list of CustomTags available for a specific MasterAccount.
      operationId: getMasterAccountCustomTags
      parameters:
      - name: master_account_id
        in: path
        required: true
        description: specify the master account id
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Custom Tags
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
      summary: Set CustomTags by Master Account
      description: This Post method is used to update the list of CustomTags for a specific MasterAccount.
      operationId: setMasterAccountCustomTags
      parameters:
      - name: master_account_id
        in: path
        required: true
        description: specify the master account id
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Custom Tags
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: List of tag key/value pairs
              items:
                $ref: '#/components/schemas/KeyValuePair'
        required: true
  /v1/custom_tags/tenant/{tenant_id}:
    delete:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Delete CustomTags by Tenant
      description: This Delete method is used to delete the CustomTags for a specific Tenant.
      operationId: deleteTenantCustomTags
      parameters:
      - name: tenant_id
        in: path
        required: true
        description: Specify the tenant ID. This is a unique ID and can be retrieved using the List Tenants API.
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Custom Tags
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                description: List of tag key/value pairs
                items:
                  $ref: '#/components/schemas/KeyValuePair'
      summary: List CustomTags by Tenant
      description: This GET method is used to retrieve the list of CustomTags available for a specific Tenant.
      operationId: getTenantCustomTags
      parameters:
      - name: tenant_id
        in: path
        required: true
        description: Specify the tenant ID. This is a unique ID and can be retrieved using the List Tenants API.
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Custom Tags
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Set CustomTags by Tenant
      description: This Post method is used to update the list of CustomTags for a specific Tenant.
      operationId: setTenantCustomTags
      parameters:
      - name: tenant_id
        in: path
        required: true
        description: Specify the tenant ID. This is a unique ID and can be retrieved using the List Tenants API.
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Custom Tags
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: List of tag key/value pairs
              items:
                $ref: '#/components/schemas/KeyValuePair'
        required: true
components:
  schemas:
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    KeyValuePair:
      properties:
        key:
          type: string
          description: Key of the pair
        value:
          type: string
          description: Value of the pair
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
