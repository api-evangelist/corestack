components:
  schemas:
    PolicyRecommendationViewResponse:
      required:
      - actions
      - classification
      - cloud
      - cloud_account_id
      - created_at
      - description
      - impact
      - policy_id
      - recommendation_id
      - recommendation_name
      - resources
      - status
      - tenant_name
      properties:
        recommendation_id:
          type: string
          description: unique recommendation Id
        recommendation_name:
          type: string
          description: recommendation name
        policy_id:
          type: array
          description: list of policy ids for which the recommendation exists
          items:
            type: string
        status:
          type: string
          description: resolution status of the recommendation the values will be open, resolved
        impact:
          type: string
          description: impact of recommended changes
        classification:
          type: string
          description: classified based on the kind of recommendation provided to the user can be cost, security etc
        cloud_account_id:
          type: string
          description: cloud account id impacted by the recommendation
        cloud:
          type: string
          description: cloud on which this account exits for which the recommendations exists
        tenant_name:
          type: string
          description: 'tenant for which the recommendation exits '
        created_at:
          type: string
          description: UTC time at which the recommendation was created
        description:
          type: string
          description: Description about the recommendation in details
        actions:
          type: array
          description: List of actions which can be performed to resolve the policy violations
          items:
            $ref: '#/components/schemas/RecommendationActionResponse'
        resources:
          type: array
          description: List of resources on which the recommendations can be performed
          items:
            $ref: '#/components/schemas/ResourceRecommendationModel'
      type: object
    ResourceViewDetails:
      required:
      - resource_details
      properties:
        resource_details:
          type: array
          description: Template/Scripts/Policies Details that is scheduled to run
          items:
            $ref: '#/components/schemas/ResourceDetails'
      type: object
    ViewScheduleResponse:
      required:
      - args
      - created_at
      - created_by
      - description
      - execution_logs
      - name
      - next_run
      - recurrence
      - resource
      - schedule
      - type
      - updated_at
      - updated_by
      properties:
        name:
          type: string
          description: Schedule Name
        type:
          type: string
          description: Schedule type
          example: template
          enum:
          - template
          - script
          - policy
          x-cs-enum-type: ScheduleType
        description:
          type: string
          description: Description of the schedule
        recurrence:
          type: string
          description: Re-occurence of the schedule
        next_run:
          type: string
          description: When will the schedule run for the next time
        schedule:
          type: object
          description: Schedule date and time details
        args:
          type: object
          description: Input Parameters for that Template/Policy/Script that is scheduled
        resource:
          type: array
          description: Template/Policy/Script Details that is scheduled
          items:
            $ref: '#/components/schemas/ResourceViewDetails'
        execution_logs:
          type: array
          description: Execution Log Details
          items:
            $ref: '#/components/schemas/ExecutionLogDetails'
        created_at:
          type: string
          description: When the schedule is created
        created_by:
          type: string
          description: Who has created the schedule
        updated_by:
          type: string
          description: Who has updated the schedule
        updated_at:
          type: string
          description: When the schedule is updated
      type: object
    ResourceRecommendationModel:
      required:
      - resource_id
      - resource_name
      - resource_recommendation_id
      - resource_type
      - resourcegroup_location
      - status
      properties:
        resource_recommendation_id:
          type: string
          description: unique identifier for resource recommendation
        resource_id:
          type: string
          description: ' Resource identifier id of resource recommendation'
        resource_name:
          type: string
          description: Resource identifier name of resource recommendation
        resource_type:
          type: string
          description: Type of resource
        resourcegroup_location:
          type: string
          description: resource group location
        status:
          type: string
          description: Status of resource recommendation
      type: object
    UpdatePolicyRequest:
      required:
      - category
      - classification
      - content
      - name
      - scope
      - severity
      - sub_classification
      properties:
        name:
          type: string
          description: policy name which is unique and does not allow space or special character
        display_name:
          type: string
          description: Display name of policy which allow space this is to mostly show on the ui
        description:
          type: string
          description: A brief explanation of the policy.
        type:
          type: array
          description: Indicates the type of policy
          items:
            type: string
        category:
          type: string
          description: The category will be either service or resource
        content:
          type: string
          description: The policy content
        is_system_policy:
          type: boolean
          description: Flag to identify system policies
        metadata:
          description: Metadata about policy
          $ref: '#/components/schemas/PolicyMetadata'
        engine_type:
          type: string
          description: Engine type of the policy
          example: corestack_policy
          enum:
          - corestack_policy
          - aws_organization_policy
          - azure_policy
          - aws_config
          - gcp_organization_policy
          - gcp_policy
          - kubernetes_policy
          - oracle_cloud_guard
          x-cs-enum-type: PolicyEngineType
        cloud:
          type: array
          description: Displays the cloud associated with the policy
          items:
            type: string
            description: Cloud Provider to select
            example: AWS
            enum:
            - AWS
            - Azure
            - AzureStack
            - Azure_CSP
            - Azure_CSP-Direct
            - Azure_EA
            - Azure_MCA
            - Cloudstack
            - GCP
            - MS_VMM
            - OCI
            - Openstack
            - PrivateCloud
            - Rackspace
            - VMware
            - VMware_VCD
            - vCenter
            x-cs-enum-type: CloudServiceName
        classification:
          type: string
          description: Policies are classified based on the basis of the activity they perform, for example provisioning, Account Management, Utilization, etc. This value is displayed in this field
        sub_classification:
          type: string
          description: Sub classification for policy
        scope:
          type: string
          description: 'The scope of the policy:

            Account scope - All users under that account will have access to view and execute Only Account admins can update/delete the policies,

            Tenant Scope - Users with access to the specific tenant will have access to policies who can describe or execute policies. Tenant admins can only update/delete.

            Private Scope - User who created will only have access'
          example: private
          enum:
          - private
          - account
          - tenant
          x-cs-enum-type: AccountScope
        content_type:
          type: string
          description: Policy content source
          example: git
          enum:
          - git
          - file
          x-cs-enum-type: ContentType
        content_password_or_key:
          type: string
          description: Password or private key to access of Git repo if repo is authenticated required if the content type is git
        content_username:
          type: string
          description: Username of Git repo if repo is authenticated required if the content type is git
        content_url:
          type: string
          description: Git project URL when the content type is git required if the content type is git
        content_path:
          type: string
          description: Root path of the policy in git repo required if the content type is git
        severity:
          type: string
          description: Severity of policy
          example: high
          enum:
          - high
          - low
          - medium
          x-cs-enum-type: PolicySeverity
      type: object
    NamedParameter:
      required:
      - is_required
      - name
      - schema
      properties:
        name:
          type: string
          description: Name of the parameter
        display_name:
          type: string
          description: Display Name of the parameter
        is_required:
          type: boolean
          description: Whether the parameter is required.
        schema:
          $ref: '#/components/schemas/ParameterBase'
      type: object
    PolicyServiceAccountDetails:
      required:
      - cloud_account_id
      properties:
        cloud:
          type: string
          description: 'The cloud name of the account for which the policywill be executed ex: AWS, Azure, GCP, OCI etc'
        cloud_account_id:
          type: string
          description: Identifier of the cloud account on boarded in the on boarding section
        region:
          type: string
          description: The region of the service account where it needs to be executed, if this is not provided the policy will execute for all the region
        resourcegroup:
          type: string
          description: Resource group for which you need to execute the policy for, this is not a mandatory parameter to be passed
      type: object
    PolicyRecommendationListResponse:
      required:
      - recommendations
      properties:
        recommendations:
          description: Policy recommendation Info list
          $ref: '#/components/schemas/PolicyRecommendation'
      type: object
    JobExecutionOutputDetails:
