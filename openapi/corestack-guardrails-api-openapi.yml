            type: string
            description: Displays the service associated with the policy
            example: AWS
            enum:
            - AWS
            - Azure
            - AzureStack
            - Azure_EA
            - Azure_MCA
            - GCP
            - OCI
            - Openstack
            - OpenstackPublic
            x-cs-enum-type: PolicyServiceName
        engine_type:
          type: string
          description: Engine type of the policy
          example: corestack_policy
          enum:
          - corestack_policy
          - aws_organization_policy
          - azure_policy
          - aws_config
          - gcp_organization_policy
          - gcp_policy
          - kubernetes_policy
          - oracle_cloud_guard
          x-cs-enum-type: PolicyEngineType
        scope:
          type: string
          description: Scope of the policy
