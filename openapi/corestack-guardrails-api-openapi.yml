        display_name:
          type: string
          description: Display name of the policy
        description:
          type: string
          description: A brief explanation of the policy
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/NamedParameter'
        created_at:
          type: string
          format: date-time
        services:
          type: array
