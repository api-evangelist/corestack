        classification:
          type: string
          description: 'Policies are classified based on the basis of the activity they perform. For example: Provisioning, Account Management, Utilization, etc.'
        sub_classification:
          type: string
          description: Sub classification for policy
        resource_category:
          type: string
          description: Category of resource
        resource_type:
          type: string
          description: Type of resource
        service_resources:
