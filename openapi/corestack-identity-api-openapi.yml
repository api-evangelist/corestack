components:
  schemas:
    FilterOptionsCloudProvider:
      allOf:
      - $ref: '#/components/schemas/FilterOptionsCloudProviderLight'
      - properties:
          cloud_accounts:
            type: array
            description: List of accounts for this Cloud Provider
            items:
              $ref: '#/components/schemas/FilterOptionsCloudAccount'
        type: object
    ChangeTimezoneRequest:
      required:
      - new_timezone_id
      properties:
        new_timezone_id:
          type: string
          description: New timezone id to be set for the user. For a valid list of timezone values to use, please refer https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      type: object
    NotificationMessageResponse:
      required:
      - data
      - message
      - status
      properties:
        status:
          type: string
          description: Status of the notification & message api
        message:
          type: string
          description: Message of the notification & message api
        data:
          type: object
          description: data for the notification & message api
      type: object
    ChangeTimezoneData:
      required:
      - id
      - raw_offset
      properties:
        raw_offset:
          type: string
          description: Raw offset of the timezone. It means the amount of time in milliseconds to add to UTC to get standard time in the required time zone
        id:
          type: string
          description: ID of the Timezone such as Asia/Kolkata, Asia/Dubai and so on
      type: object
    ResetPasswordRequest:
      required:
      - email_id
      - url
      properties:
        email_id:
          type: string
          description: User email id.
        url:
          type: string
          description: Please Provide the URl
      type: object
    FiscalYearConfiguration:
      properties:
        start:
          type: string
          description: Start Date for Financial Year in DD-MMM format
        end:
          type: string
          description: End Date for Financial Year in DD-MMM format
      type: object
    UpdateRoleAssignment:
      properties:
        tenant_id:
          type: string
          description: ID of the tenant within the CoreStack account
        role_names:
          type: array
          description: Name of the Roles to be assigned to the user under a tenant
          items:
            type: string
      type: object
    UserDelegationRequest:
      properties:
        source_user_groups:
          type: array
          items:
            type: string
            description: User delegation source user groups
        source_roles:
          type: array
          items:
            type: string
            description: User delegation source roles
        source_users:
          type: array
          items:
            type: string
            description: User delegation source users
        target_master_account_id:
          type: string
          description: User delegation target account master id
        target_roles:
          type: array
          items:
            type: string
            description: User delegation target roles
        target_user_groups:
          type: array
          items:
            type: string
            description: User delegation target user groups
      type: object
    NotificationReportResponse:
      required:
      - message
      properties:
        status:
          type: string
          description: Result status
        message:
          type: string
          description: Result message
      type: object
    ConfigurationForNotifications:
      properties:
        enabled:
          type: boolean
          description: Whether Notifications Are Enabled
        emails:
          type: array
          description: Emails
          items:
            type: string
        webhooks:
          type: array
          description: Webhooks
          items:
            type: string
        microsoft_teams_webhooks:
          type: array
          description: Microsoft Teams Webhooks
          items:
            type: string
      type: object
    UserProfileActiveTenantResponse:
      properties:
        id:
          type: string
          description: ID for user that was updated
        tenant_id:
          type: string
          description: ID for the new active tenant
      type: object
    TenantDetails:
      required:
      - account_id
      - created_at
      - description
      - is_default
      - name
      - status
      - tenant_id
      properties:
        tenant_id:
          type: string
          description: Id of the tenant. This will be used for performing tenant level operations such as createPolicy, createScript, onboardCloudAccount and so on.
        name:
          type: string
          description: Unique name of the tenant provided as input while creating.
        description:
          type: string
          description: Description of the tenant.
        account_id:
          type: string
          description: Id of the CoreStack account under which this tenant resides.
        is_default:
          type: boolean
          description: Is the master tenant
        fiscal_year_configuration:
          description: Fiscal Year settings
          $ref: '#/components/schemas/FiscalYearConfiguration'
        cost_anomaly_settings:
          $ref: '#/components/schemas/CostAnomalyConfiguration'
        cost_processing_settings:
          $ref: '#/components/schemas/CostProcessingSettings'
        azure_hybrid_benefits_enabled:
          type: boolean
          description: azure hybrid benefits enabled under finOps
        disk_utilization_settings:
          description: enables disk utilization configuration for specified service accounts
          $ref: '#/components/schemas/DiskUtilizationSetting'
        dimension_settings:
          type: array
          items:
            $ref: '#/components/schemas/DimensionTenantSettings'
        status:
          type: string
          description: Indicates the status of the Tenant
          example: active
          enum:
          - active
          - suspended
          x-cs-enum-type: TenantStatus
        created_at:
          type: string
          description: Created DateTime in UTC of the tenant.
        activity_queue_notifications:
          $ref: '#/components/schemas/ActivityQueueNotificationDetails'
      type: object
    NameChangeHistoryEntry:
      required:
      - new_name
      - previous_name
      - updated_at
      - updated_by
      properties:
        previous_name:
          type: string
          description: Previous tenant name before the rename.
        new_name:
          type: string
          description: New tenant name after the rename.
        updated_by:
          type: string
          description: User who performed the rename.
        updated_at:
          type: string
          format: date-time
          description: DateTime in UTC when the rename was performed.
      type: object
    RoleDetails:
      required:
      - access
      - category
      - created_at
      - description
      - id
      - name
      - status
      - users
      properties:
        id:
          type: string
          description: ID of the Role. This is an auto generated and unique in the CoreStack system
        tenant_id:
          type: string
          description: Tenant Id for the Role
        name:
          type: string
          description: Name of the role. This is unique in the CoreStack system for a specific tenant
        status:
          type: string
          description: Status of the Role
        access:
          type: array
          description: List of access the role can perform in the tenant
          items:
            type: string
        users:
          type: integer
          description: Count of users having the role attached under a tenant
        description:
          type: string
          description: Description of the role
        created_at:
          type: string
          description: Date and time of role creation
        category:
          type: string
          description: Category of the specific role. Either default or custom
        policies:
          type: object
          description: List of policy available for a role
      type: object
    CostProcessingSettings:
      properties:
        max_tag_value_count:
          type: integer
          description: Maximum number of unique values per tag to process for cost allocation tags
        number_of_months_to_backfill:
          type: integer
          description: Back filling value for cost processing (in months)
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
