    BatchRequest:
      properties:
        ids:
          type: array
          description: Identifiers to fetch
          items:
            type: string
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    MasterAccountBillingSummaryResponse:
      properties:
        current_balance:
          type: number
          description: Current balance for the master account.
        total_spend:
          type: number
          description: Total spend for the master account.
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    MasterAccountBillingTransactionsBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/MasterAccountBillingTransactionDocument'
      type: object
    MasterAccountBillingTransactionRequestContext:
      required:
      - end_date
      - start_date
      properties:
        query:
          description: Query expression to filter the transactions
          $ref: '#/components/schemas/QueryOperator'
        start_date:
          type: string
          format: date-time
          description: Start of the transactions period
        end_date:
          type: string
          format: date-time
          description: End of the transactions period
      type: object
    MasterAccountBillingListTransactionRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/MasterAccountBillingListTransactionsSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/MasterAccountBillingTransactionRequestContext'
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
