openapi: 3.2.0
info:
  title: CoreStack External MasterAccount Billing API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Manage Master Account Billing
servers:
- url: /
tags:
- name: MasterAccount Billing
  description: Manage Master Account Billing
paths:
  /v1/billing/master_account/{master_account_id}/summary:
    parameters:
    - name: master_account_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterAccountBillingSummaryResponse'
      summary: Master Account Billing Summary
      description: Billing summary of the master account
      operationId: MasterAccountBillingSummary
      security:
      - auth_token: []
      tags:
      - MasterAccount Billing
  /v1/billing/master_account/{master_account_id}/transaction:
    parameters:
    - name: master_account_id
      in: path
      required: true
      schema:
        type: string
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterAccountBalanceUpdateResponse'
      summary: Record a transaction and Update the balance for the master account
      description: Update the balance for the master account
      operationId: MasterAccountBillingTransaction
      security:
      - auth_token: []
      tags:
      - MasterAccount Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterAccountBalanceUpdateRequest'
        required: true
  /v1/billing/master_account/{master_account_id}/validate_balance:
    parameters:
    - name: master_account_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Master Account Billing Balance Validate
      description: Validate Billing Balance of the master account
      operationId: MasterAccountBillingBalanceValidate
      security:
      - auth_token: []
      tags:
      - MasterAccount Billing
  /v1/billing/transaction/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterAccountBillingTransactionsBatchResponse'
      summary: Batch billing transactions
      description: List all billing transactions batches
      operationId: BillingTransactionsBatch
      security:
      - auth_token: []
      tags:
      - MasterAccount Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
  /v1/billing/transaction/list:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
