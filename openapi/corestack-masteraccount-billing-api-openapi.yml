        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      summary: List billing transactions
      description: List all Billing Transactions
      operationId: BillingTransactionsList
      security:
      - auth_token: []
      tags:
      - MasterAccount Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterAccountBillingListTransactionRequest'
        required: true
components:
  schemas:
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    MasterAccountBillingListTransactionsSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: created_at
          enum:
          - created_at
          x-cs-enum-type: MasterAccountBillingListTransactionsSortColumn
        ascending:
          type: boolean
      type: object
    MasterAccountBillingTransactionDocument:
      required:
      - status
      - transaction_type
      properties:
        sysId:
          type: string
          description: Id of the document.
        transaction_id:
          type: string
          description: Transaction id for the balance update
        tenant_id:
          type: string
          description: Id of the tenant where the balance is updated.
          x-cs-type: ObjectId
        conversation_id:
          type: string
          description: Id of conversation where the balance is updated.
          x-cs-type: ObjectId
        master_account_id:
          type: string
          description: Id of master account where the balance is updated.
          x-cs-type: ObjectId
        amount:
          type: number
          description: Amount for the transaction.
        transaction_type:
          type: string
          description: Type of billing transaction.
          example: credit
          enum:
          - credit
          - debit
          x-cs-enum-type: BillingTransactionType
        previous_balance:
          type: number
          description: Balance before the transaction.
        after_balance:
          type: number
          description: Balance after the transaction.
        status:
          type: string
          description: Type of billing transaction status.
          example: pending
          enum:
          - pending
          - completed
          - failed
          x-cs-enum-type: BillingTransactionStatus
        created_by:
          type: string
          description: Name of the user who made the balance update.
        created_at:
          type: string
          format: date-time
          description: Time when the transaction is initiated.
        processed_at:
          type: string
          format: date-time
          description: Time when the transaction is completed.
      type: object
    MasterAccountBalanceUpdateResponse:
      properties:
        transaction_id:
          type: string
          description: Transaction id for the balance update.
        previous_balance:
          type: number
          description: Balance amount before the update in master account balance.
        current_balance:
          type: number
          description: Balance amount after the update in master account balance.
      type: object
    MasterAccountBalanceUpdateRequest:
      required:
      - transaction_type
      properties:
        amount:
          type: number
          description: Balance amount to updated for the master account
        transaction_id:
          type: string
          description: Transaction id for the balance update
        user_name:
          type: string
          description: Name of the user who made the balance update.
        tenant_id:
          type: string
          description: Id of the tenant where the balance is updated.
          x-cs-type: ObjectId
        conversation_id:
          type: string
          description: Id of conversation where the balance is updated.
          x-cs-type: ObjectId
        transaction_type:
          type: string
          description: Type of billing transaction.
          example: credit
          enum:
          - credit
          - debit
          x-cs-enum-type: BillingTransactionType
      type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
      type: object
