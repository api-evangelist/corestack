                     },\n                                                                                         \"service_resource_metric_uri\": \"AWS/Compute/EC2/Instances/CPUUtilization\",\n                                                                                         \"status\": \"enabled/disabled\",\n                                                                                         \"metric_name\": \"CPUUtilization\"\n                                                                                     }]\n                                                                                 }\n                                                                             }\n                                                                             For Azure\n                                                                             ex:\n                                                                             {\n                                                                             \"Compute\": {\n                                                                                 \"Virtual_Machines\": {\n                                                                                     \"Virtual_Machines\": [{\n                                                                                         \"threshold_settings\": {\n                                                                                             \"threshold\" : 95,\n                                                                                             \"operator\" : \"GreaterThan\",\n                                                                                             \"window_size\" : \"PT15M\",\n                                                                                             \"aggregation\" : \"Total\"\n                                                                                         },\n                                                 