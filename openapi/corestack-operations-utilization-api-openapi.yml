openapi: 3.2.0
info:
  title: CoreStack External Operations Utilization API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Dashboard For Utilization
servers:
- url: /
tags:
- name: Operations Utilization
  description: Dashboard For Utilization
paths:
  /v1/operations/utilization_data/aggregate:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizationAggregateResponse'
      summary: Batch Utilization Data
      description: Retrieve the Utilization Data for the specified Resource ids
      operationId: UtilizationAggregateData
      security:
      - auth_token: []
      tags:
      - Operations Utilization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizationAggregationRequest'
        required: true
  /v1/operations/utilization_data/statistics:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizationStatisticsResponse'
      summary: List KPI statistics for Utilization Dashboard
      description: Retrieve the Over all statistics for the vm utilization.
      operationId: ListOverallStatisticsForUtilization
      security:
      - auth_token: []
      tags:
      - Operations Utilization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizationStatisticsRequest'
        required: true
components:
  schemas:
    IndividualKpiBase:
      properties:
        name:
          type: string
          description: Name of the metric for which kpi needs to be shown.
          example: cpu_utilization
          enum:
          - cpu_utilization
          - memory_utilization
          - disk_utilization
          x-cs-enum-type: MetricNamesForKpi
        supported_resources:
          type: integer
          description: Total number of resources for which the dashboard needs to present the data.
        maximum_utilized_resources:
          type: integer
          description: Number of resources which has crossed the high utilization base condition.
        minimum_utilized_resources:
          type: integer
          description: Number of resources which has fallen under the minimum utilization base condition.
        partially_utilized_resources:
          type: integer
          description: Number of resources which has been partially utilized.
        average_utilization_for_resources:
          type: number
          description: Average Utilization Crossed for the instance/vm.
      type: object
    MetricDetailedData:
      properties:
        date:
          type: string
          format: date-time
          description: Time stamp For which metrics are being measured.
        value:
          type: number
          description: Value for the metric in the provided time frame.
      type: object
    PatchReadinessStatistics:
      properties:
        supported_resources:
          type: integer
          description: Total number of resources for which the dashboard needs to present the data.
        ready_to_update:
          type: integer
          description: Total number of instance/vm which is ready for updating the patch.
      type: object
    ResourceLevelUtilizationAggregate:
      properties:
        resource_id:
          type: string
          description: Unique Id of the resource for which utilization detail is being shown.
        service_account_id:
          type: string
          description: Id of the service account to which the resource belongs to.
          x-cs-type: ObjectId
        platform:
          type: string
          description: Name of the os for the instance or vm.
        resource_name:
          type: string
          description: Name of the resource for which utilization detail is being shown.
        metric_data:
          $ref: '#/components/schemas/KpiMetricAggregate'
      type: object
    UtilizationStatisticsRequest:
      required:
      - tenant_ids
      properties:
        tenant_ids:
          type: array
          description: List of tenant ids for which data needs to be passed.
          items:
            type: string
            x-cs-type: ObjectId
      type: object
    UtilizationAggregationRequest:
      allOf:
      - $ref: '#/components/schemas/UtilizationStatisticsRequest'
      - required:
        - end_date
        - start_date
        properties:
          filters:
            description: Query expression to filter line items.
            $ref: '#/components/schemas/QueryOperator'
          additional_filters:
            description: Additional Query expression to filter line items. Filtering the Disk Usage Stats metrics can be applied here.
            $ref: '#/components/schemas/QueryOperator'
          start_date:
            type: string
            format: date-time
            description: specify the start date.
          end_date:
            type: string
            format: date-time
            description: specify the end date.
        type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
      type: object
