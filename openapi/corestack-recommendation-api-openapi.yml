components:
  schemas:
    RecommendationDetails:
      properties:
        name:
          type: string
          description: Name of the recommendation
        tenant_id:
          type: string
          description: Recommendation tenant ID
          x-cs-type: ObjectId
        service_account_id:
          type: string
          description: Recommendation service account ID
          x-cs-type: ObjectId
        policy_ids:
          type: array
          description: List of policy IDs for which the recommendation is generated
          items:
            type: string
        policy_classification:
          type: string
          description: Policy Classification
          example: Access
          enum:
          - Access
          - Cost
          - Data
          - Network
          - Operation
          - Performance
          - Resource
          - Security
          x-cs-enum-type: PolicyClassification
        policy_sub_classification:
          type: string
          description: Policy Sub Classification
          example: Access
          enum:
          - Access
          - Anomaly
          - Application
          - Application_Integration
          - Availability
          - Backup
          - Billing
          - Budget
          - Config
          - Data
          - Databases
          - Encryption
          - End Point Protection
          - Governance
          - High
          - Host
          - Identity
          - Idle
          - Logging
          - Monitoring
          - Naming Standards
          - Network
          - Operation
          - Optimized
          - Orphaned
          - Performance
          - SNS
          - Security
          - Standards
          - Storage
          - Tags
          - Underutilized
          - Utilization
          - medium
          x-cs-enum-type: PolicySubClassification
        recommendation_source:
          type: string
          description: Source of the recommendation
          example: AWS-compute-optimizer
          enum:
          - AWS-compute-optimizer
          - AWS-ec2-compute-optimizer
          - AWS-lambda-compute-optimizer
          - AWS_advisor
          - Corestack-Profiler
          - Custom
          - GCP_advisor
          - OCI_advisor
          - activity_log
          - azure_advisor
          - policy
          - security_threats
          x-cs-enum-type: RecommendationSource
        impact:
          type: string
          description: Impact of the recommendation
          example: critical
          enum:
          - critical
          - high
          - informational
          - low
          - medium
          - uncategorized
          x-cs-enum-type: PolicyResourceRecommendationImpact
        status:
          type: string
          description: Status of the recommendation
          example: error
          enum:
          - error
          - in_progress
          - open
          - resolved
          - skipped
          - system_skipped
          x-cs-enum-type: PolicyResourceRecommendationStatus
      type: object
    ListRecommendationRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/ListRecommendationFilters'
      type: object
    RecommendationExclusionRulesListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/RecommendationExclusionRulesSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/RecommendationExclusionRuleFilters'
      type: object
    RecommendationByCategory:
      required:
      - classification
      - cloud_account_id
      - cloud_account_name
      - created_at
      - id
      - impact
      - name
      - policy_id
      - policy_name
      - resource_counts
      - service_name
      - source
      - status
      - sub_classification
      - tenant_name
      properties:
        id:
          type: string
          description: Recommendation ID
        policy_id:
          type: string
          description: Policy ID
        policy_name:
          type: string
          description: Policy Name
