    BatchRequest:
      properties:
        ids:
          type: array
          description: Identifiers to fetch
          items:
            type: string
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    RecommendationListFilters:
      allOf:
      - $ref: '#/components/schemas/RecommendationsFilterBase'
      - required:
        - dashboard_type
        properties:
          dashboard_type:
            type: string
            description: Field represents whether the dashboard is for open or closed
            example: open
            enum:
            - open
            - closed
            - pre_identified
            x-cs-enum-type: RecommendationDashboardType
          search:
            type: string
            description: Search based on resource id, location, hierarchical metadata
        type: object
    RecommendationV2BatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/RealizedSavingDashboard'
      type: object
    RealizationSavingsListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/RealizationSavingDashboardSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/RecommendationListFilters'
      type: object
    RecommendationV2BatchRequest:
      properties:
        recommendation_ids:
          description: ids for the recommendation
          $ref: '#/components/schemas/BatchRequest'
        for_open_recommendation:
          type: boolean
          description: Bool determines whether the requested ids are retrieved from open or realized
          default: false
        workflow_sys_id:
          type: string
          description: workflow sys id for which the rules are required
        workflow_status:
          type: string
          description: over all status of the workflow.
          example: Approved
          enum:
          - Approved
          - Auto Approved
          - Pending Approval
          - Rejected
          x-cs-enum-type: WorkFlowImpactStatus
      type: object
    RealizedSavingDashboard:
      properties:
        resource_id:
          type: string
          description: Unique id for the resource.
        service_account_id:
          type: string
          description: Id for the service account to which the recommendation belongs to.
        resource_name:
          type: string
          description: Name for the Resource.
        resource_filter:
          type: string
          description: Name for the resource filter
        resource_location:
          type: string
          description: location for the resource
        resource_category:
          type: string
          description: Category for the Resource.
        resource_type:
          type: string
          description: Type for the Resource.
        resource:
          type: string
          description: Low level hierarchy for the resource.
        impact:
          type: string
          description: impact for the recommendation
        current_sku:
          type: string
          description: Current sku for the resource.
        recommended_sku:
          type: string
          description: Recommended sku for the resource.
        recommendation_type:
          type: string
          description: Recommendation type for the resource.
        savings_amount:
          type: number
          description: Savings amount for the resource.
        workflow_history:
          type: array
          items:
            $ref: '#/components/schemas/WorkFlowEventHistory'
        recommendation_sys_id:
          type: string
          description: Unique Id for the Recommendation.
        workflow_status:
          type: string
          description: over all status of the workflow.
          example: Approved
          enum:
          - Approved
          - Auto Approved
          - Pending Approval
          - Rejected
          x-cs-enum-type: WorkFlowImpactStatus
        workflow_id:
          type: string
          description: Sys Id of the workflow belongs to
        tenant_id:
          type: string
          description: Sys Id of the tenant where the resource belongs to
          x-cs-type: ObjectId
      type: object
