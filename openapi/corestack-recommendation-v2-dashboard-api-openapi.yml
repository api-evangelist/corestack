openapi: 3.2.0
info:
  title: CoreStack External Recommendation V2 Dashboard API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Manage Recommendations
servers:
- url: /
tags:
- name: Recommendation V2 Dashboard
  description: Manage Recommendations
paths:
  /v2/recommendation_dashboard/recommendations/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationV2BatchResponse'
      summary: Batch Recommendations
      description: Retrieve the Recommendation savings details for the resource
      operationId: BatchV2Recommendations
      security:
      - auth_token: []
      tags:
      - Recommendation V2 Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationV2BatchRequest'
        required: true
  /v2/recommendation_dashboard/recommendations/list:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      summary: List Recommendations
      description: Retrieve the ids of Recommendations which are matching the criteria
      operationId: ListV2Recommendations
      security:
      - auth_token: []
      tags:
      - Recommendation V2 Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealizationSavingsListRequest'
        required: true
  /v2/recommendation_dashboard/recommendations/manage:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '204':
          description: action triggered successfully
      summary: manage the recommendations for the workflow
      description: Request the action for the workflow
      operationId: ManageRecommendations
      security:
      - auth_token: []
      tags:
      - Recommendation V2 Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageRecommendationAction'
        required: true
  /v2/recommendation_dashboard/recommendations/statistics:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationStatisticsResponse'
      summary: Statistics for Recommendations
      description: Retrieve the Recommendation savings statistics for the filters applied
      operationId: RecommendationStatistics
      security:
      - auth_token: []
      tags:
      - Recommendation V2 Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationStatisticsRequest'
        required: true
components:
  schemas:
    RecommendationsFilterBase:
      required:
      - end_date
      - service_account_ids
      - start_date
      properties:
        service_account_ids:
          type: array
          description: Service Account Ids to Filter
          items:
            type: string
            x-cs-type: ObjectId
        query:
          description: Query expression to filter line items.
          $ref: '#/components/schemas/QueryOperator'
        start_date:
          type: string
          format: date-time
          description: specify the start date.
        end_date:
          type: string
          format: date-time
          description: specify the end date.
      type: object
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    RecommendationStatisticsResponse:
      properties:
        pre_identified_recommendations:
          type: integer
          description: Total number of pre-identified recommendations for the applied filter
        pre_identified_savings_amount:
          type: number
          description: Potential savings amount for the pre-identified recommendations for the applied filter
        potential_savings_amount:
          type: number
          description: Potential savings amount for the applied filter
        realized_savings_amount:
          type: number
          description: Realized savings amount for the applied filter
        total_recommendations:
          type: integer
          description: Total number of recommendations for the applied filter
        realized_recommendations:
          type: integer
          description: Total number of realized recommendations for the applied filter
        pending_for_approval:
          type: integer
          description: Number of pending approvals for the applied filter
        approved_recommendations:
          type: integer
          description: Number of approved recommendations for the applied filter
        rejected_recommendations:
          type: integer
          description: Number of rejected recommendations for the applied filter
        approved_potential_savings_amount:
          type: number
          description: Potential savings amount for Approved workflow status
        rejected_potential_savings_amount:
          type: number
          description: Potential savings amount for rejected workflow status
        pending_approval_potential_savings_amount:
          type: number
          description: Potential savings amount for Pending Approval workflow status
        pending_approval_realized_savings_amount:
          type: number
          description: Realized savings amount for Pending Approval workflow status
      type: object
    WorkFlowEventHistory:
      properties:
        event_name:
          type: string
          description: Step wise status of the workflow.
          example: Data Generated
          enum:
          - Data Generated
          - Waiting For Approval
          - Approval Process Completed
          - Approval Process Failed
          - Rejection Process Completed
          - Rejection Process Failed
          - WorkFlow Completed
          - Resource Realized
          x-cs-enum-type: WorkFlowLifeCycleStatus
        performed_at:
          type: string
          format: date-time
          description: The time at which the event has occur
        event_status:
          type: string
          description: The status of the event which has been performed while doing automation workflow.
        failure_reason:
          type: string
          description: Failure Reason if any available for the step.
      type: object
    RealizationSavingDashboardSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: savings_amount
          enum:
          - savings_amount
          x-cs-enum-type: RealizationSavingDashboardSortColumn
        ascending:
          type: boolean
      type: object
    RecommendationStatisticsRequest:
      allOf:
      - $ref: '#/components/schemas/RecommendationsFilterBase'
      - properties:
          workflow_sys_id:
            type: string
            description: workflow sys id for which the rules are required
        type: object
    ManageRecommendationAction:
      properties:
        action_type:
          type: string
          description: Type of the Actions to be passed in the request.
          example: Approve
          enum:
          - Approve
          - Reject
          - Pending Approval
          x-cs-enum-type: RequestsActionsType
        resource_id:
          type: string
          description: Unique Id for the resource.
        recommendation_sys_id:
          type: string
          description: Unique Id for the Recommendation.
        workflow_id:
          type: string
          description: Unique Id for the workflow.
        rejection_duration_days:
          type: integer
          description: Duration of the rejected period.
        rejection_reason:
          type: string
          description: Reason for the recommendation rejection.
        is_preidentified:
          type: boolean
          description: Boolean to determine whether the recommendation is pre-identified or not.
      type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
      type: object
      x-cs-subtypes:
      - subtype_model: QueryOperatorTrue
        subtype_name: QueryOperatorTrue
      - subtype_model: QueryOperatorFalse
