          - Azure_CSP-Direct
          - Azure_EA
          - Azure_MCA
          - Cloudstack
          - GCP
          - MS_VMM
          - OCI
          - Openstack
          - PrivateCloud
          - Rackspace
          - VMware
          - VMware_VCD
          - vCenter
          default: AWS
      security:
      - auth_token: []
      tags:
      - Resource
  /resource/inventory/{tenant_id}/count:
