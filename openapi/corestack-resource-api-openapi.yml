        name:
          type: string
          description: Name of the cloud account
        id:
          type: string
          description: ID of the cloud account
        preferred_regions:
          type: array
          description: Preferred region of AWS account
          items:
            type: string
      type: object
    ScopeFilterZone:
      properties:
        name:
          type: string
          description: Name for zone
