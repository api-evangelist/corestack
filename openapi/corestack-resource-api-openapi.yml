components:
  schemas:
    PostureResourceModel:
      required:
      - billable
      - count
      - non_billable
      - resource
      properties:
        resource:
          type: string
          description: resource name
        count:
          type: integer
          description: total count details
        billable:
          type: integer
          description: billable count details
        non_billable:
          type: integer
          description: non_billable count details
      type: object
    VirtualMachineAgentsBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/VirtualMachineAgentSummary'
      type: object
    ServiceResourceInventoryLookup:
      required:
      - corestack_resource_id
      - service_account_id
      properties:
        corestack_resource_id:
          type: string
          description: ID of the resource
          x-cs-type: ObjectId
        service_account_id:
          type: string
          description: ID of the service account
          x-cs-type: ObjectId
      type: object
    CreateRemediationResponse:
      properties:
        resource_enforce_tag_id:
          type: string
          description: Tag Remediation ID
      type: object
    InventoryData:
      required:
      - data
      - type
      properties:
        data:
          type: array
          description: Filters available in inventory
          items:
            type: object
        type:
          type: string
          description: Type of the data available in models list
      type: object
    InfraResourceTrendListBaseFilters:
      allOf:
      - $ref: '#/components/schemas/InfraResourceTrendSummaryBaseFilters'
      - properties:
          search:
            type: string
            description: Search based on resource category, resource type,resource name or resource ID.
        type: object
    GcpResourceSkuDetailsResponse:
      properties:
        sku_list:
          type: array
          description: SKU list
          items:
            type: string
      type: object
    ScopeResourceGroup:
      properties:
        name:
          type: string
          description: Name for resource
        id:
          type: string
          description: Id for resource
      type: object
    ResourceListingResponse:
      properties:
        id:
          type: string
          description: Id of the resources
        name:
          type: string
          description: Name of the resource
      type: object
    BulkTagRemediationRequest:
      required:
      - remediation_inputs
      - service_account_id
      properties:
        service_account_id:
          type: string
          description: Service Account Id
          x-cs-type: ObjectId
        remediation_inputs:
          type: array
          items:
            $ref: '#/components/schemas/TagsRemediation'
      type: object
    VirtualMachineAgentsSummarySortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: resource_name
          enum:
          - resource_name
          x-cs-enum-type: VirtualMachineAgentsSummarySortColumn
        ascending:
          type: boolean
      type: object
    CountDetailsDataModel:
      required:
      - cloud_account
      - service
      properties:
        cloud_account:
          type: array
          description: Id's for the cloud account
          items:
            $ref: '#/components/schemas/CloudAccountDetail'
        service:
          type: string
          description: Cloud service name
          example: AWS
          enum:
          - AWS
          - Azure
          - AzureStack
          - Azure_CSP
          - Azure_CSP-Direct
          - Azure_EA
          - Azure_MCA
          - Cloudstack
          - GCP
          - MS_VMM
          - OCI
          - Openstack
          - PrivateCloud
          - Rackspace
          - VMware
          - VMware_VCD
          - vCenter
          x-cs-enum-type: CloudServiceName
        default_value:
          type: boolean
          description: "Default value [by default: false]\nIf default = true, displays count only for that particular default_resource/default_category \nIf default = false, displays count for all the category/resource except that mentioned in default_resource/default_category."
          default: false
        category:
          type: string
          description: "Category value [by default: Compute]\n Give this value if the value of identifier is resource.\nDisplays all the resources for the particular category provided."
        default_resource:
          type: string
          description: 'Default resource [by default: based upon Category]

            Give this value if the value of identifier is resource.

            Displays count for resource.'
        default_category:
          type: string
          description: "Default category [by default: Compute]\n Give this value if the value of identifier is category.\nDisplays count for category."
      type: object
    DeleteLockConfigRuleRequest:
      properties:
        config_rule_id:
          type: string
          description: Config rule id, it can be fetched from List Resource Lock Config Rules API
      type: object
    FilterData:
      required:
      - regions
      - resource_groups
      properties:
        regions:
          type: array
          description: Displays the list of regions
          items:
            $ref: '#/components/schemas/ResourceFilterModel'
        resource_groups:
          type: array
          description: Displays the list of resource groups
          items:
            $ref: '#/components/schemas/ResourceFilterModel'
      type: object
    InfraResourceActivityRequest:
      required:
      - resource
      - resource_category
      - resource_id
      - resource_type
      - tenant_id
      properties:
        tenant_id:
          type: string
          description: Tenant ID. Can be fetched from the List Tenants API.
          x-cs-type: ObjectId
        resource_id:
          type: string
          description: Unique provider resource identifier.
        resource_category:
          type: string
          description: Category of the resource (e.g. Compute, Storage, Network).
        resource_type:
          type: string
          description: Type of the resource.
        resource:
          type: string
          description: Resources of the cloud provider (e.g. Instances, SecurityGroups).
        start_date:
          type: string
          format: date-time
          description: Start of retention window. Defaults to now minus 90 days.
        end_date:
          type: string
          format: date-time
          description: End of retention window. Defaults to today.
        change_type_filter:
          type: array
          items:
            type: string
            description: Filter timeline by InfraResourceChangeStatus values (e.g. new, modified, deleted).
            example: added
            enum:
            - added
            - unchanged
            - modified
            - deleted
            x-cs-enum-type: InfraResourceChangeStatus
        event_ids:
          type: array
          description: If provided (1-2 IDs), returns attribute details for these events (Mode 2). If absent, returns paginated timeline (Mode 1).
          items:
            type: string
        list_context:
          description: Pagination context. Used in Mode 1 only. Default batch_size=25.
          $ref: '#/components/schemas/ListContext'
      type: object
    PostureResourceListModel:
      required:
      - category
      - cloud_account_name
      - component
      - region_resourceGroup
      - resource
      - resource_id
      properties:
        cloud_account_name:
          type: string
          description: region name
        category:
          type: string
          description: category name
        component:
          type: string
          description: component name
        resource:
          type: string
          description: resource name
        resource_id:
          type: string
          description: resource id name
        region_resourceGroup:
          type: string
          description: region/ resource group name
      type: object
    InfraResourceDetailRequest:
      required:
      - resource
      - resource_category
      - resource_id
      - resource_type
      - tenant_id
      properties:
        tenant_id:
          type: string
