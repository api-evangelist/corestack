    InventoryResponse:
      required:
      - filters
      properties:
        filters:
          type: array
          description: Filters available in inventory
          items:
            $ref: '#/components/schemas/InventoryData'
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    ServiceResourceInventoryDetails:
      required:
      - corestack_resource_id
      - service_account_id
      properties:
        corestack_resource_id:
          type: string
          description: ID of the resource
          x-cs-type: ObjectId
        service_account_id:
          type: string
          description: ID of the service account
          x-cs-type: ObjectId
        check_resource_element:
          type: string
          description: Unique id of the resource
        component:
          type: string
          description: Component of the resource
        location:
          type: string
          description: Location of the resource
        resource_group:
          type: string
          description: Resource group name specific to Azure resource
        summary_details_name:
          type: string
          description: Resource name specific to Azure
      type: object
    InventoryResourceDetailsResponse:
      required:
      - count
      - resource_details
      properties:
        count:
          type: string
          description: Inventory summary details
        resource_details:
          type: array
          description: Inventory summary details
          items:
            $ref: '#/components/schemas/InventoryResourceDetailsModelList'
      type: object
    InfraResourceTrendSummaryListRequest:
      allOf:
      - $ref: '#/components/schemas/InfraResourceTrendRequestBase'
      - properties:
          filters:
            description: Filters applied to the trend data.
            $ref: '#/components/schemas/InfraResourceTrendListBaseFilters'
          list_context:
            description: Optional list context
            $ref: '#/components/schemas/ListContext'
        type: object
    InventoryFilterRequest:
      required:
      - cloud_account
      properties:
        cloud_account:
          type: array
          description: Cloud accounts
          items:
            $ref: '#/components/schemas/InventoryFilterRequestDataModel'
      type: object
    BulkTagRemediationResponse:
      properties:
        resource_enforce_tag_ids:
          type: array
          description: Tag Remediation Ids
          items:
            type: string
      type: object
    InventoryFilterRequestDataModel:
      required:
      - id
      - name
      - preferred_regions
