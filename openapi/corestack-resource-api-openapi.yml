          description: Filters for the request
          $ref: '#/components/schemas/ServiceResourceFilter'
      type: object
    InfraResourceActivityEvent:
      properties:
        history_id:
          type: string
          description: Unique change event identifier.
        changed_at:
          type: string
          format: date-time
          description: Timestamp when the change was detected.
        change_type:
          type: string
          description: 'Type of change: new, modified, discovered'
        changed_attributes:
          type: object
          description: Post-change attribute values. Present only in Mode 2 (when event_ids are provided). Removed attributes appear as null.
      type: object
    PostureCloudDataModel:
      required:
      - cloud_account_id
      - cloud_account_name
      properties:
        cloud_account_name:
          type: string
          description: cloud account name
        cloud_account_id:
          type: string
          description: cloud account id
        tenant_name:
          type: string
          description: Name of the tenant
        resource_wo_tag:
          type: integer
          description: resource without tag count
        total_resources:
          type: integer
          description: total resources
        resource_wo_naming_std:
          type: string
          description: resource without naming std
        billable_resources:
          type: integer
          description: billable resources
        new_resources:
          type: integer
          description: new resources
        increase_percentage:
          type: number
          description: increase percentage
        resource_wo_lock:
          type: integer
          description: resources without lock
        cloud:
          type: string
          description: cloud name
        deleted_resources:
          type: integer
          description: deleted resources
        last_discovery:
          type: string
          description: DateTime when the user was created
      type: object
    InfraResourceTrendResource:
      properties:
        cloud_account_id:
          type: string
          description: ID of the cloud account
          x-cs-type: ObjectId
        inventory_id:
          type: string
          description: Internal inventory identifier for the resource.
          x-cs-type: ObjectId
        cloud_provider:
          type: string
          description: Cloud Provider to select
          example: AWS
          enum:
          - AWS
          - Azure
          - AzureStack
          - Azure_CSP
          - Azure_CSP-Direct
          - Azure_EA
          - Azure_MCA
          - Cloudstack
          - GCP
          - MS_VMM
          - OCI
          - Openstack
          - PrivateCloud
          - Rackspace
          - VMware
          - VMware_VCD
          - vCenter
          x-cs-enum-type: CloudServiceName
        region:
          type: string
          description: Region of the resource
        resource_category:
          type: string
          description: Category of the resource
        resource_type:
          type: string
          description: Type of the resource
        resource:
          type: string
          description: 'Specific resource name or instance identifier '
        resource_id:
          type: string
          description: Unique ID of the resource
        resource_name:
          type: string
          description: Name of the resource
        belongs_to_canonical_resource:
          type: string
          description: Canonical resource IRI linked from the workload resource via belongsToCanonicalResource.
        tags:
          type: array
          description: Resource tags as key/value pairs.
          items:
            $ref: '#/components/schemas/InfraResourceTrendResourceTag'
        added_at:
          type: string
          format: date-time
          description: Timestamp when the resource was added
        changed_at:
          type: string
          format: date-time
          description: Timestamp when the resource change was detected
        deleted_at:
