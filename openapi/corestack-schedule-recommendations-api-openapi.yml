            - Azure_CSP-Direct
            - Azure_EA
            - Azure_MCA
            - Cloudstack
            - GCP
            - MS_VMM
            - OCI
            - Openstack
            - PrivateCloud
            - Rackspace
            - VMware
            - VMware_VCD
            - vCenter
            x-cs-enum-type: CloudServiceName
        page_number:
          type: integer
          description: Page Number
        page_size:
          type: integer
          description: Number of records per page
        filters:
          description: List Schedule Filters
          $ref: '#/components/schemas/ScheduleRecommendationScheduleRequestFilter'
        search:
          type: string
