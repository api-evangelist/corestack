openapi: 3.2.0
info:
  title: CoreStack External Schedules API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Schedules
servers:
- url: /
tags:
- name: Schedules
  description: Schedules
paths:
  /v1/schedules/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleDetails'
      summary: Fetch a batch of schedules
      description: Fetch a batch of schedules
      operationId: SchedulesBatch
      security:
      - auth_token: []
      tags:
      - Schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordIdentityBatchRequest'
        required: true
  /v1/schedules/create:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleDetails'
      summary: Creates a Schedule
      description: Creates a Schedule
      operationId: CreateSchedule
      security:
      - auth_token: []
      tags:
      - Schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleDetails'
        required: true
  /v1/schedules/item/{schedule_id}:
    delete:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: boolean
      summary: Delete Schedule
      description: Delete given schedule
      operationId: ScheduleDelete
      parameters:
      - name: schedule_id
        in: path
        required: true
        description: Specify the schedule Id to remove the schedule data
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Schedules
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleDetails'
      summary: Retrieve Schedule
      description: Retrieve details of given schedule
      operationId: ScheduleGet
      parameters:
      - name: schedule_id
        in: path
        required: true
        description: Specify the schedule Id to retrieve the schedule data
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Schedules
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleDetails'
      summary: Updates a Schedule
      description: Update schedule
      operationId: ScheduleUpdate
      parameters:
      - name: schedule_id
        in: path
        required: true
        description: Specify the schedule Id to update the schedule data
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleDetails'
        required: true
  /v1/schedules/item/{schedule_id}/set_next_execution:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Set Next Execution of a Schedule
      description: Set Next Execution of a Schedule
      operationId: SetNextExecutionSchedule
      parameters:
      - name: schedule_id
        in: path
        required: true
        description: Specify the schedule Id to remove the schedule data
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSetNextExecutionRequest'
        required: true
  /v1/schedules/item/{schedule_id}/skip_next_execution:
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Skipped
          content:
            application/json:
              schema:
                type: boolean
      summary: Skip next execution of a Schedule
      description: Skip next execution of a Schedule
      operationId: SkipNextExecutionSchedule
      parameters:
      - name: schedule_id
        in: path
        required: true
        description: Specify the schedule Id to remove the schedule data
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Schedules
  /v1/schedules/list:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
