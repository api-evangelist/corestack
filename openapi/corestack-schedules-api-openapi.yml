    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    ScheduleExecutionNotificationConfiguration:
      properties:
        email_recipients:
          type: array
          description: List of Email IDs
          items:
            type: string
        webhooks:
          type: array
          description: Webhooks to trigger notifications
          items:
            $ref: '#/components/schemas/ScheduleExecutionNotificationWebHookForStandardType'
      type: object
    SchedulingDayDetails:
      required:
      - day
      properties:
        day:
          type: string
          description: 'At which day of that month or week the given category is scheduled to run.Allowed values: 1-31, for month and 0-7 or SUN-SAT for week. Both 0 and 7 represent Sunday.'
      type: object
    ScheduleListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
            x-cs-type: ObjectId
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    SchedulingDetails:
      required:
      - month
      - time
      properties:
        month:
          type: string
          description: 'Month when the given category is scheduled to run. Allowed values: 1-12 or JAN-DEC'
        time:
          description: Time when the given category is scheduled to run.
          $ref: '#/components/schemas/SchedulingTimeDetails'
        dayofmonth:
          description: 'At which day of that month the given category is scheduled to run. Note: If both weekday and dayofmonth are specified, dayofmonth takes precedence.'
          $ref: '#/components/schemas/SchedulingDayDetails'
        weekday:
          description: 'At which day of that week the given category is scheduled to run. Note: If both weekday and dayofmonth are specified, dayofmonth takes precedence.'
          $ref: '#/components/schemas/SchedulingDayDetails'
        year:
          type: string
          description: Year when the given category is scheduled to run. Example:'2024-2099'
      type: object
    RecordIdentityBatchRequest:
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/RecordIdentity'
      type: object
    SchedulingTimeDetails:
      required:
      - hour
      - minute
      - seconds
      properties:
        seconds:
          type: string
          description: 'Scheduled at which second, allowed values: 0-59'
        minute:
          type: string
          description: 'Scheduled at which minute, allowed values: 0-59'
        hour:
          type: string
          description: 'Scheduled at which hour, allowed values: 0-23'
      type: object
    ScheduleSetNextExecutionRequest:
      required:
      - next_run
      properties:
        next_run:
          type: string
          format: date-time
          description: When the next run of schedule to be triggered
      type: object
    RecordIdentity:
      properties:
        sysId:
          type: string
          description: Unique Identifier of the tracked item
        lastUpdate:
          type: string
          format: date-time
          description: Last update of the tracked item
        table:
          type: string
          description: Context of the tracked item
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
