components:
  schemas:
    ThreatVulnerabilityBaseResponse:
      properties:
        service_account_id:
          type: string
          description: ID of the service account to which the threat/vulnerability belongs to.
          x-cs-type: ObjectId
        cloud_provider:
          type: string
          description: Cloud Provider of the service account
          example: AWS
          enum:
          - AWS
          - Azure
          - AzureStack
          - Azure_CSP
          - Azure_CSP-Direct
          - Azure_EA
          - Azure_MCA
          - Cloudstack
          - GCP
          - MS_VMM
          - OCI
          - Openstack
          - PrivateCloud
          - Rackspace
          - VMware
          - VMware_VCD
          - vCenter
          x-cs-enum-type: CloudServiceName
        tenant_id:
          type: string
          description: Tenant ID where the service account belongs to
          x-cs-type: ObjectId
        resource_id:
          type: string
          description: ID of the resource where the threat/vulnerability is observed
        resource_name:
          type: string
          description: Name of the resource where the threat/vulnerability is observed
        resource_category:
          type: string
          description: Category of the resource to which the threat/vulnerability belongs to.
        resource_type:
          type: string
          description: Type of the resource to which the threat/vulnerability belongs to.
        resource:
          type: string
          description: Resource to which the threat/vulnerability belongs to.
        region:
          type: string
          description: Region the impacted resource is located in.
        location:
          type: string
          description: Location the impacted resource is located in.
        resource_group:
          type: string
          description: Resource Group of the resource to which the threat/vulnerability belongs to.
        severity:
          type: string
          description: Severity of the threat/vulnerability
          example: Critical
          enum:
          - Critical
          - High
          - Info
          - Low
          - Medium
          - None
          - Unknown
          x-cs-enum-type: Severity
        status:
          type: string
          description: Status of the threats/vulnerabilities
          example: active
          enum:
          - active
          - closed
          - inactive
          - resolved
          - skipped
          - suppressed
          x-cs-enum-type: ThreatVulnerabilityStatus
        source:
          type: string
          description: Source of the threat/vulnerability
        issue_type:
          type: string
          description: Issue Type of the threat/vulnerability
        provider_issue_id:
          type: string
          description: Unique id for threat/vulnerability as provided by the cloud provider
        title:
          type: string
          description: Title of the threat/vulnerability
        created_at:
          type: string
          format: date-time
          description: Date and time when the threat/vulnerability was created in corestack
        updated_at:
          type: string
          format: date-time
          description: Date and time when the threat/vulnerability was updated in corestack
        description:
          type: string
          description: Description of the threat/vulnerability
        detected_at:
          type: string
          format: date-time
          description: Date and time when the threat/vulnerability was detected
        recommendation:
          type: string
          description: Recommendation for the threat/vulnerability
        remediation:
          type: string
          description: Recommended remediation for the threat/vulnerability
        source_data:
          type: object
          description: Source data of the threat/vulnerability captured from the cloud.
      type: object
    SecurityInfraIssuesDashboardFilters:
      required:
      - tenant_id
      properties:
        tenant_id:
          type: string
          description: Tenant ID to filter the issues. This can be fetched from the List Tenants API call.
          x-cs-type: ObjectId
        query:
          description: Query based on Cloud Providers, Cloud Account Ids, Severities, ResourceCategories, ResourceTypes, Resources
          $ref: '#/components/schemas/QueryOperator'
      type: object
    InfraVulnerabilitiesTrendListFiltersSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: resource
          enum:
          - resource
          - severity
          - service_name
          - resource_id
          - status
          - resource_name
          - findings_id
          x-cs-enum-type: InfraVulnerabilitiesTrendListFiltersSortColumn
        ascending:
          type: boolean
      type: object
    InfraMisConfigurationsTrendListFiltersSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: resource
          enum:
          - resource
          - severity
          - service_name
          - resource_id
          - resource_name
          x-cs-enum-type: InfraMisConfigurationsTrendListFiltersSortColumn
        ascending:
          type: boolean
      type: object
    SecurityVulnerabilitySummaryMonthResponse:
      properties:
        summary_by_month:
          type: array
          description: Visibility of the vulnerabilities by Month
          items:
