      - $ref: '#/components/schemas/ProgressDetails'
      - properties:
          processing_memory:
            description: Processing history
            $ref: '#/components/schemas/BaseCostProcessingMemory'
        type: object
    LocationDetailsBase:
      required:
      - type
      properties:
        location_id:
          type: string
          description: Unique Id
        name:
          type: string
          description: Display Name
        description:
          type: string
          description: Description
      discriminator:
        propertyName: type
      type: object
      x-cs-subtypes:
      - subtype_model: LocationDetailsForAws
        subtype_name: LocationDetailsForAws
      - subtype_model: LocationDetailsForAzure
        subtype_name: LocationDetailsForAzure
      - subtype_model: LocationDetailsForGcp
        subtype_name: LocationDetailsForGcp
      - subtype_model: LocationDetailsForOci
        subtype_name: LocationDetailsForOci
      - subtype_model: LocationDetailsForOpenstack
        subtype_name: LocationDetailsForOpenstack
    DimensionPrecomputeVersionState:
      properties:
        version_id:
          type: string
          description: sys_id of the dimension head version
        precompute:
          type: boolean
          description: Whether precompute is enabled in the head version
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
