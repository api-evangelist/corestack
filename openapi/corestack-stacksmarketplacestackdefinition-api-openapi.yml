components:
  schemas:
    StacksMarketplaceAdditionalCostComponent:
      properties:
        component_type:
          type: string
          description: Custom cost component.
        cost:
          description: Cost of the additional cost component
          $ref: '#/components/schemas/CostWithCurrency'
      type: object
    StacksMarketplaceComponentBase:
      allOf:
      - $ref: '#/components/schemas/StacksMarketplaceBase'
      - properties:
          tenant_id:
            type: string
            description: Tenant ID
            x-cs-type: ObjectId
        type: object
    StacksMarketplaceStackConfiguration:
      properties:
        product_id:
          type: string
          description: Product ID
        plan_skus:
          type: array
          description: Plan SKUs
          items:
            type: string
        deployment_details:
          description: Deployment details
          $ref: '#/components/schemas/StacksMarketplaceStackDeploymentConfiguration'
        input_parameters:
          type: array
          description: Input parameters
          items:
            $ref: '#/components/schemas/StacksMarketplaceStackInputParameter'
        output_parameters:
          type: array
          description: Output parameters
          items:
            $ref: '#/components/schemas/StacksMarketplaceStackParameter'
        notification_templates_success:
          description: Notification message
          $ref: '#/components/schemas/StacksMarketplaceStackNotificationTemplate'
        notification_templates_failure:
          description: Notification message
          $ref: '#/components/schemas/StacksMarketplaceStackNotificationTemplate'
        guess_for_cost_range:
          description: Customer guessed cost range value of the stack
          $ref: '#/components/schemas/CustomerGuessForCostRange'
      type: object
    StacksMarketplaceBase:
      properties:
        sysId:
          type: string
          description: ID of the Stack Marketplace component
        createdOn:
          type: string
          format: date-time
          description: Created datetime for the component
        updatedOn:
          type: string
          format: date-time
          description: Updated datetime for the component
        created_by:
          type: string
          description: Created by user ID
        updated_by:
          type: string
          description: Updated by user ID
      type: object
    StacksMarketplaceStackDefinitionListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/StacksMarketplaceStackDefinitionListSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/StacksMarketplaceStackFilter'
      type: object
    StacksMarketplaceStackDefinitionVersionBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/StacksMarketplaceStackDefinitionVersion'
      type: object
    CostWithCurrency:
      properties:
        cost:
          type: number
          description: cost value
        currency:
          type: string
          description: currency of the cost. Example 'currency':'USD'
          example: AED
          enum:
          - AED
          - ALL
          - ARS
          - AUD
          - BAM
          - BDT
          - BGN
          - BHD
          - BRL
          - CAD
          - CHF
          - CLP
          - CNY
          - COP
          - CRC
          - CZK
          - DKK
          - EGP
          - EUR
          - GBP
          - HKD
          - HRK
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KES
          - KRW
          - KWD
          - KZT
          - MOP
          - MVR
          - MXN
          - MYR
          - NOK
          - NZD
          - OMR
          - PEN
          - PHP
          - PKR
          - PLN
          - QAR
          - RON
          - RSD
          - RUB
          - SAR
          - SEK
          - SGD
          - THB
          - TRY
          - TWD
          - USD
          - VND
          - ZAR
          x-cs-enum-type: Currency
      type: object
    StacksMarketplaceStackDefinitionBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/StacksMarketplaceStackDefinition'
      type: object
    StacksMarketplaceStackDefinitionListSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: Name
          enum:
          - Name
          - CreatedOn
          - UpdatedOn
          - Owner
          - Version
          x-cs-enum-type: StacksMarketplaceStackDefinitionListSortColumn
        ascending:
          type: boolean
      type: object
    StacksMarketplaceStackInputParameter:
      allOf:
      - $ref: '#/components/schemas/StacksMarketplaceStackParameter'
      - properties:
          default_value:
            type: string
            description: Default value for the parameter, encoded as a JSON string
        type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    StacksMarketplaceStackFilter:
      properties:
        tenant_id:
          type: string
          description: Tenant ID
          x-cs-type: ObjectId
        query:
          description: Query operator
          $ref: '#/components/schemas/QueryOperator'
      type: object
    RecordIdentityBatchRequest:
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/RecordIdentity'
      type: object
    RecordIdentity:
      properties:
        sysId:
          type: string
          description: Unique Identifier of the tracked item
        lastUpdate:
          type: string
          format: date-time
          description: Last update of the tracked item
        table:
          type: string
          description: Context of the tracked item
      type: object
    StacksMarketplaceStackDeploymentConfiguration:
      properties:
        deployment_type:
          type: string
          description: Deployment type of the resource
          example: Template
          enum:
          - Template
          - Blueprint
          x-cs-enum-type: StacksMarketplaceStackDeploymentType
        deployment_model_id:
          type: string
          description: Deployment model ID
      type: object
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    StacksMarketplaceStackParameter:
      properties:
        template_parameter:
          type: string
          description: Template parameter name
        display_name:
          type: string
          description: Stack parameter display name
        description:
          type: string
          description: Stack parameter description
        hide_parameter:
          type: boolean
          description: Whether to hide parameter from deployment UI
      type: object
    QueryOperator:
      required:
      - __type
      properties: {}
      discriminator:
        propertyName: __type
      type: object
