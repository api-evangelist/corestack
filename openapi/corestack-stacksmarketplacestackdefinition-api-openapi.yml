        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StacksMarketplaceStackDefinition'
      summary: Get Stacks Marketplace Stack Definition
      description: Get Stacks Marketplace Stack Definition.
      operationId: GetStackDefinition
      parameters:
      - name: stack_definition_id
        in: path
        required: true
        description: ID of Stack Definition.
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - StacksMarketplaceStackDefinition
  /v1/stacks-marketplace/stack-definitions/item/{stack_definition_id}/history:
