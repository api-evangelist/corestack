    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Manage Stacks Marketplace Stack Definitions
servers:
- url: /
tags:
- name: StacksMarketplaceStackDefinition
  description: Manage Stacks Marketplace Stack Definitions
paths:
  /v1/stacks-marketplace/stack-definitions/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StacksMarketplaceStackDefinitionBatchResponse'
      summary: Batch Stacks Marketplace Stack Definitions
      description: Batch Stacks Marketplace Stack Definitions.
      operationId: BatchStackDefinition
      security:
      - auth_token: []
      tags:
      - StacksMarketplaceStackDefinition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordIdentityBatchRequest'
        required: true
  /v1/stacks-marketplace/stack-definitions/create:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StacksMarketplaceStackDefinition'
      summary: Create Stacks Marketplace Stack Definition
      description: Create a new Stacks Marketplace Stack Definition.
      operationId: CreateStackDefinition
      security:
      - auth_token: []
      tags:
      - StacksMarketplaceStackDefinition
  /v1/stacks-marketplace/stack-definitions/item/{stack_definition_id}:
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
