    StackMarketplaceDefinitionBase:
      allOf:
      - $ref: '#/components/schemas/StacksMarketplaceComponentBase'
      - properties:
          name:
            type: string
            description: Name of the component definition
          description:
            type: string
            description: Description of the component definition
        type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    CustomerGuessForCostRange:
      properties:
        maximum:
          description: Maximum cost of the stack version
          $ref: '#/components/schemas/CostWithCurrency'
        minimum:
          description: Minimum cost of the stack version
          $ref: '#/components/schemas/CostWithCurrency'
        extra_costs:
          type: array
          description: Additional costs of a stack version
          items:
            $ref: '#/components/schemas/StacksMarketplaceAdditionalCostComponent'
      type: object
    StacksMarketplaceStackDefinitionVersion:
      allOf:
      - $ref: '#/components/schemas/StacksMarketplaceBase'
      - properties:
          version:
            type: integer
            description: Version number
          definition:
            $ref: '#/components/schemas/RecordIdentity'
          details:
            $ref: '#/components/schemas/StacksMarketplaceStackConfiguration'
          predecessor:
            $ref: '#/components/schemas/RecordIdentity'
          list_version:
            type: string
            description: List version
          change_summary:
            type: string
            description: Change summary
        type: object
    StacksMarketplaceStackDefinition:
      allOf:
      - $ref: '#/components/schemas/StackMarketplaceDefinitionBase'
      - properties:
          owner:
            type: string
            description: Owner of the Stack
          master_account_id:
            type: string
            description: Master account ID
            x-cs-type: ObjectId
          is_archived:
            type: boolean
            description: Whether the Stack is archived
          headVersion:
            $ref: '#/components/schemas/RecordIdentity'
          releaseVersion:
            $ref: '#/components/schemas/RecordIdentity'
          allow_auto_approval:
            type: boolean
            description: Whether to allow auto approval of the stack
        type: object
    StacksMarketplaceStackNotificationTemplate:
      properties:
        message:
          type: string
          description: Notification message
        email_ids:
          type: array
          description: Email IDs
          items:
            type: string
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
