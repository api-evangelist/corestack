components:
  schemas:
    StacksMarketplaceComponentBase:
      allOf:
      - $ref: '#/components/schemas/StacksMarketplaceBase'
      - properties:
          tenant_id:
            type: string
            description: Tenant ID
            x-cs-type: ObjectId
        type: object
    StacksMarketplaceBase:
      properties:
        sysId:
          type: string
          description: ID of the Stack Marketplace component
        createdOn:
          type: string
          format: date-time
          description: Created datetime for the component
        updatedOn:
          type: string
          format: date-time
          description: Updated datetime for the component
        created_by:
          type: string
          description: Created by user ID
        updated_by:
          type: string
          description: Updated by user ID
      type: object
    StacksMarketplaceStackDeploymentListSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: Name
          enum:
          - Name
          - CreatedOn
          - UpdatedOn
          - Status
          - StartTime
          - EndTime
          x-cs-enum-type: StacksMarketplaceStackDeploymentListSortColumn
        ascending:
          type: boolean
      type: object
    CostWithCurrency:
      properties:
        cost:
          type: number
          description: cost value
        currency:
          type: string
          description: currency of the cost. Example 'currency':'USD'
          example: AED
          enum:
          - AED
          - ALL
          - ARS
          - AUD
          - BAM
          - BDT
          - BGN
          - BHD
          - BRL
          - CAD
          - CHF
          - CLP
          - CNY
          - COP
          - CRC
          - CZK
          - DKK
          - EGP
          - EUR
          - GBP
          - HKD
          - HRK
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KES
          - KRW
          - KWD
          - KZT
          - MOP
          - MVR
          - MXN
          - MYR
          - NOK
          - NZD
          - OMR
          - PEN
          - PHP
          - PKR
          - PLN
          - QAR
          - RON
          - RSD
          - RUB
          - SAR
          - SEK
          - SGD
          - THB
          - TRY
          - TWD
          - USD
          - VND
          - ZAR
          x-cs-enum-type: Currency
      type: object
    StacksMarketplaceStackDeploymentFilter:
      properties:
        tenant_id:
          type: string
          description: Tenant ID
          x-cs-type: ObjectId
        query:
          description: Query operator
          $ref: '#/components/schemas/QueryOperator'
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    RecordIdentityBatchRequest:
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/RecordIdentity'
      type: object
    StackMarketPlaceAccountDetailsForStackDeployment:
      properties:
        service_account_id:
          type: string
          description: Service account ID
          x-cs-type: ObjectId
        location:
          description: Optional location context for the stack deployment
          $ref: '#/components/schemas/LocationDetailsBase'
        resource_group:
          description: Optional resource group context for the stack deployment
          $ref: '#/components/schemas/ResourceGroupDetailsBase'
        compartment:
          description: Optional compartment context for the stack deployment
          $ref: '#/components/schemas/CompartmentDetailsBase'
      type: object
    KeyValuePair:
      properties:
        key:
          type: string
          description: Key of the pair
        value:
          type: string
          description: Value of the pair
      type: object
    RecordIdentity:
      properties:
        sysId:
          type: string
          description: Unique Identifier of the tracked item
        lastUpdate:
          type: string
          format: date-time
          description: Last update of the tracked item
        table:
          type: string
          description: Context of the tracked item
      type: object
    StacksMarketplaceStackDeploymentHistoryBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/StacksMarketplaceStackDeploymentHistory'
      type: object
    ResourceGroupDetailsBase:
      required:
      - type
      properties:
        resource_group_id:
          type: string
          description: Unique Id
        name:
          type: string
          description: Display Name
        description:
          type: string
          description: Description
      discriminator:
        propertyName: type
      type: object
      x-cs-subtypes:
      - subtype_model: ResourceGroupDetailsForAws
        subtype_name: ResourceGroupDetailsForAws
      - subtype_model: ResourceGroupDetailsForAzure
        subtype_name: ResourceGroupDetailsForAzure
    StacksMarketplaceDeploymentDefinition:
      allOf:
      - $ref: '#/components/schemas/StackMarketplaceDefinitionBase'
      - properties:
          stack_id:
            type: string
            description: Stack ID
          order_id:
            type: string
            description: Order ID
          details:
            type: array
            description: Deployment details
            items:
              $ref: '#/components/schemas/StackMarketPlaceAccountDetailsForStackDeployment'
          additional_settings:
            description: Additional settings
            $ref: '#/components/schemas/StackMarketPlaceDeploymentAdditionalSettings'
          tags:
            type: array
            description: List of tag key/value pairs
            items:
              $ref: '#/components/schemas/KeyValuePair'
        type: object
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    StackMarketPlaceDeploymentAdditionalSettings:
      properties:
        notification_templates_success:
          description: Notification message
          $ref: '#/components/schemas/StacksMarketplaceStackNotificationTemplate'
        notification_templates_failure:
          description: Notification message
          $ref: '#/components/schemas/StacksMarketplaceStackNotificationTemplate'
      type: object
