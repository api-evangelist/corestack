    TemplateParameterValidationRequest:
      required:
      - input_parameters
      properties:
        input_parameters:
          type: string
          description: Template execution parameters, encoded as a JSON string
      type: object
    TemplateScanCheckResult:
      properties:
        check_id:
          type: string
          description: Identifier of the check, prefixed with the engine, for example terraform#CKV_AWS_20
        check_name:
          type: string
          description: Human-readable name of the check
        status:
          type: string
          description: 'Outcome for this check: ''passed'', ''failed'', ''skipped'', or ''parsing_error'''
          example: passed
          enum:
          - passed
          - failed
          - skipped
          - parsing_error
          x-cs-enum-type: TemplateScanCheckStatus
        code_block:
          type: string
          description: The template code fragment the check evaluated
        nature:
          type: string
          description: Whether the check is 'static' (content analysis) or 'dynamic' (account-aware)
          example: static
          enum:
          - static
          - dynamic
          x-cs-enum-type: TemplateScanCheckNature
        scope:
          type: string
          description: 'Scope the check applies to: ''global'' or ''account'''
          example: global
          enum:
          - global
          - account
          x-cs-enum-type: TemplateScanCheckScope
      type: object
    ValidationResults:
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
      type: object
    TemplateGitContent:
      required:
      - content_url
      properties:
        content_url:
          type: string
          description: Git/URL location of the template content
        content_username:
          type: string
          description: Username if the source is authenticated
        content_password_or_key:
          type: string
          description: Password or private key if the source is authenticated
          x-cs-type: SensitiveString
        content_branch:
          type: string
          description: Git branch name. Git-only; empty for a plain URL fetch
        absolute_path:
          type: string
          description: Sub-path within the git repo. Git-only
        repo_type:
          type: string
          description: '''public'' or ''private'' (uses the credential fields above)'
          example: public
          enum:
          - public
          - private
          x-cs-enum-type: TemplateRepoType
      type: object
    TemplateClassificationWithSubClassifications:
      properties:
        deployment:
          type: array
          description: Sub-classifications selected under Deployment
          items:
            type: string
            description: Sub-classification valid under the 'Deployment' classification
            example: Agents
            enum:
            - Agents
