        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTenantResponse'
      summary: List Tenant
      description: 'Deprecated: Use /v2/tenants instead. There can be multiple tenants within a CoreStack account. List all tenants the user is mapped under a CoreStack account. If there are 3 tenants and user performing this operation has access to only 2 tenants then only those 2 tenants will be returned.'
      operationId: listTenant@@@2
      security:
      - auth_token: []
      deprecated: true
      tags:
      - Tenants
    post:
      responses:
        '500':
          description: Internal Server Error
