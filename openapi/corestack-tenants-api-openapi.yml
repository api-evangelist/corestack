components:
  schemas:
    TenantDetails:
      required:
      - account_id
      - created_at
      - description
      - is_default
      - name
      - status
      - tenant_id
      properties:
        tenant_id:
          type: string
          description: Id of the tenant. This will be used for performing tenant level operations such as createPolicy, createScript, onboardCloudAccount and so on.
        name:
          type: string
          description: Unique name of the tenant provided as input while creating.
        description:
          type: string
          description: Description of the tenant.
        account_id:
          type: string
          description: Id of the CoreStack account under which this tenant resides.
        is_default:
          type: boolean
          description: Is the master tenant
        fiscal_year_configuration:
          description: Fiscal Year settings
          $ref: '#/components/schemas/FiscalYearConfiguration'
        cost_anomaly_settings:
          $ref: '#/components/schemas/CostAnomalyConfiguration'
        cost_processing_settings:
          $ref: '#/components/schemas/CostProcessingSettings'
        azure_hybrid_benefits_enabled:
          type: boolean
          description: azure hybrid benefits enabled under finOps
        disk_utilization_settings:
          description: enables disk utilization configuration for specified service accounts
          $ref: '#/components/schemas/DiskUtilizationSetting'
        dimension_settings:
          type: array
          items:
            $ref: '#/components/schemas/DimensionTenantSettings'
        status:
          type: string
          description: Indicates the status of the Tenant
          example: active
          enum:
          - active
          - suspended
          x-cs-enum-type: TenantStatus
        created_at:
          type: string
          description: Created DateTime in UTC of the tenant.
        activity_queue_notifications:
          $ref: '#/components/schemas/ActivityQueueNotificationDetails'
        email_notify:
          description: Email notification configuration
          $ref: '#/components/schemas/EmailNotifyConfiguration'
        configuration_management:
          $ref: '#/components/schemas/TenantConfigurationManagementOptions'
      type: object
    CostAnomalySetting:
      properties:
        category:
          type: string
          description: Cost anomaly settings category.
          example: all
          enum:
          - all
          - product_category
          - resource_category
          x-cs-enum-type: CostAnomalySettingCategory
        category_values:
          type: array
          description: List of categories.
          items:
            type: string
        minimum_cost_spend:
          type: integer
          description: Minimum Cost Spend
          default: 0
        minimum_cost_impact:
          type: integer
          description: Minimum Cost Impact
          default: 0
        minimum_cost_impact_percentage:
          type: integer
          description: Minimum Cost Anomaly Impact Percentage
          default: 0
        cost_impact_spend_operator:
          type: string
          description: Cost Impact and Spend condition
          default: and
          example: and
          enum:
          - and
          - or
          x-cs-enum-type: CostImpactSpendOperator
      type: object
    ObjectIdBatchRequest:
      properties:
        ids:
          type: array
          items:
            type: string
            x-cs-type: ObjectId
      type: object
    TenantCreateResponse:
      required:
      - tenant_id
      properties:
        tenant_id:
          type: string
          description: Id of the newly created tenant. This will be used for performing tenant level operations such as createPolicy, createScript, onboardCloudAccount and so on.
      type: object
    TenantAdminRoleAssignmentResponse:
      required:
      - user_id
      properties:
        user_id:
          type: string
          description: ID of the updated User
        status:
          type: string
          description: Status of user
          example: active
          enum:
          - active
          - suspended
          - deleted
          - pending_activation
          - verified
          - rejected
          x-cs-enum-type: UserStatus
      type: object
    MasterAccountTenantSummary:
      required:
      - id
      properties:
        id:
          type: string
          description: Tenant id
        name:
          type: string
          description: Name of Tenant
        status:
          type: string
          description: Indicates the status of the Tenant
          example: active
          enum:
          - active
          - suspended
          x-cs-enum-type: TenantStatus
        is_default:
          type: boolean
          description: Is this a default tenant
      type: object
    DimensionTenantSettings:
      required:
      - product
      properties:
        product:
          type: string
          description: Name of the product
          example: AppSecOps
          enum:
          - AppSecOps
          - Assessments
          - CloudOps
          - FinOps
          - FinOps_Plus
          - Product_Admin
          - SecOps
          - Self Service
          - StackOps
          x-cs-enum-type: ProductEnum
        mandate_dimension_selection:
          type: boolean
          description: Mandate Dimension Selection
      type: object
    CostProcessingSettings:
      properties:
        max_tag_value_count:
          type: integer
          description: Maximum number of unique values per tag to process for cost allocation tags
        number_of_months_to_backfill:
          type: integer
          description: Back filling value for cost processing (in months)
        is_dedicated_capacity_account:
          type: boolean
          description: Whether this account's cost-sync jobs run on dedicated capacity, isolated from the general processing backlog
      type: object
    ActivityQueueNotifications:
      properties:
        enabled:
          type: boolean
          description: Activity Queue Notifications enabled
        integrated_tool_account:
          $ref: '#/components/schemas/IntegratedToolAccount'
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
