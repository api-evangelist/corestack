              schema:
                $ref: '#/components/schemas/TenantUpdateResponse'
      summary: Update Tenant
      description: 'Deprecated: Use /v2/tenants instead. Update a tenant''s status, description & metadata using its id. No operation can be performed when a tenant is made suspended.'
      operationId: updateTenant@@@2
      parameters:
      - name: tenant_id
        in: path
        required: true
        description: Id of the CoreStack account under which the tenant to be updated.
        schema:
          type: string
      security:
