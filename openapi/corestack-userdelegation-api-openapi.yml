        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDelegationBatchResponse'
      summary: Batch User Delegation
      operationId: BatchUserDelegation
      security:
      - auth_token: []
      tags:
      - UserDelegation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
  /v1/user_delegation/master_accounts/{master_account_id}/rules/item/{rule_id}:
    parameters:
    - name: master_account_id
      in: path
      required: true
      schema:
        type: string
    - name: rule_id
      in: path
      required: true
      schema:
        type: string
    delete:
      responses:
        '500':
          description: Internal Server Error
          content:
