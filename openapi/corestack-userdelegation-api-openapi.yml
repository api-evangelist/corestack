components:
  schemas:
    UserDelegationBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/UserDelegation'
      type: object
    UserDelegationRequest:
      properties:
        source_user_groups:
          type: array
          items:
            type: string
            description: User delegation source user groups
        source_roles:
          type: array
          items:
            type: string
            description: User delegation source roles
        source_users:
          type: array
          items:
            type: string
            description: User delegation source users
        target_master_account_id:
          type: string
          description: User delegation target account master id
        target_roles:
          type: array
          items:
            type: string
            description: User delegation target roles
        target_user_groups:
          type: array
          items:
            type: string
            description: User delegation target user groups
      type: object
    UserDelegation:
      allOf:
      - $ref: '#/components/schemas/UserDelegationRequest'
      - properties:
          source_master_account_id:
            type: string
            description: User delegation source account master id
          created_at:
            type: string
            format: date-time
            description: Date and Time of Creation
          created_by:
            type: string
            description: User that created delegation
          updated_at:
            type: string
            format: date-time
            description: Date and Time of Last Update
          updated_by:
            type: string
            description: User that last updated delegation
        type: object
    UserDelegationUserGroup:
      properties:
        id:
          type: string
          description: User group id
        name:
          type: string
          description: User group name
      type: object
    UserDelegationListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/UserDelegationSortCriteria'
      type: object
    UserDelegationSummary:
      properties:
        master_account_id:
          type: string
          description: User delegation master account id
        master_account_name:
          type: string
          description: User delegation master account name
        hierarchy_level:
          type: string
          description: User delegation hierarchy level
        tenants:
          type: array
          description: Tenants in the delegation
          items:
            $ref: '#/components/schemas/UserDelegationTenant'
        user_groups:
          type: array
          description: UserGroups in the delegation
          items:
            $ref: '#/components/schemas/UserDelegationUserGroup'
      type: object
    UserDelegationTenant:
      properties:
        tenant_id:
          type: string
          description: Tenant id
        tenant_name:
          type: string
          description: Tenant name
        roles:
          type: array
          description: Delegation roles
          items:
            $ref: '#/components/schemas/UserDelegationRole'
      type: object
    UserDelegationSortCriteria:
      required:
      - column
      properties:
        column:
          type: string
          example: CreatedAt
          enum:
          - CreatedAt
          x-cs-enum-type: UserDelegationSortColumn
        ascending:
          type: boolean
      type: object
    ListResponse:
      properties:
        results:
          type: array
          description: List of result identifiers
          items:
            type: string
        next_list_context:
          description: List context
          $ref: '#/components/schemas/ListContext'
      type: object
    ListContext:
      properties:
        batch_size:
          type: integer
          description: Max number of ids in the response
        batch_offset:
          type: integer
          description: Offset of batches into the results. First batch is 0
        total:
          type: integer
          description: Total number of results
      type: object
    UserDelegationResponse:
      properties:
        id:
          type: string
          description: User delegation id
      type: object
    UserDelegationRole:
      properties:
        id:
          type: string
          description: Role id
        name:
          type: string
          description: Role name
      type: object
    BatchRequest:
      properties:
        ids:
          type: array
          description: Identifiers to fetch
          items:
            type: string
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
