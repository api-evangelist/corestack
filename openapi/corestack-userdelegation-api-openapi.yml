        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDelegationSummary'
      summary: Get User Delegation Report
      description: Get user delegation report
      operationId: GetUserDelegationReport
      security:
      - auth_token: []
      tags:
