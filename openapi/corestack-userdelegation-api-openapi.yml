          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDelegationResponse'
      summary: Create User Delegation
      description: Creates a new user delegation
      operationId: CreateUserDelegation
      security:
      - auth_token: []
      tags:
      - UserDelegation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDelegationRequest'
