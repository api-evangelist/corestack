openapi: 3.2.0
info:
  title: CoreStack External Users API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: User Management - CRUD, listing and search
servers:
- url: /
tags:
- name: Users
  description: User Management - CRUD, listing and search
paths:
  /users/create:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
      summary: Create User
      description: Creates an user within a CoreStack account and assign different roles for different tenants. There can be multiple tenants within a CoreStack account. User will be created at the account level and mapped to multiple tenants as needed.
      operationId: CreateUser
      security:
      - auth_token: []
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
  /users/delete/{user_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    delete:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: boolean
      summary: Delete User
      description: Deletes the User from CoreStack system. This operation cannot be undone.
      operationId: DeleteUser
      security:
      - auth_token: []
      tags:
      - Users
  /users/filter-options:
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptions'
      summary: List Users
      description: List all tenants, cloud providers and cloud accounts available within a CoreStack account.
      operationId: ListUserFilterOptions
      security:
      - auth_token: []
      tags:
      - Users
  /users/filter-options-light:
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptionsLight'
      summary: List Users
      description: List all tenants with limited details within a CoreStack account.
      operationId: ListUserFilterOptionsLight
      security:
      - auth_token: []
      tags:
      - Users
  /users/list:
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseList'
      summary: List Users
      description: List all users within a CoreStack account.
      operationId: ListUser
      parameters:
      - description: Specify the master account id
        name: master_account_id
        in: query
        schema:
          type: string
      security:
      - auth_token: []
      tags:
      - Users
  /users/summary/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryBatchResponse'
      summary: User Batch
      description: User Summary Batch
      operationId: UserSummaryBatch
      security:
      - auth_token: []
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
  /users/update/{user_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    put:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponse'
      summary: Update User
      description: Updates a user and their role assignment in multiple tenants.
      operationId: UpdateUser
      security:
      - auth_token: []
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
  /users/view/{user_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDescribeResponse'
      summary: Describe User
      description: Describes an User by ID. This provides detailed information about a user
      operationId: DescribeUser
      security:
      - auth_token: []
      tags:
      - Users
  /v2/users/batch:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBatchResponse'
      summary: Users Batch by ids
      description: Fetch full user details for a list of user IDs.
      operationId: UsersBatch
      security:
      - auth_token: []
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectIdBatchRequest'
        required: true
  /v2/users/list:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
      summary: List Users
      description: List users with cursor-based pagination and filters.
      operationId: ListUsersNew
      security:
      - auth_token: []
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserListRequest'
        required: true
components:
  schemas:
    UserFilters:
      properties:
        search:
          type: string
          description: Text search across username, first_name, last_name, email
        status:
          type: string
          description: Filter by user status
        role_id:
          type: string
          description: Filter by role id
          x-cs-type: ObjectId
        created_after:
          type: string
          description: Filter users created on or after this date (YYYY-MM-DD)
        updated_after:
          type: string
          description: Filter users updated on or after this date (YYYY-MM-DD)
      type: object
    FilterOptionsForSaasBase:
      properties:
        saas_accounts:
          type: array
          description: List of accounts for this SaaS Provider
          items:
            $ref: '#/components/schemas/FilterOptionsSaasAccount'
        currencies:
          type: array
          description: Currencies
          items:
            type: string
            description: currency of the cost. Example 'currency':'USD'
            example: AED
            enum:
            - AED
            - ALL
            - ARS
            - AUD
            - BAM
            - BDT
            - BGN
            - BHD
            - BRL
            - CAD
            - CHF
            - CLP
            - CNY
            - COP
            - CRC
            - CZK
            - DKK
            - EGP
            - EUR
            - GBP
            - HKD
            - HRK
            - HUF
            - IDR
            - ILS
            - INR
            - ISK
            - JPY
            - KES
            - KRW
            - KWD
            - KZT
            - MOP
            - MVR
            - MXN
            - MYR
            - NOK
            - NZD
            - OMR
            - PEN
            - PHP
            - PKR
            - PLN
            - QAR
            - RON
            - RSD
            - RUB
            - SAR
            - SEK
            - SGD
            - THB
            - TRY
            - TWD
            - USD
            - VND
            - ZAR
            x-cs-enum-type: Currency
      type: object
    ObjectIdBatchRequest:
      properties:
        ids:
          type: array
          items:
            type: string
            x-cs-type: ObjectId
      type: object
    FilterOptionsTenant:
      allOf:
      - $ref: '#/components/schemas/FilterOptionsBase'
      - properties:
          cloud_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsCloudProvider'
          integrated_tool_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsIntegratedToolProvider'
          ai_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsForSaasAiServices'
          data_service_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsForSaasDataServices'
          other_service_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsForSaasOtherServices'
          dimension_cost_centers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsDimensionCostCenterAccount'
          container_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsContainerProviders'
          platform_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsPlatformProvider'
        type: object
    UserSummaryBatchResponse:
      properties:
        results:
          type: object
          description: Map from identifier to response model
          additionalProperties:
            $ref: '#/components/schemas/UserSummary'
      type: object
    UserListRequest:
      properties:
        list_context:
          description: Optional list context
          $ref: '#/components/schemas/ListContext'
        sort:
          type: array
          description: Sort criteria
          items:
            $ref: '#/components/schemas/UserSortCriteria'
        filters:
          description: Filters for the request
          $ref: '#/components/schemas/UserFilters'
      type: object
    FilterOptionsDimensionCostCenterAccount:
      properties:
        status:
          type: string
          description: Indicates the status of the cloud account in corestack
          example: not_validated
          enum:
          - not_validated
          - validated
          - not_onboarded
          - not_onboarded_validated
          - active
          - inactive
          - retired
          - deleting
          x-cs-enum-type: ServiceAccountStatus
        service_account_id:
          type: string
          description: ID of the account
        service_account_name:
          type: string
          description: Name of the account
        currency:
          type: string
          description: Currency for the account
          example: AED
          enum:
          - AED
          - ALL
          - ARS
          - AUD
          - BAM
          - BDT
          - BGN
          - BHD
          - BRL
          - CAD
          - CHF
          - CLP
          - CNY
          - COP
          - CRC
          - CZK
          - DKK
          - EGP
          - EUR
          - GBP
          - HKD
          - HRK
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KES
          - KRW
          - KWD
          - KZT
          - MOP
          - MVR
          - MXN
          - MYR
          - NOK
          - NZD
          - OMR
          - PEN
          - PHP
          - PKR
          - PLN
          - QAR
          - RON
          - RSD
          - RUB
          - SAR
          - SEK
          - SGD
          - THB
          - TRY
          - TWD
          - USD
          - VND
          - ZAR
          x-cs-enum-type: Currency
        scope:
          type: string
          description: Scope of the account
          example: global
          enum:
          - global
          - account
          - tenant
          x-cs-enum-type: ServiceAccountScope
      type: object
    FilterOptionsContainerProviders:
      allOf:
      - $ref: '#/components/schemas/FilterOptionsCloudProvider'
      - properties: {}
        type: object
    FilterOptionsTenantLight:
      allOf:
      - $ref: '#/components/schemas/FilterOptionsBase'
      - properties:
          cloud_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsCloudProviderLight'
          ai_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsForSaasAiServices'
          data_service_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsForSaasDataServices'
          other_service_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsForSaasOtherServices'
          dimension_currencies:
            type: array
            description: Currencies
            items:
              type: string
              description: currency of the cost. Example 'currency':'USD'
              example: AED
              enum:
              - AED
              - ALL
              - ARS
              - AUD
              - BAM
              - BDT
              - BGN
              - BHD
              - BRL
              - CAD
              - CHF
              - CLP
              - CNY
              - COP
              - CRC
              - CZK
              - DKK
              - EGP
              - EUR
              - GBP
              - HKD
              - HRK
              - HUF
              - IDR
              - ILS
              - INR
              - ISK
              - JPY
              - KES
              - KRW
              - KWD
              - KZT
              - MOP
              - MVR
              - MXN
              - MYR
              - NOK
              - NZD
              - OMR
              - PEN
              - PHP
              - PKR
              - PLN
              - QAR
              - RON
              - RSD
              - RUB
              - SAR
              - SEK
              - SGD
              - THB
              - TRY
              - TWD
              - USD
              - VND
              - ZAR
              x-cs-enum-type: Currency
          container_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsCloudProviderLight'
          platform_providers:
            type: array
            items:
              $ref: '#/components/schemas/FilterOptionsPlatformProviderLight'
        type: object
    RoleAssignment:
      required:
      - roles
      - tenant_id
      - tenant_name
      properties:
        tenant_name:
          type: string
          description: Name of the tenant within the CoreStack account
        tenant_id:
          type: string
          description: ID of the tenant within the CoreStack account
        roles:
          type: array
          description: List of roles for this tenant. User can have multiple roles within a tenant
          items:
            $ref: '#/components/schemas/RoleAssignmentRole'
      type: object
    ServiceAccountNativeDetailsBase:
      required:
      - type
      properties: {}
      discriminator:
        propertyName: type
      type: object
      x-cs-subtypes:
      - subtype_model: ServiceAccountNativeDetailsBaseForCostCenter
        subtype_name: ServiceAccountNativeDetailsBaseForCostCenter
