    UserDescribeResponse:
      required:
      - email
      - first_name
      - last_name
      - role_assignment
      - status
      - timezone_id
      - user_id
      - username
      properties:
        user_id:
          type: string
          description: ID of the User. This is an auto generated and unique in the CoreStack system
        username:
          type: string
          description: Username is unique in the CoreStack system. User can use this to login to CoreStack portal in addition to email
        status:
          type: string
          description: Current Status of the user - active or inactive. Inactive user cannot login or use AccessKeys.
        email:
          type: string
          description: Email of the User. This is unique in the CoreStack system.
        first_name:
          type: string
          description: First Name of the user. It can be only alphanumeric.
        last_name:
          type: string
          description: Last Name of the user. It can be only alphanumeric.
        role_assignment:
          type: array
          description: List of roles assignments for the user. The same user can be assigned different roles in different tenants
          items:
            $ref: '#/components/schemas/RoleAssignment'
        timezone_id:
          type: string
          description: ID of the Timezone such as Asia/Kolkata, Asia/Dubai and so on
        created_by:
          type: string
          description: Name of the user/admin who created this user
        created_at:
          type: string
          description: DateTime when the user was created
        updated_by:
          type: string
          description: Name of the user/admin last updated this user
        updated_at:
          type: string
          description: DateTime when the user was last updated
        sso_userid:
          type: string
          description: User's Single Sign-on Id, if CoreStack is deployed using SingleSignOn (SSO) model
        account_id:
          type: string
          description: ID of the Account in CoreStack. It will be available in the authToken API response
        is_accesskey_available:
          type: boolean
          description: Is Access Key available for this user.
        source_user_id:
          type: string
          description: source user id
        access_key:
          type: string
          description: Access key of the user
        valid_till:
          type: string
          description: Time till which the user access key  is valid
        last_login_time:
          type: string
          description: Time when the user was last logged in
        preferred_language:
          type: string
          description: Preferred language of the user
      type: object
    UserBatchResponse:
      properties:
