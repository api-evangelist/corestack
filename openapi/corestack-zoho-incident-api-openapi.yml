openapi: 3.2.0
info:
  title: CoreStack External Zoho Incident API
  version: 1.0.0
  termsOfService: http://corestack.io/
  license:
    name: CoreStack Inc License
    url: http://corestack.io/licenses/LICENSE-2.0.html
  description: Zoho Incident
servers:
- url: /
tags:
- name: Zoho Incident
  description: Zoho Incident
paths:
  /v1/integrations/zoho/{service_account_id}/incident/sites:
    parameters:
    - name: service_account_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZohoServiceDeskSite'
      summary: List Zoho ServiceDesk Sites
      description: List Zoho ServiceDesk Sites
      operationId: ListZohoServiceDeskSites
      security:
      - auth_token: []
      tags:
      - Zoho Incident
  /v1/integrations/zoho/{service_account_id}/incident/users:
    parameters:
    - name: service_account_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelError'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZohoServiceDeskUser'
      summary: List Zoho ServiceDesk Users
      description: List Zoho ServiceDesk Users
      operationId: ListZohoServiceDeskUsers
      security:
      - auth_token: []
      tags:
      - Zoho Incident
components:
  schemas:
    ZohoServiceDeskUser:
      properties:
        user_id:
          type: string
          description: Id of the user
        user_name:
          type: string
          description: Name for user
      type: object
    ModelError:
      required:
      - message
      properties:
        message:
          type: string
          description: Error response message.
      type: object
    ZohoServiceDeskSite:
      properties:
        key:
          type: string
          description: Key for ZOHO ServiceDesk Site
        name:
          type: string
          description: Name for ZOHO ServiceDesk Site
      type: object
  securitySchemes:
    auth_token:
      type: apiKey
      in: header
      name: X-Auth-Token
