method: searched
source: registry search across npm, PyPI, RubyGems, crates.io, Go module proxy, plus the CoreStack docs

note: >-
  CoreStack ships an 838-operation REST API and publishes code snippets for Java, Python, JavaScript
  and PHP in its reference, but it does NOT ship a maintained client library in any language. Exactly
  one first-party package exists on any public registry: a Python CLI published to PyPI as `corestack`
  under the company's former name, CloudEnablers. It has a single release, 0.2, uploaded on
  2017-12-05. That is eight and a half years before release 6.2 of the API it wraps, and 838
  operations later. Nothing on npm, RubyGems, crates.io, Maven Central, NuGet or the Go module proxy
  is first-party. The MCP integration path leans on a third-party bridge (`mcp-remote`) rather than
  anything CoreStack publishes.

