  published: '2017-12-05'
  releases_total: 1
  summary: Corestack Command Line Interface
  author: CoreStack
  author_email: customer-success@cloudenablers.com
  maintained: false
  note: >-
    First-party by attribution — CloudEnablers Inc is CoreStack's former corporate name. Built on
    the OpenStack `cliff` framework; its declared homepage still points at github.com/openstack/cliff
    rather than at anything CoreStack owns. One release, never updated. It is not referenced anywhere
    in the current documentation, which describes no CLI at all. Recorded here as the strongest
    available decay signal on this provider's developer surface: a first-party distribution
    abandoned nine years ago while the API behind it shipped twenty-four numbered releases.

